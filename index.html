<script>
const POSTS = {"b3": {"title": "겨울 가습기 세척법: 방식별 관리 주기 비교", "html": "<h1>겨울 가습기 세척법: 방식별 관리 주기 비교<\/h1>\n<div class=\"article-rich\" style=\"color:#33213f;\">\n<p style=\"color:#33213f;\">가습기 물통에 어제 넣은 물이 절반쯤 남아 있다면, 그 물은 버리고 새로 받는 게 맞습니다. 보건복지부와 질병관리본부(현 질병관리청)가 2011년 가습기살균제 사용 중단을 권고하면서 같이 낸 세척요령이 \"하루가 지난 물은 남아 있더라도 새 물로 교체\"하라고 적었어요. 물은 매일 갈고, 진동자와 물통은 이틀마다 닦고, 일주일에 한 번은 중성세제로 씻은 뒤 3번 이상 헹구는 것이 이 요령의 기본 주기입니다.<\/p>\n<p style=\"color:#33213f;\">그런데 집에 있는 가습기가 초음파식인지 가열식인지, 필터가 들어간 자연기화식인지에 따라 손볼 부품과 쓸 수 있는 세척 재료가 꽤 달라요. 이 글은 <a style=\"color:#6b2fa0;\" href=\"https://www.korea.kr/news/healthView.do?newsId=148721624\">정책브리핑에 실린 2011년 세척요령<\/a>, <a style=\"color:#6b2fa0;\" href=\"https://www.kca.go.kr/webzine/board/view?div=kca_2512&amp;linkId=954&amp;menuId=MENU00307\">한국소비자원의 가습기 13종 비교 시험<\/a>, 제조사(LG전자) 설명서와 고객 안내만 근거로 방식별 관리법을 나란히 놓았습니다. 확인한 날짜는 2026년 11월 24일이에요.<\/p>\n\n<h2>초음파·가열·복합·기화식, 관리 포인트를 한 표로<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"초음파·가열·복합·기화식, 관리 포인트를 한 표로 요약 카드: 방식마다 손볼 곳이 다르다\">\n<p style=\"color:#33213f;\">한국소비자원은 소비자시대 2025년 12월호에 실은 가습기 13종 시험에서 가습 방식을 네 가지로 나눴어요. 물을 초음파 진동으로 잘게 쪼개 뿜는 초음파식, 물을 끓여 수증기로 내보내는 가열식, 두 방식을 섞은 복합식, 그리고 기화식이에요. LG전자는 자기 회사 자연기화식을 젖은 디스크(필터)에 팬 바람을 보내 수분을 증발시키는 방식으로 설명합니다. 같은 시험의 소비자 주의사항(붙임 자료)은 방식마다 챙길 점을 따로 적었어요. 초음파식은 세균, 가열식은 물때와 화상, 기화식은 필터 쪽에 손이 갑니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">방식<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">소비자원이 짚은 관리 포인트<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">연간 유지관리비(시험 제품)<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">초음파식<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">분출구로 세균·미생물이 나올 수 있어 물통 내부와 진동자 주위를 주기적으로 세척<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">4,640~6,420원<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">가열식<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">백화현상(하얀 물때)으로 성능이 떨어지니 주기적 청소, 물이 완전히 식은 뒤 열기, 증기 화상 주의<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">72,750~91,070원<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">복합식<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">60℃ 미만 저온 가열이나 초음파로만 돌 때는 세균 방출 가능성, 물을 다 쓰기 전에 주기적으로 교체<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">15,780~189,290원<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">기화식<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">필터 쓰는 제품은 정해진 주기마다 필터 세척·교체<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">5,330~108,330원<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#33213f;\">유지관리비는 전기요금과 필터 교체비를 합친 값이고, 복합식·기화식 최고값 두 개(다이슨, LG전자)에는 공기청정 필터 교체비가 들어 있어요. 숫자를 월 단위로 나눠 보면 차이가 좀 더 실감 납니다. 초음파식은 1년 6,420원이 최고라 한 달에 535원꼴이고, 가열식은 9만 1,070원을 12로 나누면 한 달 7,589원쯤이에요. 가열식은 시험에서 수조 물이 100℃ 이상까지 올라가는 방식이고, 유지비 하한(7만 2,750원)도 네 방식 가운데 가장 높았어요. 초음파식은 유지비가 가장 낮지만, 소비자원이 세균·미생물 방출 가능성을 따로 적은 방식입니다. 표의 네 방식 모두 주기적 세척이 관리 포인트에 들어가 있어요.<\/p>\n<p style=\"color:#33213f;\">소비자원이 측정한 시간당 가습량은 제품에 따라 182~606ml로 최대 3.3배 차이가 났습니다. 가습량은 아래 물 갈기 계산에 그대로 쓰이니, 내 제품 설명서의 정격 가습량(ml/h)을 미리 적어 두면 편해요.<\/p>\n\n<h2>매일 물 갈기: 하루 지난 물을 남기지 않는 계산<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"매일 물 갈기: 하루 지난 물을 남기지 않는 계산 요약 카드: 가습량 × 시간 = 하루 받을 물\">\n<p style=\"color:#33213f;\">2011년 세척요령의 물 교환 순서는 이래요. 하루에 한 번 물을 갈고, 물통에 물을 5분의 1쯤 넣어 충분히 흔든 뒤 2번 이상 헹군 다음 새 물을 담습니다. 진동자 쪽에 고인 물은 가습기에 표시된 배출구 방향으로 기울여 모두 빼고요. 한국소비자원 주의사항도 물통의 물을 주기적으로 교체하라고 적었습니다.<\/p>\n<div style=\"background:#f6f0fa;border:1px solid #dccbe8;border-radius:14px;padding:16px 18px;margin:20px 0;color:#33213f;\">\n<h3 style=\"margin:0 0 8px;color:#33213f;\">물통 4L, 가습량 300ml/h, 밤 8시간 쓰는 경우<\/h3>\n<ol style=\"margin:0;padding-left:22px;line-height:1.8;color:#33213f;\">\n<li style=\"color:#33213f;\">하룻밤 쓰는 물: 300ml × 8시간 = 2.4L<\/li>\n<li style=\"color:#33213f;\">4L를 가득 채우면 아침에 1.6L가 남고, 이 물은 다음 날 버려야 해요.<\/li>\n<li style=\"color:#33213f;\">헹굼 물: 4L의 5분의 1 = 0.8L, 2번 이상이면 1.6L 이상<\/li>\n<li style=\"color:#33213f;\">처음부터 2.4L 남짓만 채우면 버리는 물이 거의 없고, 헹굴 때 물통이 가벼워요.<\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#33213f;\">위 300ml/h는 계산을 보여 주려고 잡은 값이에요. 소비자원 시험 범위(182~606ml/h)를 8시간에 넣으면 하룻밤 사용량은 약 1.46L에서 4.85L까지 벌어집니다. 가습량이 큰 제품이면 4L 물통을 하룻밤에 다 쓰기도 하고, 작은 제품은 절반 넘게 남기도 해요. 자기 제품의 가습량과 실제 사용 시간을 곱해 보면 \"매일 몇 L 받으면 되는지\"가 바로 나옵니다.<\/p>\n<p style=\"color:#33213f;\">어떤 물을 넣느냐는 제조사 안내가 구체적이에요. <a style=\"color:#6b2fa0;\" href=\"https://www.lge.co.kr/story/faq/humidifiers-faq\">LG전자 가습기 고객 Q&amp;A<\/a>는 수돗물과 정수기 물 모두 쓸 수 있다면서, 수돗물에는 소독용 염소 성분이 있어 고여 있어도 정수기 물보다 오래 상태가 유지된다며 수돗물을 권장했어요. 정수기 물은 자주 갈아 줄 때 쓰고, 지하수나 약수는 성분을 예측할 수 없어 자제하라고 합니다. 이 안내는 LG 제품 기준이라, 다른 회사 제품은 설명서의 권장 물 항목을 따르는 게 맞아요.<\/p>\n\n<h2>이틀·일주일·2주, 세척 주기와 순서<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"이틀·일주일·2주, 세척 주기와 순서 요약 카드: 매일 · 이틀 · 일주일\">\n<p style=\"color:#33213f;\">물을 매일 가는 것과 별개로 부품을 닦는 주기가 따로 있습니다. 2011년 요령은 세척 전에 손을 씻고, 진동자와 물통은 이틀마다 부드러운 스펀지나 천으로 닦고, 1주일에 한 번은 중성세제로 씻으라고 했어요. 세제를 쓰면 남지 않게 3번 이상 헹구고, 진동자는 세척 후 천으로 깨끗이 닦습니다. 분무유도관과 분출구도 일주일에 한 번 솔이나 천으로 닦으라고 적었어요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">주기<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">할 일<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">근거<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">매일<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">물 버리고 5분의 1 물로 2회 이상 헹군 뒤 새 물<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">2011년 세척요령<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">이틀마다<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">진동자·물통을 부드러운 스펀지나 천으로 닦기<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">2011년 세척요령<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">일주일마다<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">중성세제 세척 후 3회 이상 헹굼, 분무유도관·분출구 닦기<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">2011년 세척요령<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">2주마다(일부 제품)<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">물통·가습부 분해 청소, 세제 사용 금지<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">LG 하이드로에센셜 설명서<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#33213f;\">마지막 줄이 앞의 세 줄과 다른 이유는 제품 구조 때문이에요. LG 하이드로에센셜(정수복합식, 설명서 표기는 하이드로타워 에센셜) 설명서는 물통과 본체 가습부를 2주에 1회 이상 청소하라고 하면서, 분리한 부품에 뜨거운 물과 세제(알칼리성·산성·중성), 방향제, 계면활성제를 쓰지 말라고 적었습니다. 깨끗한 물로 씻고 부드러운 천으로 닦은 뒤 바람 잘 통하는 그늘에서 완전히 말리는 방식이에요. 같은 회사 Q&amp;A는 자동 건조 기능을 매번 쓸 때 물통을 2주에 1회 씻으라고 안내합니다.<\/p>\n<p style=\"color:#33213f;\">2011년 요령은 진동자가 있는 일반 가습기를 염두에 둔 공통 기준이고, 정수 필터나 자동 건조가 달린 최신 제품은 설명서에 적힌 주기가 우선입니다. 설명서를 잃어버렸다면 제품 라벨의 모델명으로 제조사 사이트를 찾아보세요. 이 글에 인용한 LG 하이드로에센셜 설명서도 LG전자 고객지원 서버에서 PDF로 받은 것입니다. 초음파 진동자는 LG 설명서 기준으로 손으로 만지거나 단단한 물체로 긁으면 안 되고, 물에 적신 청소솔로 부드럽게 쓸어내라고 되어 있습니다.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"가습기 세척 주기 흐름: 매일 물 교체, 이틀마다 닦기, 일주일마다 중성세제 세척과 3회 헹굼\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">2011년 세척요령의 기본 주기. 정수 필터·자동 건조 제품은 설명서 주기를 따릅니다.<\/figcaption>\n<\/figure>\n\n<h2>구연산·식초·락스, 써도 되는 것과 안 되는 것<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"구연산·식초·락스, 써도 되는 것과 안 되는 것 요약 카드: 구연산은 설명서에 있을 때만\">\n<p style=\"color:#33213f;\">세척 재료는 공식 안내끼리도 표현이 엇갈려요. 2011년 세척요령은 세제 표시 사항에서 중성세제인지 보고 쓰라면서, 락스·비누·알칼리성 세제·산성 세제·기름 성분이 있는 유기 세제는 쓰면 안 된다고 적었습니다. 이 목록에 구연산이라는 단어는 없지만 구연산은 산성이라, 이 요령만 놓고 보면 진동자와 물통에 함부로 쓸 재료는 아니에요.<\/p>\n<p style=\"color:#33213f;\">반면 제조사가 특정 부품에 구연산을 직접 지정한 경우가 있어요. <a style=\"color:#6b2fa0;\" href=\"https://www.lge.co.kr/product/care-accessories/humidifier-airwasher/ADQ74593307\">LG전자 가습 공기청정기 하부 워터링 필터 안내<\/a>는 구연산을 희석한 물에 필터를 30분 담그라고 하고, 권장량을 물 10L에 구연산 30g으로 적었습니다. 이물질이 잘 안 빠지면 1~2시간 더 담그거나 청소솔로 문지르고, 구연산이 남지 않게 흐르는 물로 충분히 헹구라고 해요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">물의 양<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">구연산(10L당 30g 비율)<\/th><th style=\"border:1px solid #dccbe8;padding:10px;background:#4a2a6b;color:#ffffff;\">계산<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">10L<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">30g<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">LG 안내 원래 값<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">5L<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">15g<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">5 × 3g<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">3L<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">9g<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">3 × 3g<\/td><\/tr>\n<tr><th style=\"border:1px solid #dccbe8;padding:10px;text-align:left;background:#f6f0fa;color:#33213f;\">2L<\/th><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">6g<\/td><td style=\"border:1px solid #dccbe8;padding:10px;color:#33213f;\">2 × 3g<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#33213f;\">10L에 30g은 물 1L당 3g이에요. \"1:10\"처럼 단위를 지운 비율로 기억하면 양이 완전히 달라지니, 물은 L, 구연산은 g으로 따로 재는 편이 정확합니다. 이 표는 LG가 그 필터에 정한 비율을 줄여 계산한 값이고, 다른 회사 제품이나 진동자에 그대로 옮겨도 된다는 뜻은 아니에요. 같은 LG라도 하이드로에센셜 설명서는 산성 세제를 금지 목록에 넣었습니다.<\/p>\n<p style=\"color:#33213f;\">식초는 이번에 읽은 정부·소비자원·제조사 자료 어디에도 가습기 세척 재료로 나오지 않았어요. 근거가 없으니 이 글에서는 권하지 않습니다. 락스는 2011년 요령이 금지 목록 맨 앞에 둔 재료이고요. 또 하나, 세척과 별개로 물통 속 물에는 아무것도 넣지 않습니다. 한국소비자원은 물 이외의 첨가물이 입자로 분해돼 호흡기로 들어가면 기관지에 염증을 일으킬 수 있다고 경고했고, <a style=\"color:#6b2fa0;\" href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6716\">질병관리청 국가건강정보포털<\/a>도 가습기살균제 사건으로 원인불명의 호흡기질환과 사망 사례가 있었다고 적고 있어요.<\/p>\n<div style=\"background:#fff4f2;border-left:4px solid #b42318;border-radius:8px;padding:14px 16px;margin:20px 0;color:#5a1a14;\">\n<strong style=\"color:#5a1a14;\">물통에 넣지 않는 것<\/strong>\n<p style=\"margin:6px 0 0;line-height:1.7;color:#5a1a14;\">살균제, 세정제, 향료, 아로마 오일처럼 물이 아닌 것은 모두 넣지 않습니다. 세척에 구연산이나 중성세제를 썼다면 다시 물을 채우기 전에 헹굼을 끝내고, 냄새나 거품이 남지 않았는지 봅니다.<\/p>\n<\/div>\n\n<h2>말리고 보관하기, 2~3일 쉰 가습기 다시 켜기<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"말리고 보관하기, 2~3일 쉰 가습기 다시 켜기 요약 카드: 2~3일 쉬었다면 씻고 켜기\">\n<p style=\"color:#33213f;\">세척만큼 자주 빠뜨리는 게 건조예요. 2011년 요령은 가습기를 쓰지 않을 때 물통과 진동자 부분의 물을 빼고 마른 상태로 보관하라고 했고, 2~3일 쓰지 않고 두었다면 물통과 진동자를 씻은 뒤 다시 쓰라고 적었습니다. 주말에 집을 비웠다가 월요일 밤에 그냥 켜는 경우가 여기에 해당해요. 소비자원도 오랫동안 보관했던 가습기는 물때와 세균이 번식했을 가능성이 높으니 세척 없이 바로 쓰지 말라고 했습니다.<\/p>\n<p style=\"color:#33213f;\">말리는 장소는 부품마다 달라요. LG 하이드로에센셜 설명서는 물통 커버·물통 케이스·미스트 케이스를 바람 잘 통하는 그늘에서 완전히 말리라고 하고, 장기간 쓰지 않을 때는 청소한 정수 필터를 일주일 이상 말린 뒤 그늘에 보관하라고 적었어요. 반대로 워터링 필터 안내는 바로 쓰지 않을 경우 햇빛에서 완전히 건조하라고 합니다. 같은 회사 안에서도 부품에 따라 그늘과 햇빛이 갈리니, 플라스틱 물통을 햇볕에 오래 두기 전에 설명서 문구를 한 번 보는 게 좋아요.<\/p>\n<ul style=\"margin:12px 0;padding-left:22px;line-height:1.8;color:#33213f;\">\n<li style=\"color:#33213f;\"><strong style=\"color:#33213f;\">자동 건조 기능이 있다면:<\/strong> LG Q&amp;A 기준 하이드로타워는 모드에 따라 2~4시간, 하이드로에센셜은 기본 6시간 동안 내부를 말립니다. 냄새의 원인을 고인 물이 상하는 것으로 보고 건조 기능을 쓰라고 안내해요.<\/li>\n<li style=\"color:#33213f;\"><strong style=\"color:#33213f;\">건조 기능이 없다면:<\/strong> 아침에 물을 버린 뒤 물통 뚜껑을 열어 두고, 진동자 쪽 물은 배출구 방향으로 기울여 빼 둡니다.<\/li>\n<li style=\"color:#33213f;\"><strong style=\"color:#33213f;\">봄에 집어넣을 때:<\/strong> 마지막 세척 후 모든 부품을 완전히 말려 물기 없이 보관하고, 겨울에 다시 꺼내면 첫 사용 전에 한 번 더 씻습니다.<\/li>\n<\/ul>\n<p style=\"color:#33213f;\">정수 필터가 있는 제품은 필터도 소모품이에요. 하이드로에센셜 설명서는 정수 필터 교체 주기를 약 3~5개월로 적고, 물의 수질과 사용 모드·시간에 따라 달라진다고 했습니다. 겨울 한 철(11월~2월, 넉 달) 내내 쓴다면 한 번은 교체 알림이 뜰 수 있는 셈이라, 필터 값까지 예산에 넣어 두면 소비자원 표의 유지관리비와 비교하기도 쉬워요.<\/p>\n\n<h2>우리 집 상황별 관리 우선순위와 적정 습도<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"우리 집 상황별 관리 우선순위와 적정 습도 요약 카드: 적정 습도 40~60%\">\n<p style=\"color:#33213f;\">어떤 방식을 쓰든 목표 습도는 같아요. 국립환경과학원 자료를 옮긴 정책브리핑 기사는 사람이 가장 쾌적하게 느끼는 습도를 40~60%로 들고, 실내가 습하면 미생물이 번식할 수 있다고 적었습니다. 소비자원도 환기되지 않는 밀폐된 공간에서 가습기를 오래 켜면 습도가 지나치게 높아져 곰팡이와 세균이 크게 늘 수 있다고 경고했어요. 습도계를 하나 두고 60%를 넘으면 가습 단계를 낮추는 식으로 쓰면 됩니다.<\/p>\n<p style=\"color:#33213f;\">상황별로 먼저 챙길 것을 나누면 이렇습니다. 아이나 반려동물이 있는 집에서 가열식을 쓴다면 화상이 첫 번째 위험이에요. 소비자원 시험에서 가열식 3개 제품의 가습 증기 최대온도는 99℃, 수조 안 물은 100℃ 이상, 제품 겉면은 55℃였습니다. 손이 닿지 않는 높이에 두고, 뚜껑은 전원을 끄고 물이 완전히 식은 뒤 엽니다. 초음파식이라면 위험이 세균 쪽에 있으니 매일 물 갈기와 이틀 주기 닦기를 거르지 않는 쪽에 신경을 쓰면 됩니다.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;\">\n<div style=\"flex:1 1 260px;background:#f6f0fa;border:1px solid #dccbe8;border-radius:14px;padding:16px;color:#33213f;\">\n<h3 style=\"margin:0 0 8px;color:#33213f;\">가열식을 쓰는 집<\/h3>\n<p style=\"margin:0;line-height:1.7;color:#33213f;\">증기 99℃, 겉면 55℃(소비자원 시험). 화상 방지가 우선이고, 하얀 물때(백화)가 쌓이면 성능이 떨어지니 설명서가 정한 방법으로 수조를 청소합니다.<\/p>\n<\/div>\n<div style=\"flex:1 1 260px;background:#f2f6fb;border:1px solid #cfdcec;border-radius:14px;padding:16px;color:#1c2f52;\">\n<h3 style=\"margin:0 0 8px;color:#1c2f52;\">초음파식을 쓰는 집<\/h3>\n<p style=\"margin:0;line-height:1.7;color:#1c2f52;\">물속 세균이 분출구로 나갈 수 있어 물 교체와 진동자 세척 주기가 우선입니다. 분무되는 습기를 얼굴 가까이에서 직접 들이마시지 않게 둡니다.<\/p>\n<\/div>\n<\/div>\n<p style=\"color:#33213f;\">자연기화식과 필터형 복합식은 필터가 관리의 중심이에요. 필터 세척 재료와 교체 주기를 설명서에서 찾아 달력에 적어 두면 겨울 내내 헷갈릴 일이 줄어듭니다. 소비자원은 가습기를 바닥이 평평하고 수평인 곳에 두고, 작동 중에는 옮기지 말고, 물은 기준선까지만 넣으라고도 했어요.<\/p>\n\n<h3>이 글을 쓰며 참고한 공식 자료<\/h3>\n<ul style=\"line-height:1.8;color:#33213f;\">\n<li style=\"color:#33213f;\"><a style=\"color:#6b2fa0;\" href=\"https://www.korea.kr/news/healthView.do?newsId=148721624\">정책브리핑, 가습기 안전하게 사용하기 위한 세척요령 (보건복지부·질병관리본부 발표, 2011년 11월 4일)<\/a><\/li>\n<li style=\"color:#33213f;\"><a style=\"color:#6b2fa0;\" href=\"https://www.kca.go.kr/webzine/board/view?div=kca_2512&amp;linkId=954&amp;menuId=MENU00307\">한국소비자원 소비자시대, 가습기 13종 품질비교 (2025년 12월)<\/a> · <a style=\"color:#6b2fa0;\" href=\"https://www.consumer.go.kr/user/ftc/consumer/scCmmUtil/79/userFileInfoDownload.do?fileDetailSn=04&amp;fileGroupNo=000224837&amp;funcType=colctInfoFunction\">붙임 4 소비자 주의사항<\/a><\/li>\n<li style=\"color:#33213f;\"><a style=\"color:#6b2fa0;\" href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148909591\">정책브리핑, 실내생활 늘어나는 겨울철 공기질 관리 (국립환경과학원 자료, 2022년 12월 20일)<\/a><\/li>\n<li style=\"color:#33213f;\"><a style=\"color:#6b2fa0;\" href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6716\">질병관리청 국가건강정보포털, 공기 오염<\/a><\/li>\n<li style=\"color:#33213f;\"><a style=\"color:#6b2fa0;\" href=\"https://www.lge.co.kr/story/faq/humidifiers-faq\">LG전자, 가습기 고객 Q&amp;A<\/a> · <a style=\"color:#6b2fa0;\" href=\"https://www.lge.co.kr/product/care-accessories/humidifier-airwasher/ADQ74593307\">하부 워터링 필터 청소 방법<\/a> · <a style=\"color:#6b2fa0;\" href=\"https://gscs-b2c.lge.com/open/downloadFile?fileId=9soGW3WqGQblxaWBgzg\">하이드로에센셜 사용설명서<\/a><\/li>\n<\/ul>\n<\/div>\n"}};
const TABS = ["b3"];
for (const id of TABS) {
  const p = POSTS[id];
  if (p) document.getElementById('ed-' + id).innerHTML = p.html;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
</html>
