const POSTS = {"b3": {"title": "선택약정 25% 비교: 공시지원금 손익분기 계산", "html": "<h1>선택약정 25% 비교: 공시지원금 손익분기 계산<\/h1>\n<div class=\"article-rich\">\n<p>새 폰을 살 때 매장에서 가장 먼저 듣는 질문이 \"지원금 받으실래요, 요금할인 받으실래요?\"예요. 기준은 하나로 줄일 수 있습니다. <strong>월 요금 × 25% × 약정 개월 수<\/strong>를 계산해서, 그 금액이 통신사 지원금보다 크면 선택약정이 이득이고 작으면 지원금이 이득이에요.<\/p>\n<p>월 55,000원 요금제라면 2년 할인 합계가 330,000원이라, 지원금이 33만 원을 넘으면 지원금 쪽이 낫습니다. 요금제가 89,000원으로 올라가면 이 선이 534,000원까지 올라가요. 아래에서는 스마트초이스와 정부 발표 자료에 나온 기준으로 두 방식을 같은 잣대에 놓고, 2025년 7월 단말기유통법 폐지 뒤에 바뀐 부분까지 숫자로 정리했습니다.<\/p>\n\n<h2>지원금과 선택약정, 같은 표에 놓고 보기<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"지원금과 선택약정, 같은 표에 놓고 보기 요약 카드: 할인이 들어가는 자리가 다르다\">\n<p>두 방식은 할인이 들어가는 자리가 달라요. 단말기 지원금은 폰값에서 한 번에 빠지고, 선택약정은 매달 요금에서 조금씩 빠집니다. 그래서 매장 견적서만 보면 지원금 쪽 숫자가 크게 보이기 쉬워요. 지원금은 한 번에 50만 원처럼 찍히고, 선택약정은 한 달에 1만 원대로 찍히니까요.<\/p>\n<p><a href=\"https://www.smartchoice.or.kr/smc/\">스마트초이스(통신요금 정보포털)<\/a> 안내를 보면 단말기 지원금은 \"구매 시 통신사에서 주는 1회성 지원금\"이고 2년 약정이 붙습니다. 선택약정은 1년 또는 2년 중에 고를 수 있고, 약정 기간 동안 매월 요금제 월정액의 25%가 빠져요. 할인율은 1년이든 2년이든 똑같이 25%입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #b9dfdb;padding:10px;background:#12324a;color:#ffffff;\">구분<\/th><th style=\"border:1px solid #b9dfdb;padding:10px;background:#dff1ef;color:#12324a;\">단말기 지원금<\/th><th style=\"border:1px solid #b9dfdb;padding:10px;background:#dff1ef;color:#12324a;\">선택약정할인<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #b9dfdb;padding:10px;text-align:left;background:#f2faf9;color:#12324a;\">할인 위치<\/th><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">단말기 가격(1회)<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">매월 통신요금<\/td><\/tr>\n<tr><th style=\"border:1px solid #b9dfdb;padding:10px;text-align:left;background:#f2faf9;color:#12324a;\">약정 기간<\/th><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">24개월<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">12개월 또는 24개월<\/td><\/tr>\n<tr><th style=\"border:1px solid #b9dfdb;padding:10px;text-align:left;background:#f2faf9;color:#12324a;\">금액 결정<\/th><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">단말기·요금제·가입유형마다 다름<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">월정액 × 25% 고정<\/td><\/tr>\n<tr><th style=\"border:1px solid #b9dfdb;padding:10px;text-align:left;background:#f2faf9;color:#12324a;\">유통점 추가지원금<\/th><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">함께 받을 수 있음<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">2025.7.22부터 함께 받을 수 있음<\/td><\/tr>\n<tr><th style=\"border:1px solid #b9dfdb;padding:10px;text-align:left;background:#f2faf9;color:#12324a;\">자급제·중고폰<\/th><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">해당 없음<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;\">신청 가능<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>지원금도 한 종류가 아니에요. 스마트초이스는 쓰던 통신사를 유지하면서 폰만 바꾸는 기기변경에는 공시지원금, 통신사까지 옮기는 번호이동에는 공시지원금에 전환지원금이 더해진다고 구분해 둡니다. 그래서 같은 폰, 같은 요금제라도 기기변경인지 번호이동인지에 따라 지원금 합계가 달라지고, 손익분기 비교 결과도 달라질 수 있어요. 견적을 받을 때 가입유형을 먼저 정해 두면 숫자를 맞춰 보기 쉽습니다.<\/p>\n<p>표에서 눈여겨볼 줄은 \"금액 결정\"이에요. 지원금은 같은 폰이라도 요금제나 번호이동 여부에 따라 금액이 달라지고, 날짜에 따라서도 바뀝니다. 스마트초이스 메인에도 공통지원금이 바뀌면 평일 13시에 알림 문자를 보내 준다는 안내가 있을 정도예요. 선택약정은 요금제만 정해지면 할인액이 바로 나오니 계산이 단순합니다.<\/p>\n\n<h2>손익분기선은 월 요금 × 25% × 24개월<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"손익분기선은 월 요금 × 25% × 24개월 요약 카드: 월정액 × 6 = 2년 손익분기선\">\n<p>비교할 때는 두 할인을 같은 기간 합계로 바꿔야 해요. 지원금은 이미 합계로 나오니 그대로 두고, 선택약정은 매달 할인액에 약정 개월 수를 곱합니다. 2년 약정이면 24, 1년 약정이면 12를 곱해요. 이 합계가 바로 \"지원금이 이 금액보다 많아야 지원금이 이득\"이 되는 선입니다.<\/p>\n<p>아래 표는 월정액별로 이 선을 계산해 둔 거예요. 요금제 이름은 통신사마다 다르니 내 요금제의 월정액(부가세 포함)만 찾아서 가장 가까운 줄을 보면 됩니다. 월정액이 표에 없으면 월정액에 6을 곱하면 2년 기준 손익분기선이 나와요. 25% × 24개월이 곧 6개월치 요금이라서 그렇습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #b9dfdb;padding:10px;background:#12324a;color:#ffffff;\">월정액<\/th><th style=\"border:1px solid #b9dfdb;padding:10px;background:#12324a;color:#ffffff;\">월 할인(25%)<\/th><th style=\"border:1px solid #b9dfdb;padding:10px;background:#12324a;color:#ffffff;\">2년 할인 합계<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">45,000원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">11,250원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">270,000원<\/td><\/tr>\n<tr><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">55,000원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">13,750원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">330,000원<\/td><\/tr>\n<tr><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">69,000원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">17,250원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">414,000원<\/td><\/tr>\n<tr><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">89,000원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">22,250원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#f2faf9;\">534,000원<\/td><\/tr>\n<tr><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">109,000원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">27,250원<\/td><td style=\"border:1px solid #b9dfdb;padding:10px;color:#12324a;background:#ffffff;\">654,000원<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>이 표가 보여 주는 경향은 분명해요. 요금제가 비쌀수록 선택약정의 2년 합계가 커지니, 고가 요금제를 오래 쓸 사람에게는 선택약정이 유리해지기 쉽습니다. 반대로 저가 요금제에서는 선이 27만 원대로 내려와서, 지원금이 조금만 붙어도 지원금 쪽이 이기는 경우가 많아요.<\/p>\n<p>하나 더 볼 게 할부수수료예요. 스마트초이스 월납부액 계산 화면은 할부수수료를 연 5.9%로 잡고 계산합니다. 지원금을 받으면 할부원금이 줄어드니 수수료도 줄고, 선택약정은 폰값 전체가 할부원금이 되니 수수료가 커져요. 할부로 살 계획이라면 손익분기선보다 지원금이 아주 조금 적은 정도는 지원금 쪽으로 기울 수 있습니다.<\/p>\n\n<h2>같은 100만 원 폰도 요금제에 따라 뒤집힌다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"같은 100만 원 폰도 요금제에 따라 뒤집힌다 요약 카드: 지원금 53만 원, 요금제만 바꿔 보기\">\n<p>스마트초이스가 예시로 든 조건을 그대로 가져와 볼게요. 출고가 100만 원 단말기를 월정액 55,000원 요금제로 사고, 통신사 공통지원금이 53만 원인 경우입니다. 할부수수료는 빼고 일시불로 샀다고 놓고, 2년 동안 내는 돈을 전부 더했어요.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;\">\n<div style=\"flex:1 1 260px;background:#eaf6f5;border:1px solid #b9dfdb;border-radius:14px;padding:16px;color:#12324a;\">\n<h3 style=\"margin:0 0 8px;color:#12324a;\">지원금 53만 원을 받으면<\/h3>\n<ul style=\"margin:0;padding-left:20px;line-height:1.8;color:#12324a;\">\n<li style=\"color:#12324a;\">폰값: 1,000,000 − 530,000 = 470,000원<\/li>\n<li style=\"color:#12324a;\">요금: 55,000원 × 24 = 1,320,000원<\/li>\n<li style=\"color:#12324a;\">2년 합계: <strong style=\"color:#12324a;\">1,790,000원<\/strong><\/li>\n<\/ul><\/div>\n<div style=\"flex:1 1 260px;background:#eef3f8;border:1px solid #c4d3e2;border-radius:14px;padding:16px;color:#12324a;\">\n<h3 style=\"margin:0 0 8px;color:#12324a;\">선택약정 25%를 고르면<\/h3>\n<ul style=\"margin:0;padding-left:20px;line-height:1.8;color:#12324a;\">\n<li style=\"color:#12324a;\">폰값: 1,000,000원<\/li>\n<li style=\"color:#12324a;\">요금: 41,250원 × 24 = 990,000원<\/li>\n<li style=\"color:#12324a;\">2년 합계: <strong style=\"color:#12324a;\">1,990,000원<\/strong><\/li>\n<\/ul><\/div>\n<\/div>\n<p>이 조건에서는 지원금 쪽이 20만 원 싸요. 차이 20만 원은 지원금 53만 원에서 선택약정 할인 합계 33만 원을 뺀 값과 똑같습니다. 손익분기선 계산만 해도 결과가 같이 나온다는 뜻이에요.<\/p>\n<p>이번엔 다른 건 그대로 두고 요금제만 월 89,000원으로 바꿔 볼게요. 지원금이 같은 53만 원이라고 가정하면 지원금 쪽은 470,000 + 2,136,000 = 2,606,000원이고, 선택약정 쪽은 1,000,000 + 66,750원 × 24(1,602,000원) = 2,602,000원이에요. 이번엔 선택약정이 4,000원 쌉니다. 실제로는 요금제가 바뀌면 지원금 금액도 같이 바뀌니, 지원금을 그 요금제 기준 금액으로 바꿔 넣고 다시 계산해야 해요.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"지원금 53만 원 기준, 55,000원 요금제는 지원금이, 89,000원 요금제는 선택약정이 근소하게 앞섭니다.\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">지원금 53만 원 기준, 55,000원 요금제는 지원금이, 89,000원 요금제는 선택약정이 근소하게 앞섭니다.<\/figcaption>\n<\/figure>\n\n<h2>2025년 7월 이후 선택약정에도 추가지원금이 붙는다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"2025년 7월 이후 선택약정에도 추가지원금이 붙는다 요약 카드: 25% 할인 + 추가지원금 가능\">\n<p>예전 계산법과 가장 크게 달라진 부분이에요. <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148946196\">과학기술정보통신부·방송통신위원회 발표(대한민국 정책브리핑)<\/a>에 따르면 2025년 7월 22일 단말기유통법이 폐지되고 개정 전기통신사업법이 시행됐어요. 통신사의 지원금 공시 의무가 없어졌고, 공시지원금의 15% 이내로 묶여 있던 유통점 추가지원금 상한도 사라졌습니다.<\/p>\n<p>선택약정 25% 할인은 그대로 남았어요. 통신사 공통지원금을 받지 않으면 예전처럼 25% 요금할인을 받을 수 있습니다. 바뀐 건 그다음이에요. 전에는 요금할인을 고르면 대리점·판매점 추가지원금을 받을 수 없었는데, 지금은 요금할인을 받으면서 유통점 추가지원금도 함께 받을 수 있습니다.<\/p>\n<div style=\"background:#12324a;border-radius:14px;padding:18px 20px;margin:20px 0;color:#ffffff;\">\n<h3 style=\"margin:0 0 10px;color:#ffffff;\">폐지 전후, 고를 수 있는 조합<\/h3>\n<p style=\"margin:0 0 6px;line-height:1.7;color:#ffffff;\">폐지 전: 공시지원금 + 추가지원금(공시의 15% 이내) 또는 25% 요금할인(추가지원금 없음)<\/p>\n<p style=\"margin:0;line-height:1.7;color:#ffffff;\">폐지 후: 공통지원금 + 추가지원금(상한 없음) 또는 25% 요금할인 + 추가지원금(상한 없음)<\/p>\n<\/div>\n<p>그러니 지금은 비교식에 추가지원금을 양쪽 모두 넣어야 해요. 지원금 쪽은 \"공통지원금 + 추가지원금\", 선택약정 쪽은 \"25% 할인 합계 + 추가지원금\"입니다. 같은 매장에서 같은 추가지원금을 양쪽에 다 준다면 공통지원금과 25% 할인 합계만 비교하면 되고, 매장이 한쪽에만 추가지원금을 얹는다면 그 금액까지 넣어서 계산해야 해요.<\/p>\n<p>공시 의무가 없어졌다고 지원금 정보를 아예 볼 수 없게 된 건 아니에요. 정부 발표에 따르면 통신사들은 요금제별·가입유형별 지원금을 예전처럼 누리집 등에 자율로 공개하기로 했습니다. 다만 \"공시\"가 아니라 \"자율 공개\"라서 금액이 바뀌는 시점이 더 잦을 수 있어요. 오늘 받은 견적은 오늘 숫자로 계산하고, 며칠 뒤 계약한다면 그날 다시 맞춰 보는 게 맞습니다.<\/p>\n<p>스마트초이스는 통신사가 공시한 공통지원금만 보여 줍니다. 추가지원금은 대리점·판매점이 자율로 정하니 매장마다 다르고, 정부 발표에서도 유통점을 통해 안내받는다고 되어 있어요. 견적을 두 곳 이상에서 받아서 같은 식에 넣어 보는 게 현실적인 방법입니다.<\/p>\n\n<h2>이런 경우엔 이쪽이 낫다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"이런 경우엔 이쪽이 낫다 요약 카드: 상황별로 유리한 쪽\">\n<p>손익분기선 계산을 실제 상황에 대 보면 결과가 대체로 몇 갈래로 나뉘어요. 아래는 공식 안내에 나온 조건을 바탕으로 자주 생기는 상황을 묶은 겁니다. 금액은 앞의 표에서 그대로 가져왔어요.<\/p>\n<ul style=\"line-height:1.8;\">\n<li><strong>약정이 끝난 폰을 계속 쓰는 경우:<\/strong> 지원금을 받을 기회 자체가 없으니 선택약정이 유일한 할인이에요. 스마트초이스는 약정 만료 뒤 단말기를 계속 쓰는 사람, 지원금 위약금 정산을 마친 사람을 신청 대상으로 적어 두었습니다. 월 55,000원 요금제라면 1년 약정만 걸어도 13,750원 × 12 = 165,000원이 빠져요.<\/li>\n<li><strong>자급제폰·해외 직구폰·중고폰:<\/strong> 전자제품 매장이나 인터넷에서 산 자급폰, 해외에서 쓰던 폰, 중고로 산 폰도 25% 할인을 받을 수 있어요. 대상인지 궁금하면 스마트초이스에서 IMEI로 조회하면 됩니다.<\/li>\n<li><strong>고가 요금제를 2년 내내 쓸 사람:<\/strong> 월 109,000원이면 선이 654,000원이라, 지원금이 이보다 적으면 선택약정이 낫습니다.<\/li>\n<li><strong>저가 요금제 + 지원금이 큰 모델:<\/strong> 월 45,000원이면 선이 270,000원이에요. 지원금이 이 금액을 넘으면 지원금 쪽이 이깁니다.<\/li>\n<\/ul>\n<p>헷갈리는 경우가 하나 더 있어요. 지원금을 주는 조건으로 처음 몇 달은 비싼 요금제를 쓰라는 경우입니다. 예를 들어 89,000원 요금제를 6개월 쓰고 55,000원으로 내리는 조건이라면 (89,000 − 55,000) × 6 = 204,000원을 지원금에서 빼고 봐야 해요. 지원금 53만 원이 실제로는 326,000원짜리 혜택이 되는 셈이라, 55,000원 요금제의 선 33만 원과 거의 같아집니다.<\/p>\n<p>1년 약정과 2년 약정 사이에서 고민한다면, 할인율은 같으니 기간만 따지면 돼요. 2년 안에 폰을 바꾸거나 통신사를 옮길 가능성이 있다면 1년 약정이 중도 해지 때 돌려낼 할인액이 적어서 부담이 덜합니다. 대신 1년마다 다시 신청해야 하니 만료 시점을 달력에 적어 두는 편이 좋아요.<\/p>\n\n<h2>스마트초이스로 내 조건 넣어 보는 순서<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"스마트초이스로 내 조건 넣어 보는 순서 요약 카드: 조회부터 계약서까지\">\n<p>직접 계산하기 귀찮다면 스마트초이스의 월납부액 비교 화면에 넣어 보면 됩니다. 2026년 11월 6일 화면 기준으로 메뉴 이름은 아래와 같았어요. 이 화면은 24개월 약정, 부가세 포함 금액으로 계산하고 유심 구입비 같은 부대비용은 넣지 않습니다.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;\">\n<div style=\"flex:1 1 180px;border:2px solid #0f6e6a;border-radius:12px;padding:14px;background:#ffffff;color:#12324a;\">\n<strong style=\"color:#0f5e5a;\">STEP 1<\/strong><h3 style=\"margin:6px 0;color:#12324a;\">대상 조회<\/h3><p style=\"margin:0;line-height:1.6;color:#12324a;\">요금할인 대상 단말기 조회에서 IMEI를 넣어 25% 할인 대상인지 봅니다.<\/p><\/div>\n<div style=\"flex:1 1 180px;border:2px solid #0f6e6a;border-radius:12px;padding:14px;background:#ffffff;color:#12324a;\">\n<strong style=\"color:#0f5e5a;\">STEP 2<\/strong><h3 style=\"margin:6px 0;color:#12324a;\">월납부액 비교<\/h3><p style=\"margin:0;line-height:1.6;color:#12324a;\">휴대폰 구매 메뉴의 월납부액 계산하기에서 단말기와 요금제를 고릅니다.<\/p><\/div>\n<div style=\"flex:1 1 180px;border:2px solid #0f6e6a;border-radius:12px;padding:14px;background:#ffffff;color:#12324a;\">\n<strong style=\"color:#0f5e5a;\">STEP 3<\/strong><h3 style=\"margin:6px 0;color:#12324a;\">견적 대조<\/h3><p style=\"margin:0;line-height:1.6;color:#12324a;\">매장 추가지원금을 양쪽에 더해 2년 합계를 다시 비교합니다.<\/p><\/div>\n<\/div>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"IMEI 대상 조회, 월납부액 비교, 매장 견적 대조 순서로 보면 됩니다.\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">IMEI 대상 조회, 월납부액 비교, 매장 견적 대조 순서로 보면 됩니다.<\/figcaption>\n<\/figure>\n<p>계약할 때는 계약서도 봐야 해요. 개정 전기통신사업법에 따라 통신사와 유통점은 지원금을 누가 어떤 방식으로 주는지, 지원금과 묶인 요금제·부가서비스 이용 조건, 초고속인터넷 결합 조건을 계약서에 적어야 합니다. 말로만 들은 조건이 계약서에 없다면 그 자리에서 적어 달라고 하세요. 이런 내용을 명확히 적지 않는 것 자체가 법 위반이에요.<\/p>\n<p>지원금 규제가 풀렸다고 아무 조건이나 허용되는 건 아니에요. 전기통신사업법으로 옮겨 온 규정에 따라 유통점은 아래 행위를 할 수 없습니다. 견적 상담 중에 이런 말이 나오면 계약을 미루고 다른 매장 견적과 비교해 보는 편이 안전해요.<\/p>\n<ul style=\"line-height:1.8;\">\n<li>사는 지역, 나이, 신체적 조건을 이유로 지원금을 다르게 주는 행위<\/li>\n<li>지원금 정보를 실제와 다르게 오해하도록 설명하는 행위<\/li>\n<li>통신사에서 판매 승낙을 받은 판매점이라는 표시를 하지 않는 행위<\/li>\n<li>특정 요금제나 부가서비스 가입을 요구하거나 강요하는 행위<\/li>\n<\/ul>\n<p>예외도 하나 있어요. 방송통신위원회가 밝힌 시행령 개정 내용에 따르면 같은 조건에서 주소·나이·장애를 이유로 지원금을 달리 주는 건 금지되지만, 노인이나 장애인 같은 디지털 소외계층에게 한시적으로 지원금을 더 얹어 주는 경우는 부당한 차별로 보지 않습니다. 부모님 폰을 바꿔 드릴 때 이런 우대 지원금이 있는지 매장에 물어볼 만한 이유예요.<\/p>\n<div style=\"background:#eaf6f5;border:1px solid #b9dfdb;border-radius:14px;padding:16px 18px;margin:20px 0;color:#12324a;\">\n<h3 style=\"margin:0 0 8px;color:#12324a;\">공식 화면 바로 열기<\/h3>\n<p style=\"margin:0 0 12px;line-height:1.7;color:#12324a;\">공통지원금과 월납부액은 스마트초이스에서, 제도 변경 내용은 정책브리핑에서 볼 수 있어요.<\/p>\n<p style=\"margin:0 0 8px;color:#12324a;\"><a class=\"official-link-btn\" href=\"https://www.smartchoice.or.kr/smc/mobile/monthlyPaymentView.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#0f5e5a;color:#ffffff;font-weight:700;text-decoration:none;\">스마트초이스 월납부액 비교하기 →<\/a><\/p>\n<p style=\"margin:0;color:#12324a;\"><a class=\"official-link-btn\" href=\"https://www.smartchoice.or.kr/smc/etc/danPage.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #0f5e5a;color:#0f5e5a;font-weight:700;text-decoration:none;\">선택약정 25% 대상 안내 보기 →<\/a><\/p>\n<\/div>\n\n<h3>참고한 공식 자료<\/h3>\n<ul>\n<li><a href=\"https://www.smartchoice.or.kr/smc/\">스마트초이스 통신요금 정보포털 (지원금 vs 선택약정 예시)<\/a><\/li>\n<li><a href=\"https://www.smartchoice.or.kr/smc/etc/danPage.do\">스마트초이스 지원금에 상응하는 요금할인 안내<\/a><\/li>\n<li><a href=\"https://www.smartchoice.or.kr/smc/mobile/monthlyPaymentView.do\">스마트초이스 월납부액 비교하기<\/a><\/li>\n<li><a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148946196\">대한민국 정책브리핑, 단통법 폐지 및 요금할인+추가지원금 (2025.7.17)<\/a><\/li>\n<li><a href=\"https://www.kmcc.go.kr/download.do?fileSeq=61662\">방송통신위원회·과기정통부 보도자료, 단말기유통법 폐지 시행<\/a><\/li>\n<li><a href=\"https://kcc.go.kr/user.do?boardId=1113&amp;boardSeq=66260&amp;dc=K00000200&amp;mode=view&amp;page=A05030000\">방송통신위원회, 전기통신사업법 시행령 개정 절차 착수<\/a><\/li>\n<\/ul>\n<\/div>\n"}};
const TABS = ["b3"];
for (const id of TABS) {
  const p = POSTS[id];
  if (p) document.getElementById('ed-' + id).innerHTML = p.html;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
