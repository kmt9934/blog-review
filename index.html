<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 검토 (블1~블6)</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:'Malgun Gothic',-apple-system,sans-serif; }
  header { background:#1e293b; border-bottom:1px solid #334155; position:sticky; top:0; z-index:10; }
  .bar { max-width:900px; margin:0 auto; padding:10px 16px 0; }
  h1.logo { font-size:17px; margin:0 0 8px; color:#fff; }
  nav.tabs { display:flex; gap:4px; overflow-x:auto; }
  nav.tabs a { flex:0 0 auto; padding:9px 16px; border-radius:10px 10px 0 0; background:#0b1120; color:#94a3b8; text-decoration:none; font-weight:700; font-size:15px; border:1px solid #334155; border-bottom:0; }
  nav.tabs a small { display:block; font-size:11px; font-weight:500; }
  nav.tabs a.on { background:#0f172a; color:#fff; border-color:#60a5fa; }
  nav.tabs a.empty { opacity:.6; }
  .wrap { max-width:900px; margin:0 auto; padding:18px 16px 40px; }
  section.tab { display:none; } section.tab.on { display:block; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .badge { background:#93c5fd; color:#1e3a8a; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .ttl { font-size:14px; color:#cbd5e1; flex:1; min-width:200px; }
  button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button.copy { background:#22c55e; color:#062b12; }
  .thumb img { width:100%; border-radius:12px; border:1px solid #334155; margin-bottom:14px; }
  .toolbar { background:#0b1120; border:1px solid #334155; border-bottom:0; border-radius:12px 12px 0 0; padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button { background:#334155; color:#e2e8f0; font-size:12px; padding:6px 10px; }
  .editor { min-height:60vh; padding:24px; outline:none; line-height:1.9; font-size:16px; background:#1e293b; border-radius:0 0 12px 12px; }
  .editor h1 { font-size:26px; line-height:1.35; margin:0 0 18px; }
  .editor h2 { font-size:21px; margin:28px 0 12px; border-bottom:1px solid #334155; padding-bottom:6px; }
  .editor h3 { font-size:18px; margin:22px 0 8px; }
  .editor li { margin:6px 0; } .editor strong { color:#fff; } .editor a { color:#93c5fd; }
  .hint { color:#94a3b8; font-size:12px; padding:10px 4px; }
  .empty-box { padding:80px 20px; text-align:center; font-size:22px; color:#94a3b8; background:#1e293b; border-radius:12px; }
  textarea.raw { display:none; width:100%; height:220px; margin:12px 0; background:#0b1120; color:#e2e8f0; border:1px solid #334155; border-radius:8px; font-size:12px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:#062b12; padding:10px 20px; border-radius:10px; font-weight:700; display:none; z-index:99; }
</style>
</head>
<body>
<header><div class="bar"><h1 class="logo">블로그 검토 · 블1~블6</h1><nav class="tabs"><a href="#b1" data-tab="b1" class="empty">블1<small>정부지원·복지·제도</small></a><a href="#b2" data-tab="b2" class="empty">블2<small>생활·살림</small></a><a href="#b3" data-tab="b3" class="empty">블3<small>돈·세금·소비</small></a><a href="#b4" data-tab="b4" class="empty">블4<small>가전·IT 사용법</small></a><a href="#b5" data-tab="b5" class="empty">블5<small>여행·지역 축제</small></a><a href="#b6" data-tab="b6" class="empty">블6<small>자동차 관리·운전 정보</small></a></nav></div></header>
<div class="wrap">
<section class="tab" id="tab-b1"><div class="top"><span class="badge">블1 · 정부지원·복지·제도</span></div><div class="empty-box">준비 중</div></section>
<section class="tab" id="tab-b2"><div class="top"><span class="badge">블2 · 생활·살림</span></div><div class="empty-box">준비 중</div></section>
<section class="tab" id="tab-b3"><div class="top"><span class="badge">블3 · 돈·세금·소비</span></div><div class="empty-box">준비 중</div></section>
<section class="tab" id="tab-b4"><div class="top"><span class="badge">블4 · 가전·IT 사용법</span></div><div class="empty-box">준비 중</div></section>
<section class="tab" id="tab-b5"><div class="top"><span class="badge">블5 · 여행·지역 축제</span></div><div class="empty-box">준비 중</div></section>
<section class="tab" id="tab-b6"><div class="top"><span class="badge">블6 · 자동차 관리·운전 정보</span></div><div class="empty-box">준비 중</div></section>
</div>
<div class="toast" id="toast">복사됨 ✓</div>
<script>
const POSTS = {};
const TABS = ["b1", "b2", "b3", "b4", "b5", "b6"];
for (const id of TABS) {
  const p = POSTS[id];
  if (p) document.getElementById('ed-' + id).innerHTML = p.html;
}
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const text = document.getElementById('ed-' + id).innerHTML;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) { const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));
document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
</html>
