<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 글 검토</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:'Malgun Gothic',-apple-system,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }
  header { background:#1e293b; border-bottom:1px solid #334155; padding:14px 20px; position:sticky; top:0; z-index:10; }
  .bar { display:flex; align-items:center; gap:14px; max-width:860px; margin:0 auto; }
  h1.logo { font-size:18px; margin:0; color:#fff; font-weight:700; }
  .badge { background:#8ab4ff; color:#0f172a; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  #copyBtn { background:#22c55e; color:#062b12; }
  .thumb-wrap { margin:18px auto; }
  .thumb-wrap img { width:100%; border-radius:12px; border:1px solid #334155; }
  .toolbar { background:#0b1120; border-bottom:1px solid #334155; padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button { background:#334155; color:#e2e8f0; font-size:12px; padding:6px 10px; }
  .toolbar button:hover { background:#475569; }
  #editor { min-height:75vh; padding:24px; outline:none; line-height:1.9; font-size:16px; background:#1e293b; }
  #editor h1 { font-size:26px; line-height:1.35; margin:0 0 18px; }
  #editor h2 { font-size:21px; margin:28px 0 12px; border-bottom:1px solid #334155; padding-bottom:6px; }
  #editor h3 { font-size:18px; margin:22px 0 8px; }
  #editor p { margin:12px 0; }
  #editor ul, #editor ol { padding-left:24px; }
  #editor li { margin:6px 0; }
  #editor strong { color:#fff; }
  #editor table { border-collapse:collapse; width:100%; margin:14px 0; }
  #editor table th, #editor table td { border:1px solid #334155; padding:8px 12px; text-align:left; }
  #editor table th { background:#0b1120; }
  .hint { color:#94a3b8; font-size:12px; padding:10px 16px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:#062b12; padding:10px 20px; border-radius:10px; font-weight:700; display:none; z-index:99; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="logo">블로그 검토</h1>
    <span class="badge">육아휴직</span>
    <div class="actions"><button id="copyBtn">HTML 복사</button></div>
  </div>
</header>
<div class="wrap">
  <div class="thumb-wrap"><img src="thumbnail.png" alt="썸네일"></div>
  <div class="toolbar">
    <button data-cmd="bold"><b>B</b></button>
    <button data-cmd="italic"><i>I</i></button>
    <button data-cmd="formatBlock" data-val="h2">제목</button>
    <button data-cmd="formatBlock" data-val="h3">소제목</button>
    <button data-cmd="formatBlock" data-val="p">본문</button>
    <button data-cmd="insertUnorderedList">• 목록</button>
  </div>
  <div id="editor" contenteditable="true"></div>
  <div class="hint">이 영역에 그냥 글을 쓰세요. 제목/소제목/굵게/목록은 위 버튼. 글을 고치면 "HTML 복사"가 그대로 반영합니다. (저장 버튼 없음 — 복사만 하면 됨)</div>
  <textarea id="rawBox" readonly style="display:none;width:100%;height:220px;margin:12px 0;background:#0b1120;color:#e2e8f0;border:1px solid #334155;border-radius:8px;font-size:12px;"></textarea>
  <div class="hint" id="rawHint" style="display:none;">⬆️ 위 박스를 길게 눌러 전체선택 → 복사하세요</div>
</div>
<div class="toast" id="toast">복사됨 ✓</div>

<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
let articleHTML = "<h1>2026년 우리 지갑이 달라진다! 국민연금·세제개편 핵심 가이드</h1>\n<p>2026년은 대한민국 국민의 생애 금융 설계가 완전히 재편되는 거대한 전환점입니다. 27년 만에 처음으로 인상되는 국민연금 보험료율부터 실거주자 보호를 목표로 하는 부동산 세제 개편까지, 이번 변화는 단순한 제도 수정을 넘어 개인의 '평생 소득'과 '자산 관리 전략'을 다시 짜야 함을 의미합니다. 정책 및 가계 경제 전문 칼럼니스트로서, 2026년 달라지는 제도가 여러분의 지갑에 미칠 실질적인 영향과 대응 전략을 데이터 중심으로 분석해 드립니다.</p>\n<hr>\n<h2>1. 국민연금 개혁: '더 내고 더 받는' 안정성 강화</h2>\n<p>이번 국민연금 개혁의 핵심은 기금 고갈에 대한 불안을 해소하면서도, 노후 소득의 하한선을 높이는 데 있습니다. 단순히 부담만 늘어나는 것이 아니라 보장성 역시 강화되는 구조입니다.</p>\n<ul>\n  <li>  <strong>보험료율의 단계적 인상:</strong> 현행 9%인 보험료율은 최종 13%를 향해 매년 0.5%p씩 인상됩니다. 그 첫걸음인 <strong>2026년에는 9.5%</strong>가 적용되며, 직장인은 회사와 절반씩 부담하여 <strong>본인 부담률은 4.75%</strong>가 됩니다.</li>\n  <li>  <strong>소득대체율 하락 추세의 반전:</strong> 주목할 점은 소득대체율(노후 연금액 비율)의 변화입니다. 당초 2028년까지 40%로 낮아질 예정이었던 소득대체율을 <strong>43%로 전격 상향</strong>했습니다. 이는 노후 소득 보장을 위해 정부가 하락 기조를 '반전'시킨 것으로, 더 내는 만큼 노후의 안정적 현금흐름을 확보할 수 있게 되었음을 의미합니다.</li>\n</ul>\n<h3>[월급별 국민연금 본인 부담액 변화 (2026년 기준)]</h3>\n<table>\n<tr><th>월 소득</th><th>현행 (9%)</th><th>2026년 (9.5%)</th><th>월 실질 증가액</th></tr>\n<tr><td>200만 원</td><td>90,000원</td><td>95,000원</td><td>+5,000원</td></tr>\n<tr><td>300만 원</td><td>135,000원</td><td>142,500원</td><td>+7,500원</td></tr>\n<tr><td>400만 원</td><td>180,000원</td><td>190,000원</td><td>+10,000원</td></tr>\n<tr><td>500만 원</td><td>225,000원</td><td>237,500원</td><td>+12,500원</td></tr>\n<p><img src=\"fig1.png\" alt=\"국민연금 개혁 핵심\" style=\"width:100%;border-radius:12px;\"></p>\n</table>\n<hr>\n<h2>2. 세대별 차등 인상과 '데이터 기반' 자동 안정화</h2>\n<p>이번 개편안에는 세대 간 형평성을 맞추기 위한 정교한 속도 조절 장치가 포함되었습니다.</p>\n<ul>\n  <li>  <strong>사회적 공정성을 위한 차등 인상:</strong> 납입 기간이 짧고 수령 시기가 가까운 <strong>50대는 연 1%씩</strong> 빠르게 인상하여 책임을 높이고, 미래 불확실성을 오래 견뎌야 하는 <strong>20대는 연 0.25%씩</strong> 천천히 인상합니다. 이는 젊은 세대의 장기적 부담을 낮추기 위한 '세대 간 상생' 조치입니다.</li>\n  <li>  <strong>정치적 결정에서 데이터 기반 조절로:</strong> 2026년부터 도입 논의가 본격화되는 '자동 안정화 장치'는 인구 구조나 기대 수명 변화에 따라 연금액을 자동 조절하는 시스템입니다. 이는 연금 고갈 방지를 위해 제도를 <strong>'정치적 이해관계'가 아닌 '객관적 데이터'</strong>에 근거하여 운영하겠다는 의지의 표명입니다.</li>\n<p><img src=\"fig2.png\" alt=\"세대별 차등 인상\" style=\"width:100%;border-radius:12px;\"></p>\n</ul>\n<hr>\n<h2>3. 2026년 세제개편: 민생 지원과 자산 형성의 기회</h2>\n<p>서민의 근로 의욕을 고취하고 청년의 자산 형성을 돕기 위한 세제 혜택은 더욱 과감해졌습니다.</p>\n<h3>근로장려금(EITC) 확대: 수혜 폭과 금액의 동시 상향</h3>\n<p>소득 요건이 대폭 완화되어 더 많은 가구가 인상된 장려금을 받게 됩니다.</p>\n<table>\n<tr><th>가구 유형</th><th>소득 요건 (개정)</th><th>기존 최대 지급액</th><th>2026년 최대 지급액</th></tr>\n<tr><td><strong>단독 가구</strong></td><td>2,600만 원 이하</td><td>165만 원</td><td><strong>180만 원</strong></td></tr>\n<tr><td><strong>홑벌이 가구</strong></td><td>3,700만 원 이하</td><td>285만 원</td><td><strong>310만 원</strong></td></tr>\n<tr><td><strong>맞벌이 가구</strong></td><td>5,200만 원 이하</td><td>330만 원</td><td><strong>360만 원</strong></td></tr>\n</table>\n<h3>생산적금융 ISA와 청년 특화 혜택</h3>\n<ul>\n  <li>  <strong>생산적금융 ISA 신설:</strong> 국내 주식, 벤처기업에 투자하는 BDC(기업성장집합투자기구) 등을 대상으로 하는 ISA가 신설됩니다. <strong>총 납입 한도가 2억 원</strong>까지 대폭 확대되어 고액 자산 형성의 허들이 낮아졌습니다.</li>\n  <li>  <strong>청년형 생산적금융 ISA:</strong> 청년층에게는 비과세 혜택에 더해 <strong>납입금의 10% 소득공제</strong>라는 파격적인 인센티브를 제공합니다.</li>\n  <li>  <strong>주거 및 노후 지원:</strong> 청년 월세 세액공제율은 <strong>17%</strong>로, 퇴직연금(IRP) 세액공제율은 <strong>15%</strong>로 각각 상향되어 청년들의 가처분 소득 증대를 직접적으로 돕습니다.</li>\n<p><img src=\"fig3.png\" alt=\"2026 세제개편 혜택\" style=\"width:100%;border-radius:12px;\"></p>\n</ul>\n<hr>\n<h2>4. 부동산 세제: '보유'에서 '거주'로의 전략적 전환</h2>\n<p>2026년부터 부동산 세금 관리의 핵심 키워드는 <strong>'실거주'</strong>입니다. 단순히 집을 오래 가지고 있는 것만으로는 절세 혜택을 온전히 누릴 수 없습니다.</p>\n<ul>\n  <li>  <strong>보유 공제의 폐지와 거주 공제 전환:</strong> 기존에는 보유 기간과 거주 기간을 각각 4%씩 인정해 주었으나, 앞으로 1세대 1주택자의 경우 <strong>연 8%의 '거주 공제'</strong> 중심으로 개편됩니다. 즉, 최대 80%의 공제를 받기 위해서는 실제 거주 기간을 채우는 것이 필수적입니다.</li>\n  <li>  <strong>실소유자 보호 강화:</strong></li>\n  <li>  <strong>종부세 부담 완화:</strong> 1세대 1주택자의 기본공제액이 12억 원에서 <strong>14억 원(시가 약 20억 원 수준)</strong>으로 상향되어 중산층의 보유세 부담이 크게 경감됩니다.</li>\n  <li>  <strong>장기 거주자 양도세 혜택:</strong> 10년 이상 거주한 1주택자(양도가액 30억 이하)는 양도세 기본공제가 기존 250만 원에서 <strong>연 2,500만 원</strong>으로 10배 확대되어 실거주자의 주거 이전 부담을 낮췄습니다.</li>\n<p><img src=\"fig4.png\" alt=\"부동산 '실거주' 전환\" style=\"width:100%;border-radius:12px;\"></p>\n</ul>\n<hr>\n<h2>5. 결론: 변화에 대응하는 가계 경제 체크리스트</h2>\n<p>2026년의 제도 변화는 우리에게 새로운 금융 전략을 요구합니다. 국가 시스템의 지속 가능성을 높이는 과정에서 제공되는 다양한 세제 혜택을 놓치지 않는 것이 핵심입니다.</p>\n<h3><strong>✔ 2026년 경제 대비 핵심 체크리스트</strong></h3>\n<ol>\n  <li> <strong>국민연금 납입액 재계획:</strong> 보험료율 0.5%p 인상에 따른 가계 현금흐름을 점검하고, 소득대체율 상향에 따른 노후 연금 수령액을 재산출해 보세요.</li>\n  <li> <strong>생산적금융 ISA 활용:</strong> 총 한도가 2억 원으로 늘어난 ISA를 통해 국내 우량주와 BDC 투자를 병행하며 비과세 및 소득공제(청년형) 혜택을 극대화하세요.</li>\n  <li> <strong>부동산 거주 전략 수정:</strong> 향후 매도 계획이 있다면 '단순 보유'가 아닌 '실거주 기간'을 최우선으로 관리해야 합니다. 연 8%의 거주 공제 혜택을 받기 위한 거주 요건을 반드시 확인하세요.</li>\n  <li> <strong>확대된 EITC 및 세액공제 확인:</strong> 완화된 소득 요건(단독 2.6천 / 홑벌이 3.7천 / 맞벌이 5.2천)에 따라 본인이 근로장려금 수혜 대상인지 확인하고, 인상된 청년 월세 및 IRP 공제율을 연말정산에 반영하세요.</li>\n</ol>\n<p>이번 개편은 고령화 사회의 파고를 넘기 위한 불가피한 조정이자, 동시에 준비된 자에게는 절세와 자산 형성의 기회가 될 것입니다. 변화하는 정책의 맥락을 정확히 짚어 더욱 견고한 가계 경제를 구축하시길 바랍니다.</p>";
editor.innerHTML = articleHTML;   // 글 미리 채움

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch(e){}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(e){ ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}
copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch(e){ ok = false; }
  if(!ok) ok = legacyCopy(text);
  if(ok) { toast.style.display='block'; setTimeout(()=>toast.style.display='none', 1500); }
  else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({block:'center'});
    alert('자동 복사가 안 돼요. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if(cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
</body>
</html>
