<script>
const POSTS = {"b3": {"title": "의료비 세액공제 계산: 총급여 3% 문턱부터", "html": "<h1>의료비 세액공제 계산: 총급여 3% 문턱부터<\/h1>\n<div class=\"article-rich\" style=\"color:#0f3d4a;\">\n<p style=\"color:#0f3d4a;\">총급여 5,000만 원인 직장인이 올해 병원비와 약값으로 250만 원을 냈다면, 의료비 세액공제로 줄어드는 세금은 15만 원입니다. 250만 원 전체가 아니라 총급여의 3%인 150만 원을 넘은 100만 원에만 15%가 붙기 때문이에요. 이 3% 문턱을 모르고 \"병원비 많이 썼으니 많이 돌려받겠지\" 하고 기대했다가 연말정산 결과를 보고 놀라는 경우가 많습니다.<\/p>\n<p style=\"color:#0f3d4a;\">11월 초면 올해 의료비가 대략 얼마인지 윤곽이 나옵니다. 이 글은 국세청 근로소득 안내와 소득세법 제59조의4, 시행령 제118조의5에 적힌 기준만 가지고, 혼자 사는 직장인, 부모님 병원비를 내는 자녀, 출산·난임 가정, 실손보험금을 받은 경우를 나눠서 계산합니다. 각 상황마다 자기 총급여와 의료비를 넣어 그대로 따라 해 볼 수 있게 계산식을 끝까지 풀었습니다. 기준은 2026년 귀속(2027년 초 연말정산), 11월 3일 공식 페이지 기준입니다.<\/p>\n\n<h2>의료비 세액공제 계산식: 3% 문턱과 공제율 표<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"의료비 세액공제 계산식: 3% 문턱과 공제율 표 요약 카드: (의료비 − 총급여 **3%**) × 공제율\">\n<p style=\"color:#0f3d4a;\"><a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=6595&cntntsId=7874\" style=\"color:#0b6e75;\">국세청 근로소득 특별세액공제 안내<\/a>에 따르면 의료비 세액공제는 근로소득이 있는 거주자가 기본공제대상자를 위해 낸 의료비 가운데 <strong style=\"color:#0f3d4a;\">총급여액의 3%를 초과하는 금액<\/strong>에 공제율을 곱해 산출세액에서 빼 줍니다. 여기서 기본공제대상자는 나이와 소득 제한을 받지 않아요. 부모님 소득이 있어 인적공제는 못 받더라도, 자녀가 낸 부모님 병원비는 의료비 공제 대상이 될 수 있다는 뜻입니다.<\/p>\n<p style=\"color:#0f3d4a;\">계산은 두 단계예요. 먼저 1년 의료비 합계에서 총급여 × 3%를 빼고, 남은 금액에 공제율을 곱합니다. 공제율과 한도는 누구를 위해 쓴 의료비인지에 따라 네 칸으로 나뉩니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #bfe3e3;padding:10px;background:#0f3d4a;color:#ffffff;\">구분<\/th><th style=\"border:1px solid #bfe3e3;padding:10px;background:#e6f4f4;color:#0f3d4a;\">공제 대상금액 한도<\/th><th style=\"border:1px solid #bfe3e3;padding:10px;background:#e6f4f4;color:#0f3d4a;\">공제율<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">일반 기본공제대상자(배우자, 7세 이상 자녀 등)<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">연 700만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">15%<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">본인, 6세 이하, 65세 이상, 장애인<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">한도 없음<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">15%<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">미숙아·선천성이상아<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">한도 없음<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">20%<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">난임시술비<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">한도 없음<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">30%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p style=\"color:#0f3d4a;\">여기서 700만 원은 공제액이 아니라 15%를 곱하기 전 금액의 한도입니다. 그래서 배우자나 7세 이상 자녀 의료비만으로 받을 수 있는 공제액은 700만 원 × 15% = 105만 원이 최대예요. 반대로 본인과 65세 이상 부모님, 6세 이하 자녀 의료비는 한도가 없어서 많이 쓸수록 공제액도 계속 커집니다.<\/p>\n<p style=\"color:#0f3d4a;\">나이 기준일이 서로 다르다는 점도 계산 전에 짚어 둘 부분입니다. <a href=\"https://www.law.go.kr/법령/소득세법/제59조의4\" style=\"color:#0b6e75;\">소득세법 제59조의4<\/a>는 6세 이하를 과세기간 개시일(1월 1일) 현재, 65세 이상을 과세기간 종료일(12월 31일) 현재 나이로 봅니다. 2026년 귀속이라면 연중에 만 65세가 되는 부모님도 12월 31일 기준으로 65세 이상이면 한도 없는 칸에 들어갑니다.<\/p>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">내 문턱 금액 먼저 적어 두기<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">총급여 3,000만 원: 3,000만 × 3% = 90만 원<\/li>\n<li style=\"color:#0f3d4a;\">총급여 5,000만 원: 5,000만 × 3% = 150만 원<\/li>\n<li style=\"color:#0f3d4a;\">총급여 8,000만 원: 8,000만 × 3% = 240만 원<\/li>\n<\/ol>\n<\/div>\n\n<h2>혼자 사는 직장인이라면: 본인 의료비만 있는 경우<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"혼자 사는 직장인이라면: 본인 의료비만 있는 경우 요약 카드: 총급여 5,000만 · 의료비 250만 → **15만 원**\">\n<p style=\"color:#0f3d4a;\">부양가족 없이 본인 의료비만 있는 경우가 계산이 가장 단순합니다. 본인 의료비는 한도가 없으니 문턱을 넘은 금액 전부에 15%를 곱하면 끝이에요. 진찰·치료비, 처방 의약품(한약 포함), 의사 처방에 따른 의료기기 구입·임차비, 보청기, 시력보정용 안경·콘택트렌즈가 모두 <a href=\"https://www.law.go.kr/법령/소득세법시행령/제118조의5\" style=\"color:#0b6e75;\">소득세법 시행령 제118조의5<\/a>에 적힌 공제 대상 의료비입니다.<\/p>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">총급여 5,000만 원, 본인 의료비 250만 원<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">문턱: 5,000만 원 × 3% = 150만 원<\/li>\n<li style=\"color:#0f3d4a;\">공제 대상: 250만 원 − 150만 원 = 100만 원<\/li>\n<li style=\"color:#0f3d4a;\">세액공제: 100만 원 × 15% = <strong style=\"color:#0f3d4a;\">15만 원<\/strong><\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#0f3d4a;\">같은 사람이 의료비로 140만 원만 썼다면 문턱 150만 원에 못 미쳐 의료비 세액공제는 0원입니다. 이렇게 공제가 하나도 안 붙는 해에는 표준세액공제와 비교해 볼 만해요. 소득세법 제59조의4 제9항은 근로소득자가 특별소득공제·특별세액공제(보험료, 의료비, 교육비 등)나 월세 세액공제를 신청하지 않으면 연 13만 원을 표준세액공제로 빼 준다고 정해 두었습니다.<\/p>\n<p style=\"color:#0f3d4a;\">그래서 혼자 사는 직장인은 의료비 공제액 하나만 보지 말고, 보험료·교육비·기부금 같은 다른 특별세액공제를 모두 더한 합계가 13만 원보다 큰지 봐야 합니다. 위 예시처럼 의료비 공제가 15만 원이면 이것만으로 13만 원을 넘으니 의료비 공제를 신청하는 쪽이 유리해요. 의료비 공제가 9만 원 정도인데 다른 특별세액공제가 없다면, 표준세액공제 13만 원이 4만 원 더 큽니다.<\/p>\n<p style=\"color:#0f3d4a;\">한 가지 더, 중도 입사나 퇴사를 했다면 근로를 제공한 기간에 쓴 의료비만 공제 대상이라고 국세청 안내에 적혀 있어요. 3월에 입사했다면 1~2월 병원비는 빼고 계산해야 숫자가 맞습니다.<\/p>\n\n<h2>부모님 병원비를 내는 자녀라면<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"부모님 병원비를 내는 자녀라면 요약 카드: 65세 이상 부모님은 **한도 없음**\">\n<p style=\"color:#0f3d4a;\">부모님 의료비를 자녀가 냈다면, 12월 31일 기준 65세 이상인 부모님 몫은 본인 의료비처럼 한도가 없습니다. 앞에서 본 대로 의료비 공제는 부모님의 나이·소득 제한을 받지 않으니, 연금 소득이 있어 인적공제 대상이 아니더라도 의료비 칸은 따로 따져 볼 수 있어요. 다만 시행령은 \"해당 근로자가 직접 부담하는\" 의료비라고 적고 있어서, 부모님이 직접 결제한 병원비는 자녀의 공제 대상이 아닙니다.<\/p>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">총급여 6,000만 원, 70세 어머니 병원비 600만 원<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">문턱: 6,000만 원 × 3% = 180만 원<\/li>\n<li style=\"color:#0f3d4a;\">공제 대상: 600만 원 − 180만 원 = 420만 원(65세 이상이라 한도 없음)<\/li>\n<li style=\"color:#0f3d4a;\">세액공제: 420만 원 × 15% = <strong style=\"color:#0f3d4a;\">63만 원<\/strong><\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#0f3d4a;\">부모님 입원비가 컸던 해에는 국민건강보험공단의 본인부담상한제도 같이 봐야 합니다. <a href=\"https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946900&mode=view\" style=\"color:#0b6e75;\">국민건강보험공단 본인부담상한제 안내<\/a>에 따르면 연간 건강보험 본인일부부담금이 소득 분위별 상한액을 넘으면 넘은 금액을 공단이 돌려줍니다. 2026년 진료분 상한액은 1분위 90만 원부터 10분위 843만 원까지이고, 요양병원 120일 초과 입원은 143만 원부터 1,096만 원까지예요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #bfe3e3;padding:10px;background:#0f3d4a;color:#ffffff;\">2026년 보험료 분위<\/th><th style=\"border:1px solid #bfe3e3;padding:10px;background:#e6f4f4;color:#0f3d4a;\">일반 상한액<\/th><th style=\"border:1px solid #bfe3e3;padding:10px;background:#e6f4f4;color:#0f3d4a;\">요양병원 120일 초과<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">1분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">90만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">143만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">2~3분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">112만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">181만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">4~5분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">173만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">245만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">6~7분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">326만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">404만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">8분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">446만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">580만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">9분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">536만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">698만 원<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">10분위<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">843만 원<\/td><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">1,096만 원<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p style=\"color:#0f3d4a;\">국세청은 이 본인부담상한제 사후환급금을 의료비 공제에서 빼야 하는 금액으로 적어 두었습니다. 공단 안내에도 초과금 지급 내역이 진료받은 사람 기준으로 국세청에 통보되고, 의료비 공제를 받은 직장가입자에게 과다공제 수정신고 안내가 갈 수 있다고 나와 있어요. 환급금이 확정되는 시기는 진료 다음 해 8월경이라, 연말정산 때 아직 받지 않은 환급금도 나중에 문제가 될 수 있다는 점을 기억해 두면 좋습니다.<\/p>\n\n<h2>아이·출산·난임 가정이라면: 공제율이 다른 칸 계산<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"아이·출산·난임 가정이라면: 공제율이 다른 칸 계산 요약 카드: 문턱은 **난임시술비**에서 가장 나중에\">\n<p style=\"color:#0f3d4a;\">아이가 있는 집은 나이에 따라 칸이 갈립니다. 1월 1일 현재 6세 이하인 자녀의 의료비는 한도 없이 15%, 7세 이상 자녀는 배우자와 같은 일반 칸이라 700만 원 한도 안에서 15%예요. 미숙아·선천성이상아 의료비는 20%, 난임시술비는 30%로 공제율이 더 높고 둘 다 한도가 없습니다. 산후조리원에 낸 비용은 출산 1회당 200만 원까지만 의료비로 인정돼요.<\/p>\n<p style=\"color:#0f3d4a;\">칸이 여러 개면 3% 문턱을 어느 칸에서 먼저 빼느냐가 중요합니다. 소득세법 제59조의4 제2항은 일반 의료비에서 먼저 문턱을 빼고, 일반 의료비가 문턱에 못 미치면 모자란 금액을 본인·6세 이하·65세 이상·장애인 칸에서, 그래도 모자라면 미숙아 칸, 마지막으로 난임시술비에서 빼도록 순서를 정했어요. 공제율이 가장 높은 난임시술비가 맨 마지막이라, 30%가 붙는 금액이 최대한 크게 남습니다.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"3% 문턱은 일반 → 본인 등 → 미숙아 → 난임시술비 순서로 채웁니다.\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">3% 문턱은 일반 → 본인 등 → 미숙아 → 난임시술비 순서로 채웁니다.<\/figcaption>\n<\/figure>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">총급여 5,000만 원, 본인 80만 원 + 난임시술비 400만 원<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">문턱 150만 원, 일반 의료비 0원이라 150만 원이 모자랍니다.<\/li>\n<li style=\"color:#0f3d4a;\">본인 의료비 80만 원에서 먼저 빼면 본인 칸은 0원, 아직 70만 원 모자람<\/li>\n<li style=\"color:#0f3d4a;\">남은 70만 원을 난임시술비에서 뺌: 400만 − 70만 = 330만 원<\/li>\n<li style=\"color:#0f3d4a;\">세액공제: 330만 원 × 30% = <strong style=\"color:#0f3d4a;\">99만 원<\/strong><\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#0f3d4a;\">같은 금액을 순서 없이 한꺼번에 계산하면 (480만 − 150만) × 15%처럼 잘못 나올 수 있는데, 법이 정한 순서대로 하면 공제율이 높은 칸이 남아 결과가 더 큽니다. 난임시술과 관련해 처방받은 의약품 구입비도 난임시술비에 포함된다고 법 조문에 적혀 있어요.<\/p>\n\n<h2>실손보험금·안경·약값이 섞인 경우<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"실손보험금·안경·약값이 섞인 경우 요약 카드: 실손보험금은 **먼저 빼고** 계산\">\n<p style=\"color:#0f3d4a;\">계산이 가장 자주 틀어지는 곳은 실손보험입니다. 시행령 제118조의5는 공제 대상 의료비에서 보험회사 등으로부터 받은 <strong style=\"color:#0f3d4a;\">실손의료보험금을 빼도록<\/strong> 정해 두었어요. 병원에 300만 원을 냈어도 실손보험으로 120만 원을 돌려받았다면 의료비는 180만 원으로 봅니다.<\/p>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">총급여 4,000만 원, 병원비 300만 원 중 실손 120만 원 수령<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">실제 의료비: 300만 − 120만 = 180만 원<\/li>\n<li style=\"color:#0f3d4a;\">문턱: 4,000만 원 × 3% = 120만 원<\/li>\n<li style=\"color:#0f3d4a;\">세액공제: (180만 − 120만) × 15% = <strong style=\"color:#0f3d4a;\">9만 원<\/strong><\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#0f3d4a;\">실손보험금을 빼지 않고 300만 원으로 계산했다면 (300만 − 120만) × 15% = 27만 원으로 18만 원이 부풀려졌을 거예요. 다른 특별세액공제가 없는 사람이라면 9만 원보다 표준세액공제 13만 원이 큰 경우도 생깁니다.<\/p>\n<p style=\"color:#0f3d4a;\">항목별 상한과 빠지는 비용도 정리해 두면 계산이 빨라집니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #bfe3e3;padding:10px;background:#0f3d4a;color:#ffffff;\">항목<\/th><th style=\"border:1px solid #bfe3e3;padding:10px;background:#e6f4f4;color:#0f3d4a;\">의료비로 넣는 금액<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">시력보정용 안경·콘택트렌즈<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">1명당 연 50만 원 이내<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">산후조리원<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">출산 1회당 200만 원 이내<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">보청기, 처방 의료기기<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">낸 금액<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">장기요양·장애인활동지원 본인부담금<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">실제 낸 본인부담금<\/td><\/tr>\n<tr><th style=\"border:1px solid #bfe3e3;padding:10px;text-align:left;background:#f4fbfb;color:#0f3d4a;\">미용·성형, 건강증진 의약품, 간병인, 외국 병원<\/th><td style=\"border:1px solid #bfe3e3;padding:10px;color:#0f3d4a;\">제외<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p style=\"color:#0f3d4a;\">예를 들어 중학생 자녀 안경을 70만 원에 맞췄다면 의료비로 넣는 금액은 50만 원입니다. 영양제 같은 건강증진 목적 의약품이나 간병인에게 준 비용은 영수증이 있어도 의료비 합계에 넣지 않아요.<\/p>\n<p style=\"color:#0f3d4a;\">반대로 놓치기 쉬운 항목도 있습니다. 노인장기요양보험의 장기요양급여 본인부담금과 장애인활동지원급여 본인부담금은 실제로 낸 금액이 의료비에 들어가요. 국세청은 장애인활동지원급여 본인부담금이 2024년 1월 1일 이후 지출분부터 대상이라고 밝혀 두었습니다. 부모님 요양 서비스 비용을 자녀가 내고 있다면, 병원 영수증만 모으지 말고 이 본인부담금도 같은 65세 이상 칸에 더해 계산해 보세요. 보청기 구입비도 금액 상한 없이 낸 만큼 들어갑니다.<\/p>\n\n<h2>세 가구 결과 비교와 12월 전 점검 순서<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"세 가구 결과 비교와 12월 전 점검 순서 요약 카드: 같은 돈이라도 **누구 몫**인지가 결과를 바꿉니다\">\n<p style=\"color:#0f3d4a;\">위에서 계산한 상황을 나란히 놓으면 차이가 분명합니다. 의료비 지출액보다 \"누구를 위해 썼는지\"와 \"총급여가 얼마인지\"가 결과를 더 크게 바꿔요.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"본인 250만 원은 15만 원, 부모님 600만 원은 63만 원, 난임 400만 원은 99만 원 공제.\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">본인 250만 원은 15만 원, 부모님 600만 원은 63만 원, 난임 400만 원은 99만 원 공제.<\/figcaption>\n<\/figure>\n<p style=\"color:#0f3d4a;\">상황 하나를 더 보면 일반 칸 한도가 왜 중요한지 보입니다. 총급여 4,000만 원(문턱 120만 원)인 사람이 배우자 수술비로 900만 원, 본인 병원비로 100만 원을 냈다고 해 볼게요. 일반 의료비 900만 원에서 문턱 120만 원을 빼면 780만 원인데 한도가 700만 원이라 700만 원만 인정되고, 본인 100만 원은 문턱이 이미 채워졌으니 전액이 들어갑니다. (700만 + 100만) × 15% = 120만 원이에요. 같은 1,000만 원이라도 배우자가 장애인이거나 65세 이상이었다면 한도가 없어 (880만 + 100만) × 15% = 147만 원이 됩니다.<\/p>\n<div style=\"background:#effafa;border:1px solid #bfe3e3;border-radius:14px;padding:16px 18px;margin:20px 0;color:#0f3d4a;\">\n<h3 style=\"margin:0 0 8px;color:#0f3d4a;\">연말정산 전에 직접 해 볼 순서<\/h3>\n<ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\">원천징수영수증이나 급여명세서로 올해 예상 총급여를 적고 3%를 곱합니다.<\/li>\n<li style=\"color:#0f3d4a;\">의료비를 일반 / 본인·6세 이하·65세 이상·장애인 / 미숙아 / 난임 네 칸으로 나눕니다.<\/li>\n<li style=\"color:#0f3d4a;\">칸마다 실손보험금, 본인부담상한제 환급금을 빼고 안경 50만 원 상한을 적용합니다.<\/li>\n<li style=\"color:#0f3d4a;\">문턱을 일반 칸부터 순서대로 빼고 칸별 공제율을 곱해 더합니다.<\/li>\n<li style=\"color:#0f3d4a;\">다른 특별세액공제와 합친 금액을 표준세액공제 13만 원과 비교합니다.<\/li>\n<\/ol>\n<\/div>\n<div style=\"background:#fff3ef;border-left:4px solid #c2410c;border-radius:8px;padding:14px 16px;margin:20px 0;color:#5a1e0b;\">\n<strong style=\"color:#5a1e0b;\">혼인·취업으로 부양가족이 바뀐 해<\/strong>\n<p style=\"margin:6px 0 0;line-height:1.7;color:#5a1e0b;\">국세청 안내에 따르면 연도 중 혼인·취업 등으로 기본공제대상자에서 빠진 가족을 위해 그 사유가 생긴 날까지 낸 의료비는 공제할 수 있습니다. 예를 들어 9월에 취업한 자녀의 1~8월 병원비를 부모가 냈다면 그 금액은 부모 쪽 의료비에 넣어 계산할 수 있어요.<\/p>\n<\/div>\n<p style=\"color:#0f3d4a;\">11월에 이 순서로 한 번 계산해 두면, 남은 두 달 동안 예정된 치료나 안경 교체를 어느 해에 하는 게 나은지 판단하기 쉬워집니다. 문턱을 이미 넘었다면 12월 지출분도 바로 15% 이상 공제로 이어지고, 문턱에 한참 못 미친다면 올해 의료비 공제는 기대하지 않는 편이 정확합니다.<\/p>\n\n<h3 style=\"color:#0f3d4a;\">이 글의 숫자 출처<\/h3>\n<ul style=\"color:#0f3d4a;\">\n<li style=\"color:#0f3d4a;\"><a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=6595&cntntsId=7874\" style=\"color:#0b6e75;\">국세청 근로소득 특별세액공제(의료비 한도·공제율·제외 비용)<\/a><\/li>\n<li style=\"color:#0f3d4a;\"><a href=\"https://www.law.go.kr/법령/소득세법/제59조의4\" style=\"color:#0b6e75;\">국가법령정보센터 소득세법 제59조의4<\/a><\/li>\n<li style=\"color:#0f3d4a;\"><a href=\"https://www.law.go.kr/법령/소득세법시행령/제118조의5\" style=\"color:#0b6e75;\">국가법령정보센터 소득세법 시행령 제118조의5<\/a><\/li>\n<li style=\"color:#0f3d4a;\"><a href=\"https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?articleNo=10946900&mode=view\" style=\"color:#0b6e75;\">국민건강보험공단 본인부담상한제 안내<\/a><\/li>\n<\/ul>\n<\/div>\n"}};

document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
