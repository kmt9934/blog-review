<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const articleHTML = "<h1>2026 에너지바우처, 겨울 난방비로 쓰는 법: 대상 확인부터 신청·잔액 조회까지<\/h1>\n<p>10월부터 에너지바우처 동절기 사용이 시작됩니다. 올해 에너지바우처는 <strong>여름·겨울 구분 없이 한 해 지원금을 사용기간 안에서 자유롭게 쓰는 방식<\/strong>이라서, 여름에 덜 쓴 금액이 있다면 겨울 난방비에 이어서 쓸 수 있습니다. 이 글에서는 한국에너지공단 에너지바우처 누리집, 정책브리핑, 복지로, 정부24의 2026년 안내를 바탕으로 <strong>대상 확인 → 신청 → 사용 방식 선택 → 잔액 조회<\/strong> 순서로 정리하고, 헷갈리기 쉬운 도시가스 요금경감과의 차이도 함께 짚어 보겠습니다.<\/p>\n\n<h2>한눈에 보는 2026년 에너지바우처<\/h2>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">항목<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">2026년 내용<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">신청 기간<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026년 6월 15일 ~ 12월 31일<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">신청 장소<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주민등록상 거주지 읍·면·동 행정복지센터 방문 또는 복지로(온라인)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">전체 사용기간<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026년 7월 1일 ~ 2027년 5월 31일 (하·동절기 구분 없이 자유롭게 사용)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">동절기 사용<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">요금차감 2026.10.1 ~ 2027.5.31 / 국민행복카드 2026.10.3 ~ 2027.5.31<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">문의<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">에너지바우처 통합 상담센터 ☎ 1600-3190 (평일 09~18시, 점심 12~13시)<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h2>1단계: 에너지바우처 대상자 확인 방법<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig1.png\" alt=\"에너지바우처 대상자 확인: 소득기준과 세대원 특성기준\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>에너지바우처는 <strong>소득기준과 세대원 특성기준을 모두<\/strong> 충족하는 세대가 받을 수 있습니다. 둘 중 하나만 해당하면 대상이 아니라는 점을 먼저 기억해 두세요.<\/p>\n<h3>① 소득기준<\/h3>\n<ul>\n<li>「국민기초생활 보장법」에 따른 <strong>생계·의료·주거·교육급여 중 하나 이상<\/strong>을 받는 수급자<\/li>\n<\/ul>\n<h3>② 세대원 특성기준 (주민등록표 등본 기준, 수급자 본인 또는 세대원 중 한 명 이상)<\/h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">구분<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">2026년 기준<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">노인<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주민등록 기준 1961년 12월 31일 이전 출생자<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">영유아<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주민등록 기준 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">장애인<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">「장애인복지법」에 따라 등록한 장애인<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">임산부<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">임신 중이거나 분만 후 6개월 미만인 여성<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">중증·희귀·중증난치질환자<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">「본인일부부담금 산정특례에 관한 기준」에 따른 질환을 가진 사람<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">한부모가족<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">「한부모가족지원법」에 따른 지원 대상자<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">소년소녀가정<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">보건복지부 소년소녀가정 지원 대상(가정위탁보호 아동 포함)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">다자녀 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">세대원 중 부 또는 모가 있고, 그 부 또는 모의 19세 미만 자녀가 2명 이상인 세대<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>지원에서 빠지거나 동절기 중복이 안 되는 경우<\/h3>\n<ul>\n<li>세대원 <strong>모두<\/strong>가 보장시설에서 급여를 받는 경우는 지원 제외입니다.<\/li>\n<li>「긴급복지지원법」에 따른 동절기 연료비('26년 10월~'27년 3월), 한국광해광업공단 연탄쿠폰('26년도), '26년도 연탄전환 에너지바우처를 받은 세대는 <strong>동절기 에너지바우처와 중복으로 받을 수 없습니다.<\/strong><\/li>\n<\/ul>\n<h3>집에서 미리 확인하는 방법: 모의진단<\/h3>\n<p>에너지바우처 누리집의 <strong>모의진단(자가진단)<\/strong> 메뉴에서 수급 여부, 세대원 특성, 제외 대상 여부를 질문에 따라 '예/아니요'로 답하면 대상 가능성을 확인할 수 있습니다. 다만 결과는 참고용이고, <strong>정확한 자격은 거주지 행정복지센터<\/strong>에서 확인해야 한다고 안내하고 있습니다.<\/p>\n\n<h2>2단계: 에너지바우처 신청 방법<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig2.png\" alt=\"에너지바우처 신청 방법: 행정복지센터 또는 복지로\" style=\"width:100%;border-radius:12px;\"><\/p>\n<h3>작년에 받으셨다면: 자동신청 여부부터 확인<\/h3>\n<p>전년도 에너지바우처를 받았고 지원기간 동안 정보 변동이 없으며 올해도 자격을 충족하면 <strong>자동 신청<\/strong>됩니다. 하지만 <strong>이사하거나 세대원 수가 바뀌는 등 정보가 달라졌다면 새로 신청<\/strong>해야 합니다. 한국에너지공단도 2025년 수급자는 자격 변동 여부를 행정복지센터나 통합 상담센터(1600-3190)로 확인해 보라고 안내하고 있습니다.<\/p>\n<h3>신청하는 3가지 방법<\/h3>\n<ol>\n<li><strong>방문 신청:<\/strong> 주민등록상 거주지 읍·면·동 행정복지센터에 대상자 본인 또는 대리인이 방문합니다.<\/li>\n<li><strong>온라인 신청:<\/strong> 복지로(www.bokjiro.go.kr)에서 신청하면 담당 공무원이 접수 처리합니다.<\/li>\n<li><strong>직권 신청:<\/strong> 거동이 불편하다면 담당 공무원이 대상자의 동의(구두 또는 서면)를 받아 대신 신청할 수 있습니다.<\/li>\n<\/ol>\n<p>대리인은 주민등록표 등본상 세대원이나 친족(8촌 이내 혈족, 4촌 이내 인척)이 될 수 있습니다. 복지로 공지에 따르면 <strong>대리 신청은 방문으로만 가능하고 온라인 대리 신청은 안 됩니다.<\/strong><\/p>\n<h3>준비물 체크리스트<\/h3>\n<ul>\n<li>[ ] 에너지이용권 발급 신청서 (행정복지센터에서 작성)<\/li>\n<li>[ ] 요금차감을 선택한다면: 가장 최근에 낸 전기·도시가스·지역난방 요금고지서 중 하나 (아파트는 관리비 고지서)<\/li>\n<li>[ ] 대리 신청이라면: 대리인 신분증 사본, 위임장<\/li>\n<li>[ ] 해당하는 경우: 7세(2019년생) 영유아는 취학면제·유예확인서, 임산부·질환자는 의료기관 진단서·확인서, 세대주가 부모가 아닌 다자녀 세대는 가족관계증명서<\/li>\n<\/ul>\n<h3>신청 전에 알아 두면 좋은 일정<\/h3>\n<ul>\n<li>신청 마감은 <strong>2026년 12월 31일<\/strong>입니다.<\/li>\n<li>포인트 생성 처리 때문에 <strong>2026년 10월 1일~2일<\/strong>과 <strong>12월 말 중 2~3일<\/strong>은 신청·재신청이 잠시 중단됩니다. 연말에 몰아서 가기보다 여유 있게 신청하는 편이 안전합니다.<\/li>\n<\/ul>\n\n<h2>3단계: 요금차감 vs 국민행복카드, 무엇을 고를까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig3.png\" alt=\"요금차감과 국민행복카드 비교\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>하절기는 전기요금 차감만 가능했지만, <strong>동절기에는 요금차감과 국민행복카드 중 하나<\/strong>를 골라 쓸 수 있습니다. 에너지바우처 누리집은 겨울에 <strong>요금이 가장 많이 나오는 에너지<\/strong>를 골라 신청하라고 안내합니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">구분<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">요금차감(가상카드)<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">국민행복카드(실물카드)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">쓸 수 있는 에너지<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">도시가스·전기·지역난방 중 1가지<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">전기·도시가스·등유·LPG·연탄 (지역난방 제외)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">동절기 사용기간<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026.10.1 ~ 2027.5.31 발행 고지서<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026.10.3 ~ 2027.5.31<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">사용 방법<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">최근 고지서를 가지고 신청하면 다음 달부터 고지서에서 자동 차감<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">카드사·은행에서 카드 발급 후 가맹점이나 요금 결제에 직접 사용<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">이런 집에 맞아요<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">도시가스·지역난방·전기로 난방하고 따로 신경 쓰고 싶지 않은 집<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">등유·LPG·연탄을 사서 쓰는 집<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>국민행복카드로 쓸 때 주의할 점<\/h3>\n<ul>\n<li><strong>등유·LPG·연탄:<\/strong> 에너지바우처 사용이 가능한 가까운 가맹점에서 사고, 배달료도 포함해 결제할 수 있습니다.<\/li>\n<li><strong>전기·도시가스:<\/strong> 전기는 한국전력(국번 없이 123) 전화 결제, 도시가스는 영업소 방문·전화(ARS)·온라인·자동이체 등으로 카드 결제가 가능합니다. 다만 회사마다 결제 방식과 받는 카드 종류가 달라서 <strong>쓰기 전에 꼭 미리 확인<\/strong>하라는 안내가 있습니다.<\/li>\n<li>은행 창구와 공과금 수납기에서는 쓸 수 없고, 다른 사람에게 빌려주면 안 됩니다.<\/li>\n<li>카드는 BC·롯데·삼성·KB국민·신한·현대카드와 각 발급 은행에서 방문 또는 전화로 발급받을 수 있습니다. 발급처는 에너지바우처 누리집 '사용안내'에서 카드사별로 확인하세요.<\/li>\n<\/ul>\n<p>참고로 동절기 이용 방식 중 <strong>실물카드 ↔ 요금차감 간 변경<\/strong>은 2027년 5월 31일까지 가능하다고 안내돼 있습니다. 써 보다가 방식이 맞지 않으면 행정복지센터에 문의해 보세요.<\/p>\n\n<h2>4단계: 에너지바우처 잔액조회 방법<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig4.png\" alt=\"에너지바우처 잔액조회: 복지로 복지지갑\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>잔액은 <strong>복지로<\/strong>에서 확인합니다. 에너지바우처 누리집의 '잔액조회' 메뉴에 있는 '복지로 잔액조회 바로가기' 버튼으로 들어가도 됩니다.<\/p>\n<ol>\n<li>복지로에 로그인합니다(간편인증, 공동인증서, 금융인증서).<\/li>\n<li><strong>복지지갑 → 나의 복지지갑<\/strong> 메뉴로 들어갑니다.<\/li>\n<li>에너지바우처(또는 연탄전환 에너지바우처) 잔액을 확인합니다.<\/li>\n<\/ol>\n<ul>\n<li>잔액조회는 <strong>에너지바우처 사용기간에만<\/strong> 가능합니다.<\/li>\n<li>어디에 얼마를 썼는지 같은 <strong>상세 이용내역<\/strong>은 에너지바우처 챗봇이나 통합 상담센터(1600-3190)로 확인할 수 있습니다.<\/li>\n<\/ul>\n\n<h2>하절기 잔액, 동절기에 이어서 쓸 수 있을까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig5.png\" alt=\"에너지바우처 하절기 잔액 동절기 사용\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>네, 가능합니다. 2026년 에너지바우처 지원금은 <strong>하·동절기 구분 없이 사용기간(2026.7.1~2027.5.31) 동안 자유롭게<\/strong> 쓸 수 있습니다. 그래서 여름 전기요금에서 차감되지 않고 남은 금액은 10월부터 겨울 난방비로 이어서 쓰게 됩니다. 올해 금액은 월별 금액이 아니라 <strong>한 해 총액<\/strong>입니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">세대원 수<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">2026년 총 지원금액<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">1인 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">295,200원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">2인 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">407,500원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">3인 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">532,700원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">4인 이상 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">701,300원<\/td><\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>세대원 수는 주민등록표 등본 기준으로 셉니다. 세대원이 늘었다면 2027년 5월 31일까지 변경 신청이 가능합니다.<\/li>\n<li>연탄쿠폰·연탄전환 에너지바우처·긴급복지 연료비를 받기로 한 세대는 에너지바우처가 하절기용 일부 금액(1인 40,700원 ~ 4인 이상 102,000원)만 지원되고 하절기에만 쓸 수 있습니다.<\/li>\n<li>요금차감은 <strong>사용기간 안에 발행(청구)된 고지서<\/strong>에만 적용됩니다. 2027년 5월 31일이 지나면 남은 금액을 쓸 수 없으니 겨울 동안 잔액을 한 번씩 확인해 두세요.<\/li>\n<\/ul>\n<p>한 가지 더, 한국에너지공단은 2026년에 <strong>사전 예외 지급<\/strong> 제도를 새로 도입했습니다. 고시원·쪽방 등에 살아 월세에 에너지 비용이 포함돼 바우처로 직접 결제하기 어려운 수급자 중 2026년 10월 말까지 바우처를 전혀 쓰지 못한 세대에 지원금 일부를 지급하는 제도입니다. 해당될 것 같다면 행정복지센터에 문의해 보세요.<\/p>\n\n<h2>에너지바우처 vs 도시가스 요금경감, 무엇이 다를까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig6.png\" alt=\"에너지바우처와 도시가스 요금경감 차이\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>이름이 비슷해 같은 제도로 생각하기 쉽지만 <strong>운영 기관, 대상, 지원 방식이 모두 다른 별개의 제도<\/strong>입니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">구분<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">에너지바우처<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">도시가스 요금경감<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">운영<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">기후에너지환경부·한국에너지공단<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">도시가스사업법 근거, 소관기관 한국가스공사<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">대상<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">기초생활수급자 + 세대원 특성기준 충족 세대<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">기초생활수급자, 차상위계층, 장애의 정도가 심한 장애인, 1~3급 국가유공자, 독립유공자, 자녀·손자녀 3인 이상 다자녀가구 등<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">지원 방식<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">연간 총액을 요금차감 또는 국민행복카드로 사용<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">매달 도시가스 사용요금에서 감면(기본요금 제외)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">지원 금액<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">세대원 수별 295,200원 ~ 701,300원(연간)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">동절기(12~3월) 월 18,000원 ~ 148,000원, 기타월(4~11월) 월 2,470원 ~ 9,900원 (자격별 상이)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">신청 기간<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026.6.15 ~ 12.31<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">상시<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">신청처<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">행정복지센터, 복지로<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주소지 도시가스사, 행정복지센터, 지방보훈청, 정부24, 복지로<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>둘 다 받을 수 있을까<\/h3>\n<p>정부24 보조금24의 도시가스 요금경감 안내에는 <strong>\"에너지바우처 대상자의 경우 동절기 월 최대 86,000원\"<\/strong>이라는 한도가 따로 적혀 있습니다. 즉 에너지바우처를 받는 세대도 도시가스 요금경감을 받을 수 있지만, <strong>경감 한도가 달라질 수 있다<\/strong>는 뜻으로 볼 수 있습니다. 우리 집에 실제로 얼마가 적용되는지는 자격과 사용량에 따라 다르니 주소지 도시가스사나 행정복지센터에서 확인해 보세요. 도시가스 요금경감은 에너지바우처와 신청처가 다른 별도 제도이니, 해당된다면 따로 신청해 두세요.<\/p>\n\n<h2>겨울 전에 해 둘 일 체크리스트<\/h2>\n<ul>\n<li>[ ] 우리 집이 기초생활수급 + 세대원 특성기준을 모두 충족하는지 확인했나요? (누리집 모의진단 활용)<\/li>\n<li>[ ] 작년 수급자라면 이사·세대원 변동이 없어 자동신청 대상인지 확인했나요?<\/li>\n<li>[ ] 겨울에 가장 많이 쓰는 에너지를 기준으로 요금차감 또는 국민행복카드를 골랐나요?<\/li>\n<li>[ ] 국민행복카드를 고른 경우 카드를 발급받고, 쓰려는 가맹점·도시가스사 결제 가능 여부를 확인했나요?<\/li>\n<li>[ ] 복지로 복지지갑에서 남은 잔액을 확인했나요?<\/li>\n<li>[ ] 도시가스를 쓴다면 도시가스 요금경감도 따로 신청했나요?<\/li>\n<li>[ ] 신청 마감(12월 31일)과 12월 말 신청 중단 기간을 달력에 적어 두었나요?<\/li>\n<\/ul>\n\n<h2>마무리<\/h2>\n<p>정리하면 2026년 에너지바우처는 <strong>수급 자격과 세대원 특성을 함께 확인하고, 12월 31일 전에 행정복지센터나 복지로에서 신청한 뒤, 겨울에 쓰는 에너지에 맞춰 요금차감이나 국민행복카드를 고르면<\/strong> 됩니다. 여름에 남은 금액도 2027년 5월 31일까지 이어서 쓸 수 있으니, 오늘 복지로에서 잔액부터 한번 확인해 보세요. 헷갈리는 부분은 통합 상담센터(☎ 1600-3190)에 물어보시면 가장 정확합니다.<\/p>\n\n<h2>출처<\/h2>\n<ul>\n<li>한국에너지공단 에너지바우처, <a href=\"https://www.energyv.or.kr/info/support_info.do\" target=\"_blank\" rel=\"noopener\">에너지바우처란?(신청대상·지원금액·신청 및 사용기간)<\/a><\/li>\n<li>한국에너지공단 에너지바우처, <a href=\"https://www.energyv.or.kr/info/apl_info.do\" target=\"_blank\" rel=\"noopener\">신청안내<\/a><\/li>\n<li>한국에너지공단 에너지바우처, <a href=\"https://www.energyv.or.kr/info/use_info.do\" target=\"_blank\" rel=\"noopener\">사용안내(요금차감·국민행복카드)<\/a><\/li>\n<li>한국에너지공단 에너지바우처, <a href=\"https://www.energyv.or.kr/info/balance_inquiry.do\" target=\"_blank\" rel=\"noopener\">잔액조회<\/a> · <a href=\"https://www.energyv.or.kr/info/energyv_smu.do\" target=\"_blank\" rel=\"noopener\">모의진단<\/a><\/li>\n<li>대한민국 정책브리핑, <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148966678\" target=\"_blank\" rel=\"noopener\">6월 15일부터 에너지바우처 신청하세요!(기후에너지환경부, 2026.6.17)<\/a><\/li>\n<li>한국에너지공단 보도자료, <a href=\"https://www.energy.or.kr/front/board/View3.do?boardMngNo=3&amp;boardNo=10024988\" target=\"_blank\" rel=\"noopener\">'26년도 에너지바우처 신청·접수 시작(2026.6.22)<\/a><\/li>\n<li>복지로 공지사항, <a href=\"https://www.bokjiro.go.kr/ssis-tbu/cms/pc/customer/notice/1309896_1141.html\" target=\"_blank\" rel=\"noopener\">2026년 에너지바우처 신청 안내(2026.6.11)<\/a><\/li>\n<li>정부24 보조금24, <a href=\"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/B55121000003\" target=\"_blank\" rel=\"noopener\">사회적 배려대상자 도시가스요금 경감(최종수정 2026.7.28)<\/a><\/li>\n<\/ul>";

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}

copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  } else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({ block: 'center' });
    alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
</body>
</html>
