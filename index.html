<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 근로장려금 글 검토</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:'Malgun Gothic',-apple-system,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }
  header { background:#1e293b; border-bottom:1px solid #334155; padding:14px 20px; position:sticky; top:0; z-index:10; }
  .bar { display:flex; align-items:center; gap:14px; max-width:860px; margin:0 auto; }
  h1.logo { font-size:18px; margin:0; color:#fff; font-weight:700; }
  .badge { background:#8ab4ff; color:#0f172a; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  #copyBtn { background:#22c55e; color:#062b12; }
  .thumb-wrap { margin:18px auto; }
  .thumb-wrap img { width:100%; border-radius:12px; border:1px solid #334155; }
  .toolbar { background:#0b1120; border-bottom:1px solid #334155; padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button { background:#334155; color:#e2e8f0; font-size:12px; padding:6px 10px; }
  .toolbar button:hover { background:#475569; }
  #editor { min-height:75vh; padding:24px; outline:none; line-height:1.9; font-size:16px; background:#1e293b; }
  #editor h1 { font-size:26px; line-height:1.35; margin:0 0 18px; }
  #editor h2 { font-size:21px; margin:28px 0 12px; border-bottom:1px solid #334155; padding-bottom:6px; }
  #editor h3 { font-size:18px; margin:22px 0 8px; }
  #editor p { margin:12px 0; }
  #editor ul, #editor ol { padding-left:24px; }
  #editor li { margin:6px 0; }
  #editor strong { color:#fff; }
  #editor table { border-collapse:collapse; width:100%; margin:14px 0; }
  #editor table th, #editor table td { border:1px solid #334155; padding:8px 12px; text-align:left; }
  #editor table th { background:#0b1120; }
  .hint { color:#94a3b8; font-size:12px; padding:10px 16px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:#062b12; padding:10px 20px; border-radius:10px; font-weight:700; display:none; z-index:99; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="logo">블로그 검토</h1>
    <span class="badge">근로장려금</span>
    <div class="actions"><button id="copyBtn">HTML 복사</button></div>
  </div>
</header>
<div class="wrap">
  <div class="thumb-wrap"><img src="thumbnail.png" alt="썸네일"></div>
  <div class="toolbar">
    <button data-cmd="bold"><b>B</b></button>
    <button data-cmd="italic"><i>I</i></button>
    <button data-cmd="formatBlock" data-val="h2">제목</button>
    <button data-cmd="formatBlock" data-val="h3">소제목</button>
    <button data-cmd="formatBlock" data-val="p">본문</button>
    <button data-cmd="insertUnorderedList">• 목록</button>
  </div>
  <div id="editor" contenteditable="true"></div>
  <div class="hint">이 영역에 그냥 글을 쓰세요. 제목/소제목/굵게/목록은 위 버튼. 글을 고치면 "HTML 복사"가 그대로 반영합니다. (저장 버튼 없음 — 복사만 하면 됨)</div>
  <textarea id="rawBox" readonly style="display:none;width:100%;height:220px;margin:12px 0;background:#0b1120;color:#e2e8f0;border:1px solid #334155;border-radius:8px;font-size:12px;"></textarea>
  <div class="hint" id="rawHint" style="display:none;">⬆️ 위 박스를 길게 눌러 전체선택 → 복사하세요</div>
</div>
<div class="toast" id="toast">복사됨 ✓</div>

<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
let articleHTML = "<h1>[블로그 포스트] \"놓치면 손해!\" 근로·자녀장려금 신청 가이드: 자격부터 방법까지 한눈에 확인하기</h1>\n<h2>1. 도입부: 왜 지금 이 정보가 중요한가?</h2>\n<p>안녕하세요! 오늘은 성실하게 일하는 국민 여러분의 경제적 자립을 지원하고 가계에 활력을 불어넣어 줄 아주 소중한 정보를 가지고 왔습니다. 바로 '근로·자녀장려금' 제도입니다. 이 제도는 단순히 지원금을 지급하는 것을 넘어, 우리 사회 구성원 모두가 <strong>'일하는 즐거움'</strong>을 누리고 <strong>'가계 경제에 실질적인 도움'</strong>을 받을 수 있도록 돕는 핵심적인 복지 정책입니다. 자격 요건을 미리 꼼꼼하게 확인하시어 국가가 보장하는 여러분의 소중한 혜택을 꼭 챙기시기 바랍니다.</p>\n<h2>2. 누가 받을 수 있나요? (신청 자격 개요)</h2>\n<p><img src=\"/fig1.png\" alt=\"근로장려금 신청자격\" style=\"width:100%;border-radius:12px;\"></p>\n<p>장려금을 신청하기 위해서는 가장 먼저 본인이 어떤 소득자인지 확인해야 합니다. 기본적으로 근로소득, 사업소득 또는 종교인소득이 있는 가구가 대상입니다.</p>\n<p>심사의 핵심은 크게 두 가지로 나뉩니다. 첫째는 <strong>'소득 요건'</strong>으로, 본인뿐만 아니라 배우자의 소득까지 합산하여 심사하므로 <strong>부부 합산 소득</strong>이 기준 이내여야 합니다. 둘째는 <strong>'재산 요건'</strong>입니다. 이는 본인 한 명의 재산만 보는 것이 아니라, 가구원 전체가 보유하고 있는 재산을 모두 합친 <strong>가구원 합산 재산액</strong>을 기준으로 합니다. 이처럼 장려금은 가계 전체의 경제적 상황을 종합적으로 고려하여 실질적인 지원이 필요한 분들에게 전달되도록 설계되어 있습니다.</p>\n<h2>3. 언제 신청하나요? (2025-2026 신청 일정 총정리)</h2>\n<p><img src=\"/fig2.png\" alt=\"근로장려금 신청일정\" style=\"width:100%;border-radius:12px;\"></p>\n<p>본인의 소득 종류에 따라 신청 시기가 달라질 수 있으니 주의가 필요합니다. 특히 <strong>사업소득자와 종교인소득자는 반드시 5월 정기 신청 기간에만 신청이 가능</strong>하다는 점을 꼭 기억해 주세요.</p>\n<table><tr><th>구분</th><th>대상자</th><th>산정 대상</th><th>신청 시기</th></tr>\n<tr><td><strong>정기신청</strong></td><td>근로·사업·종교인 소득자</td><td>'25년 연간 소득 기준</td><td>'26.5.1. ~ 6.1.</td>\n</tr>\n<tr><td><strong>반기신청(상반기)</strong></td><td>근로소득자</td><td>'26년 상반기 소득 기준</td><td>'26.9.1. ~ 9.15.</td>\n</tr>\n<tr><td><strong>반기신청(하반기)</strong></td><td>근로소득자</td><td>'26년 하반기 소득 기준</td><td>'27.3.1. ~ 3.15.</td>\n</tr>\n</table>\n<hr>\n<h3><strong>💡 정기 신청 기간을 놓치셨나요?</strong></h3>\n<p>정기 신청 기간이 지났더라도 실망하지 마세요! <strong>'26.6.2.부터 12.1.까지 '기한 후 신청'</strong>이 가능합니다. 비록 정해진 기간보다는 조금 늦더라도 신청할 수 있는 기회가 열려 있으니, 잊지 말고 접수하시기 바랍니다.</p>\n<h2>4. 어떻게 신청하나요? (5가지 스마트 신청법)</h2>\n<p><img src=\"/fig3.png\" alt=\"근로장려금 신청방법\" style=\"width:100%;border-radius:12px;\"></p>\n<p>전문가가 추천하는 가장 빠르고 정확한 신청 방법 5가지를 소개합니다.</p>\n<ol>\n  <li><strong>ARS 전화(1544-9944):</strong> 안내문을 받으셨다면 이 방법이 가장 빠릅니다. 주민등록번호와 안내문의 <strong>'개별인증번호(8자리)'</strong>를 입력하는 것이 <strong>'신속 신청의 핵심 키워드'</strong>입니다. 만약 국세청에 본인 연락처가 등록되어 있다면 이 번호 입력 단계까지 생략할 수 있어 더욱 간편합니다.</li>\n  <li><strong>홈택스(PC/모바일):</strong> 안내문 수령 여부에 따라 맞춤형 경로를 제공합니다. 안내문을 받았다면 개별인증번호로 로그인하여 신청하고, 받지 못했다면 공동·금융인증서 등 본인인증을 통해 소득과 재산 자료를 직접 확인하며 신청할 수 있습니다.</li>\n  <li><strong>QR코드 및 모바일 안내문:</strong> 서면 안내문의 QR코드를 스캔하거나 카카오톡, 네이버 전자문서 등의 모바일 알림을 활용해 보세요. 별도의 로그인 없이 주민등록번호 입력만으로 즉시 신청이 완료됩니다.</li>\n  <li><strong>신청 대리 서비스:</strong> 온라인 신청이 어렵게 느껴진다면 평일 9시부터 18시 사이에 <strong>장려금 상담센터(1566-3636)</strong>나 세무서 직원에게 도움을 요청하십시오. 전문가가 친절하게 신청을 도와드립니다.</li>\n  <li><strong>자동신청 제도:</strong> 60세 이상 고령자 등을 위한 배려입니다. 신청 기간에 자동신청에 한 번만 동의해 두면, 향후 2년간 신청 안내 대상이 될 때마다 별도의 절차 없이 자동으로 신청이 접수됩니다.</li>\n</ol>\n<h2>5. 바쁜 분들을 위한 '장려금 신청 꿀팁'</h2>\n<ul>\n  <li><strong>서비스 운영 시간 확인:</strong> 신청 서비스는 <strong>오전 6시부터 밤 12시까지</strong> 넉넉하게 운영됩니다. 바쁜 일과가 끝난 늦은 저녁 시간에도 여유 있게 신청하실 수 있습니다.</li>\n  <li><strong>자동신청의 편리함:</strong> 한 번의 동의로 2년간 신청 걱정을 덜 수 있습니다. 단, 소득과 재산 요건을 충족하는 경우에만 장려금이 지급된다는 점은 유의하세요.</li>\n  <li><strong>연락처 사전 등록:</strong> 평소 국세청에 본인 연락처를 등록해 두면 ARS 신청 시 인증번호 입력 단계를 건너뛸 수 있어 신청 시간이 획기적으로 단축됩니다.</li>\n</ul>\n<h2>6. 결론 및 마무리: 당신의 권리를 챙기세요!</h2>\n<p><img src=\"/fig4.png\" alt=\"근로장려금 지급과 감액\" style=\"width:100%;border-radius:12px;\"></p>\n<p>근로·자녀장려금은 국가가 주는 선물이 아니라, 성실하게 땀 흘려 일하는 국민 여러분이 당당하게 누려야 할 <strong>'권리'</strong>입니다. 복잡한 절차 때문에 망설이지 마시고, 제공된 다양한 신청 방법을 통해 여러분의 권리를 꼭 행사하시기 바랍니다.</p>\n<p>더 궁금한 사항이 있으시다면 <strong>국세상담센터(국번 없이 126)</strong>로 문의해 주세요. 국세행정 전문가들이 여러분의 궁금증을 명쾌하게 해결해 드리겠습니다. 여러분의 건강한 가계 경제와 행복한 내일을 응원합니다!</p>";
editor.innerHTML = articleHTML;   // 글 미리 채움

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch(e){}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(e){ ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}
copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch(e){ ok = false; }
  if(!ok) ok = legacyCopy(text);
  if(ok) { toast.style.display='block'; setTimeout(()=>toast.style.display='none', 1500); }
  else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({block:'center'});
    alert('자동 복사가 안 돼요. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if(cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
</body>
</html>
