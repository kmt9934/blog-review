<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 글 검토</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:'Malgun Gothic',-apple-system,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }
  header { background:#1e293b; border-bottom:1px solid #334155; padding:14px 20px; position:sticky; top:0; z-index:10; }
  .bar { display:flex; align-items:center; gap:14px; max-width:860px; margin:0 auto; }
  h1.logo { font-size:18px; margin:0; color:#fff; font-weight:700; }
  .badge { background:#8ab4ff; color:#0f172a; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  #copyBtn { background:#22c55e; color:#062b12; }
  .thumb-wrap { margin:18px auto; }
  .thumb-wrap img { width:100%; border-radius:12px; border:1px solid #334155; }
  .toolbar { background:#0b1120; border-bottom:1px solid #334155; padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button { background:#334155; color:#e2e8f0; font-size:12px; padding:6px 10px; }
  .toolbar button:hover { background:#475569; }
  #editor { min-height:75vh; padding:24px; outline:none; line-height:1.9; font-size:16px; background:#1e293b; }
  #editor h1 { font-size:26px; line-height:1.35; margin:0 0 18px; }
  #editor h2 { font-size:21px; margin:28px 0 12px; border-bottom:1px solid #334155; padding-bottom:6px; }
  #editor h3 { font-size:18px; margin:22px 0 8px; }
  #editor p { margin:12px 0; }
  #editor ul, #editor ol { padding-left:24px; }
  #editor li { margin:6px 0; }
  #editor strong { color:#fff; }
  #editor table { border-collapse:collapse; width:100%; margin:14px 0; }
  #editor table th, #editor table td { border:1px solid #334155; padding:8px 12px; text-align:left; }
  #editor table th { background:#0b1120; }
  .hint { color:#94a3b8; font-size:12px; padding:10px 16px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:#062b12; padding:10px 20px; border-radius:10px; font-weight:700; display:none; z-index:99; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="logo">블로그 검토</h1>
    <span class="badge">육아휴직</span>
    <div class="actions"><button id="copyBtn">HTML 복사</button></div>
  </div>
</header>
<div class="wrap">
  <div class="thumb-wrap"><img src="thumbnail.png" alt="썸네일"></div>
  <div class="toolbar">
    <button data-cmd="bold"><b>B</b></button>
    <button data-cmd="italic"><i>I</i></button>
    <button data-cmd="formatBlock" data-val="h2">제목</button>
    <button data-cmd="formatBlock" data-val="h3">소제목</button>
    <button data-cmd="formatBlock" data-val="p">본문</button>
    <button data-cmd="insertUnorderedList">• 목록</button>
  </div>
  <div id="editor" contenteditable="true"></div>
  <div class="hint">이 영역에 그냥 글을 쓰세요. 제목/소제목/굵게/목록은 위 버튼. 글을 고치면 "HTML 복사"가 그대로 반영합니다. (저장 버튼 없음 — 복사만 하면 됨)</div>
  <textarea id="rawBox" readonly style="display:none;width:100%;height:220px;margin:12px 0;background:#0b1120;color:#e2e8f0;border:1px solid #334155;border-radius:8px;font-size:12px;"></textarea>
  <div class="hint" id="rawHint" style="display:none;">⬆️ 위 박스를 길게 눌러 전체선택 → 복사하세요</div>
</div>
<div class="toast" id="toast">복사됨 ✓</div>

<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
let articleHTML = "\n<h1>2025년 육아휴직 대변혁 가이드: 6+6 제도부터 급여 인상까지 완벽 정리</h1>\n\n<h2>1. 서론: 더 길고 든든해진 2025년 육아휴직, 무엇이 달라졌을까?</h2>\n<p>2025년부터 대한민국 부모들의 육아 부담을 실질적으로 덜어주기 위한 육아휴직 제도가 대폭 확대됩니다. 이전에는 경제적 부담이나 직장 내 분위기 때문에 망설였다면, 이제는 인상된 급여 상한액과 유연해진 제도를 통해 더욱 당당하게 육아의 권리를 누릴 수 있게 되었습니다. 2025년 개편안에서 가장 주목해야 할 변화 3가지는 다음과 같습니다.</p>\n<blockquote>\n<p><strong>2025년 육아휴직 핵심 변화 3가지</strong></p>\n<ol>\n<li><strong>급여 상한액 단계적 인상</strong>: 일반 육아휴직 기준 첫 3개월 월 최대 250만 원으로 상향</li>\n<li><strong>사후지급금 제도 완전 폐지</strong>: 휴직 중 급여 100% 전액 지급으로 실질 소득 보전</li>\n<li><strong>휴직 기간 연장 및 유연성 확보</strong>: 최대 1년 6개월로 연장 및 2주 단위 단기 휴직 도입</li>\n</ol>\n</blockquote>\n<p><img src=\"/fig1.png\" alt=\"2025 육아휴직 핵심 변화 3가지\" style=\"width:100%;border-radius:12px;\"></p>\n\n<h2>2. 한눈에 보는 2025년 육아휴직 개편 핵심 요약</h2>\n<p>기존 제도와 비교하여 2025년부터 달라지는 주요 항목들을 정리해 드립니다.</p>\n<table>\n<tr><th>항목</th><th>기존 제도</th><th>2025년 개편안</th></tr>\n<tr><td><strong>월 최대 급여</strong></td><td>150만 원</td><td><strong>시기별 차등 상향 (최대 250만 원)</strong></td></tr>\n<tr><td><strong>급여 지급 방식</strong></td><td>통상임금 80%</td><td><strong>최대 100%</strong> (1~6개월 차)</td></tr>\n<tr><td><strong>사후지급금</strong></td><td>존재 (25% 복직 후 지급)</td><td><strong>폐지 (휴직 중 전액 즉시 지급)</strong></td></tr>\n<tr><td><strong>휴직 기간</strong></td><td>최대 1년</td><td><strong>최대 1년 6개월</strong> (부모 각각 3개월 이상 사용 시)</td></tr>\n<tr><td><strong>분할 사용 횟수</strong></td><td>2회</td><td><strong>3회 (총 4번 나누어 사용 가능)</strong></td></tr>\n<tr><td><strong>단기 육아휴직</strong></td><td>불가</td><td><strong>2주 단위 사용 가능</strong></td></tr>\n<tr><td><strong>배우자 출산휴가</strong></td><td>10일</td><td><strong>20일로 확대</strong></td></tr>\n<tr><td><strong>동료 업무 분담 지원금</strong></td><td>없음</td><td><strong>월 20만 원 신설</strong></td></tr>\n</table>\n\n<h2>3. '6+6 부모육아휴직제'의 강력해진 혜택 분석</h2>\n<p>'6+6 부모육아휴직제'는 생후 18개월 이내의 자녀를 둔 부모가 동시 또는 순차적으로 육아휴직을 사용할 때, 첫 6개월간 급여를 통상임금의 100%로 지원하는 제도입니다. 2025년에는 상한액이 더욱 파격적으로 인상되었습니다.</p>\n<p><img src=\"/fig2.png\" alt=\"6+6 부모육아휴직제 혜택\" style=\"width:100%;border-radius:12px;\"></p>\n<ul>\n<li><strong>자녀 연령 기준</strong>: 두 번째 육아휴직자의 개시 시점 기준 <strong>자녀 생후 18개월 이내</strong></li>\n<li><strong>월별 최대 지급액 (부모 각각 적용)</strong>:\n<ol>\n<li><strong>1개월 차</strong>: 최대 <strong>250만 원</strong></li>\n<li><strong>2개월 차</strong>: 최대 <strong>250만 원</strong></li>\n<li><strong>3개월 차</strong>: 최대 <strong>300만 원</strong></li>\n<li><strong>4개월 차</strong>: 최대 <strong>350만 원</strong></li>\n<li><strong>5개월 차</strong>: 최대 <strong>400만 원</strong></li>\n<li><strong>6개월 차</strong>: 최대 <strong>450만 원</strong></li>\n</ol></li>\n</ul>\n<p><strong>⚠️ 주의사항: 통상임금 100% 지원의 실질적 의미</strong><br>해당 제도는 통상임금의 100%를 지급하지만, <strong>\"실제 근로자의 통상임금보다 많은 급여를 지급하지 않는다\"</strong>는 원칙이 있습니다. 예를 들어, 본인의 월 통상임금이 300만 원이라면 상한액이 450만 원인 6개월 차에도 450만 원이 아닌 본인의 통상임금인 300만 원까지만 수령하게 됩니다.</p>\n\n<h2>4. 2025년 신설 및 개선되는 주요 포인트 3가지</h2>\n<h3>1) 사후지급금 폐지</h3>\n<p>그동안 육아휴직 급여의 25%는 복직 후 6개월을 더 근무해야만 받을 수 있어 휴직 중 경제적 갈증을 유발했습니다. 하지만 <strong>2025년부터는 사후지급금 제도가 폐지</strong>되어, 휴직 기간 중에 급여 전액을 바로 받을 수 있습니다. 이는 휴직 중 체감 소득을 크게 높여주는 가장 실질적인 변화입니다.</p>\n<h3>2) 휴직 기간 연장 및 유연화 (단기 육아휴직 도입)</h3>\n<p>육아휴직 기간이 기존 1년에서 <strong>최대 1년 6개월로 연장</strong>됩니다. (단, 부모가 각각 3개월 이상 사용 시 적용) 또한, <strong>2주 단위의 단기 육아휴직</strong>이 도입됩니다. 이는 <strong>어린이집 적응 기간이나 방학, 갑작스러운 돌봄 공백</strong> 등 긴급한 상황에 연차를 소진하지 않고 유연하게 대처할 수 있어 실무적으로 매우 유용한 도구가 될 것입니다. 분할 사용도 총 4회까지 가능해져 육아 맞춤형 스케줄링이 가능해집니다.</p>\n<h3>3) 동료 업무 분담 지원금</h3>\n<p>육아휴직자가 마음 편히 휴직을 선택할 수 있도록, 남겨진 동료들을 위한 혜택도 신설되었습니다. 육아휴직자의 업무를 분담하는 동료에게 기업이 보상을 제공할 경우, 정부가 해당 기업에 <strong>월 20만 원의 '업무 분담 지원금'을 지원</strong>합니다. 이는 직장 내 눈치 보는 문화를 개선하고 협력적인 분위기를 조성하는 데 큰 역할을 할 것입니다.</p>\n<p><img src=\"/fig3.png\" alt=\"2025 신설·개선 포인트\" style=\"width:100%;border-radius:12px;\"></p>\n\n<h2>5. 놓치면 안 되는 신청 방법 및 자격 조건</h2>\n<h3>신청 단계 및 주의사항</h3>\n<ol>\n<li><strong>회사 신청</strong>: 육아휴직 시작 <strong>30일 전</strong>까지 회사에 신청서를 제출해야 합니다. (사업주는 정당한 사유 없이 거절할 수 없으며, 14일 이내 미응답 시 자동 승인된 것으로 간주합니다.)</li>\n<li><strong>고용보험 급여 신청</strong>: 육아휴직 시작 <strong>1개월 후</strong>부터 종료 후 12개월 이내에 신청할 수 있습니다.</li>\n</ol>\n<h3>준비 서류</h3>\n<table>\n<tr><th>서류명</th><th>내용 및 비고</th></tr>\n<tr><td><strong>육아휴직 급여 신청서</strong></td><td>본인 작성 (고용24 홈페이지/앱)</td></tr>\n<tr><td><strong>육아휴직 확인서</strong></td><td>회사(사업주)가 사전에 고용보험에 등록해야 함</td></tr>\n<tr><td><strong>통상임금 증빙서류</strong></td><td>임금대장, 근로계약서 사본 등</td></tr>\n<tr><td><strong>가족관계증명서</strong></td><td>대상 자녀 확인용 (필요 시 제출)</td></tr>\n</table>\n<p><strong>💡 전문가 팁:</strong> <strong>고용24 앱</strong>을 활용하면 매우 편리합니다. 스마트폰으로 준비 서류를 <strong>사진으로 찍어 바로 업로드</strong>할 수 있어 별도의 스캔 과정 없이 간편하게 접수가 가능합니다.</p>\n<p><img src=\"/fig4.png\" alt=\"신청 방법과 준비 서류\" style=\"width:100%;border-radius:12px;\"></p>\n\n<h2>6. 자주 묻는 질문(FAQ) 베스트 4</h2>\n<p><strong>Q1: 부모가 동시에 휴직해야만 6+6 혜택을 받나요?</strong><br><strong>A:</strong> 아닙니다. 부모가 <strong>동시에 사용하는 경우와 순차적으로 사용하는 경우 모두 적용</strong>됩니다. 두 번째 육아휴직자가 신청할 때 첫 번째 휴직자의 사용 이력을 확인하여 상향된 급여를 지급합니다.</p>\n<p><strong>Q2: 2024년에 이미 휴직 중인 경우에도 적용되나요? (소급 적용)</strong><br><strong>A:</strong> 개정 법령은 원칙적으로 <strong>부모 중 한 명이라도 2024년 1월 1일 이후 육아휴직을 최초로 사용</strong>한 경우 적용됩니다. 다만, 2023년에 이미 시작했더라도 자녀가 생후 18개월 이내라면 2024년 이후의 휴직 기간에 대해서는 요건 충족 시 혜택을 받을 수 있습니다. 2025년 급여 인상분은 2025년 1월 1일 이후의 휴직 기간에 대해 적용됩니다.</p>\n<p><strong>Q3: 휴직 중 아르바이트나 부업이 가능한가요?</strong><br><strong>A:</strong> 원칙적으로 '취업'에 해당하는 활동은 주의해야 합니다. <strong>1주 소정근로시간이 15시간 이상</strong>이거나, <strong>월 수입이 150만 원 이상</strong>인 경우 급여 지급이 제한되거나 부정수급으로 처리될 수 있으므로 기준을 반드시 확인해야 합니다.</p>\n<p><strong>Q4: 자영업자나 공무원도 해당되나요?</strong><br><strong>A:</strong> 육아휴직 급여는 <strong>고용보험 가입 근로자(피보험 단위기간 180일 이상)</strong>를 대상으로 합니다. 따라서 고용보험 미가입 자영업자나 자체 제도를 운용하는 공무원은 제외됩니다. 부부 중 한 명만 고용보험 가입자라면 해당 1인에 대해서만 일반 육아휴직 급여가 지급됩니다.</p>\n\n<h2>7. 결론 및 체크리스트: 당당하게 누리는 육아의 권리</h2>\n<p>2025년 육아휴직 개편안은 경제적 보전을 강화하고 사용의 유연성을 극대화하여 부모가 함께 아이를 키우는 문화를 만드는 데 초점을 맞추고 있습니다. 인사 노무 측면에서 볼 때, 이제 육아휴직은 '배려'가 아닌 근로자의 '권리'이자 기업의 '경쟁력'입니다.</p>\n<p><strong>성공적인 육아휴직 신청을 위한 최종 체크리스트</strong></p>\n<ul>\n<li>[ ] 자녀 연령이 6+6 혜택 범위(생후 18개월 이내)에 포함되는지 확인했나요?</li>\n<li>[ ] 고용보험 피보험 단위기간(180일 이상) 요건을 갖추었나요?</li>\n<li>[ ] 회사에 시작 30일 전까지 의사를 전달하고 '육아휴직 확인서' 등록을 요청했나요?</li>\n<li>[ ] 고용24 앱을 설치하고 사진 업로드를 통한 간편 신청 준비를 마쳤나요?</li>\n</ul>\n<p><img src=\"/fig5.png\" alt=\"성공적인 신청 체크리스트\" style=\"width:100%;border-radius:12px;\"></p>\n";
editor.innerHTML = articleHTML;   // 글 미리 채움

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch(e){}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(e){ ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}
copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch(e){ ok = false; }
  if(!ok) ok = legacyCopy(text);
  if(ok) { toast.style.display='block'; setTimeout(()=>toast.style.display='none', 1500); }
  else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({block:'center'});
    alert('자동 복사가 안 돼요. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if(cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
</body>
