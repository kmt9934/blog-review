<script>
const POSTS = {"b3": {"title": "2027 자동차세 연납 계산: 배기량별 공제액 표", "html": "<h1>2027 자동차세 연납 계산: 배기량별 공제액 표<\/h1>\n<div class=\"article-rich\" style=\"color:#1d3a29;\">\n<p style=\"color:#1d3a29;\">1,998cc 승용차를 가진 사람이 2027년 1월에 자동차세를 한 번에 내면, 지방교육세까지 합친 1년치 51만 9,480원이 49만 5,712원으로 줄어듭니다. 차이는 2만 3,768원이에요. 연세액 39만 9,600원에 334/365와 5%를 곱한 1만 8,283원이 먼저 빠지고, 그만큼 지방교육세(자동차세의 30%)도 함께 줄어든 결과입니다.<\/p>\n<p style=\"color:#1d3a29;\">12월 16일부터 31일까지는 올해 제2기분 자동차세를 내는 기간이고, 그 직후인 1월 16일부터 연납 신청이 열립니다. 고지서를 받은 지금이 내년 연납을 할지, 하면 얼마가 줄어드는지 계산해 두기 좋은 때예요. 이 글은 <a style=\"color:#1f6b43;\" href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A7%80%EB%B0%A9%EC%84%B8%EB%B2%95\">국가법령정보센터의 지방세법<\/a> 제127조·제128조·제151조와 지방세법 시행령 제122조·제125조, 행정안전부 보도자료, 위택스 사용자 매뉴얼에 나온 숫자만으로 계산했습니다. 법령은 2026년 11월 22일 현재 시행 중인 조문 기준이고, 금액은 원 미만을 버린 값이라 실제 고지서와 몇십 원 차이가 날 수 있어요.<\/p>\n\n<h2>1,998cc 승용차 한 대로 먼저 계산해 보기<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"1,998cc 승용차 한 대로 먼저 계산해 보기 요약 카드: 1,998cc 새 차, 1월 연납이면 2만 3,768원 절감\">\n<p style=\"color:#1d3a29;\">계산 순서는 네 단계예요. 배기량에 cc당 세액을 곱해 연세액을 만들고, 차가 3년 이상 됐으면 차령 경감을 적용하고, 연납 공제를 빼고, 마지막으로 지방교육세 30%를 붙입니다. 아래 예시는 2026년 이후 처음 등록해 2027년 차령이 2년 이하인 비영업용 승용차, 배기량 1,998cc를 기준으로 잡았어요.<\/p>\n<p style=\"color:#1d3a29;\">지방세법 제127조 제1항 제1호의 표에서 1,600cc를 넘는 비영업용 승용차는 cc당 200원입니다. 1,998cc × 200원 = <strong style=\"color:#1d3a29;\">39만 9,600원<\/strong>이 1년치 자동차세 본세가 돼요. 평소처럼 6월과 12월에 나눠 내면 회차마다 19만 9,800원이고, 여기에 지방교육세 5만 9,940원이 붙어 한 번에 25만 9,740원씩 나갑니다.<\/p>\n<div style=\"background:#f3f9f4;border:1px solid #cfe3d4;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1d3a29;\">\n<h3 style=\"margin:0 0 8px;color:#1d3a29;\">1월 연납 계산 과정 (1,998cc, 차령 2년 이하)<\/h3>\n<ol style=\"margin:0;padding-left:22px;line-height:1.8;color:#1d3a29;\">\n<li style=\"color:#1d3a29;\">연세액: 1,998cc × 200원 = 399,600원<\/li>\n<li style=\"color:#1d3a29;\">연납 공제: 399,600원 × 334 ÷ 365 × 5% = 18,283원<\/li>\n<li style=\"color:#1d3a29;\">공제 뒤 자동차세: 399,600원 − 18,283원 = 381,317원<\/li>\n<li style=\"color:#1d3a29;\">지방교육세: 381,317원 × 30% = 114,395원<\/li>\n<li style=\"color:#1d3a29;\">1월에 낼 돈: 381,317원 + 114,395원 = 495,712원 (나눠 낼 때 519,480원)<\/li>\n<\/ol>\n<\/div>\n<p style=\"color:#1d3a29;\">334는 1월 연납 기한 다음 날인 2월 1일부터 12월 31일까지의 날수예요. 2027년은 윤년이 아니어서 분모가 365이고, 2028년처럼 윤년이면 366으로 나눕니다. 그래서 흔히 말하는 \"5% 할인\"은 정확히는 연세액의 약 4.58%예요. 행정안전부도 2026년 1월 보도자료에서 1월 연납 시 연간 세액의 4.58%를 할인받는 효과라고 설명했습니다.<\/p>\n<p style=\"color:#1d3a29;\">줄어드는 2만 3,768원 가운데 1만 8,283원은 자동차세 공제, 나머지 5,485원은 지방교육세가 따라 줄어든 몫이에요. 지방교육세는 지방세법 제151조 제1항 제7호에 따라 \"납부하여야 할 자동차세액\"의 30%라서, 공제 뒤 금액에 붙습니다. 결과적으로 본세와 교육세를 합친 총액 기준으로도 절감률은 4.58%로 같아요.<\/p>\n\n<h2>연세액 계산식: 배기량, 차령, 지방교육세<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"연세액 계산식: 배기량, 차령, 지방교육세 요약 카드: 배기량 × cc당 세액에서 출발\">\n<p style=\"color:#1d3a29;\">연납 공제는 연세액에 비율을 곱하는 방식이라, 자기 차 연세액을 정확히 알면 나머지는 곱셈뿐이에요. 비영업용 승용차의 cc당 세액은 세 구간이고, 택시·렌터카 같은 영업용은 구간과 세율이 따로 정해져 있습니다. 지방세법 제127조 제1항 표를 옮기면 아래와 같아요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">구분<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">비영업용 cc당 세액<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">영업용 cc당 세액<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,000cc 이하<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">80원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">18원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,600cc 이하<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">140원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">18원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,600cc 초과<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">200원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">2,000cc 이하 19원, 2,500cc 이하 19원, 초과 24원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">전기·수소 등 그 밖의 승용<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">연 10만 원 정액<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">연 2만 원 정액<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#1d3a29;\">두 번째 단계는 차령 경감이에요. 제127조 제1항 제2호는 차령 3년 이상인 비영업용 승용차의 각 기분세액을 \"A/2 − (A/2 × 5/100) × (차령 − 2)\"로 계산하게 하고, 12년을 넘으면 12년으로 봅니다. 풀어 쓰면 3년 차는 5%, 4년 차는 10%처럼 해마다 5%씩 깎이다가 12년 차부터 50%에서 멈춰요. 시행령 제122조는 차령을 \"과세연도 − 기산일이 속한 연도 + 1\"로 셉니다. 2020년 3월 등록한 차라면 2027년 차령은 8년, 경감률은 30%예요. 기산일이 7월 이후면 제1기분은 1을 더하지 않아 한 해에 두 차령이 섞입니다.<\/p>\n<p style=\"color:#1d3a29;\">전기차는 제1호가 아니라 제3호 \"그 밖의 승용자동차\"에 속해서, 조문상 차령 경감 대상이 아니에요. 몇 년을 타도 본세 10만 원에 지방교육세 3만 원, 합계 13만 원이 그대로입니다. 지방교육세는 제150조 제7호에 따라 비영업용 승용차(제1호·제3호)에만 붙고, 영업용 차량에는 붙지 않아요.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"자동차세 연납 금액 계산 흐름: 배기량 곱하기 cc당 세액, 차령 경감, 연납 공제, 지방교육세 30퍼센트 순서\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">연세액을 먼저 만들고 차령 경감, 연납 공제, 지방교육세 순서로 계산합니다.<\/figcaption>\n<\/figure>\n\n<h2>1월·3월·6월·9월, 언제 내느냐에 따라 달라지는 공제율<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"1월·3월·6월·9월, 언제 내느냐에 따라 달라지는 공제율 요약 카드: 1월이 가장 크고 9월이 가장 작다\">\n<p style=\"color:#1d3a29;\">연납 기회는 1년에 네 번이에요. 지방세법 제128조 제3항 표가 1월 16~31일, 3월 16~31일, 6월 16~30일, 9월 16~30일을 연세액 신고납부 기간으로 정해 두었고, 기간마다 계산식이 다릅니다. 이자율은 시행령 제125조 제6항이 \"100분의 5\"로 정했어요. 이 5%에는 끝나는 연도가 적혀 있지 않습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">신고납부 기간<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">계산식 (2027년, 평년)<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">연세액 39만 9,600원이면<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1월 16~31일<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">연세액 × 334/365 × 5% (약 4.58%)<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">18,283원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">3월 16~31일<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">연세액 × 275/365 × 5% (약 3.77%)<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">15,053원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">6월 16~30일<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">제2기분 세액 × 5% (연세액의 2.5%)<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">9,990원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">9월 16~30일<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">제2기분 세액 × 92/184 × 5% (연세액의 1.25%)<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">4,995원<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#1d3a29;\">1월이 가장 크고 늦을수록 줄어드는 이유는 미리 내는 기간이 짧아지기 때문이에요. 6월 연납은 이미 그달에 내는 제1기분과 별개로 제2기분만 앞당기는 셈이라, 정부민원안내콜센터 110도 6월 연납 신청과 무관하게 제1기분은 따로 내야 하고 공제가 소급되지 않는다고 안내합니다. 서초구청 세무 안내 페이지의 2026년 표도 1월 약 4.58%, 3월 약 3.76%, 9월 약 1.25%로 같은 구조예요.<\/p>\n<p style=\"color:#1d3a29;\">2027년 1월 31일은 일요일입니다. 지방세는 기한이 주말이면 다음 날로 넘어가서, 2026년에도 1월 31일이 토요일이라 당초 기한이 2월 2일(월)이었고 위택스 점검으로 2월 4일까지 한 번 더 늘었어요. 그때도 행정안전부가 안내한 공제 효과는 4.58%였습니다. 2027년 실제 마감일은 1월 중 행정안전부·지자체 공지로 정해지니, 기한보다 비율이 궁금하다면 위 표를 기준으로 잡으면 됩니다.<\/p>\n<figure style=\"margin:20px 0;text-align:center;\">\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"연납 시기별 공제율 막대 비교: 1월 4.58퍼센트, 3월 3.77퍼센트, 6월 2.5퍼센트, 9월 1.25퍼센트\" style=\"max-width:100%;height:auto;border-radius:12px;\">\n<figcaption style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#334155;\">같은 차라도 1월에 내면 9월보다 공제가 약 3.7배 큽니다.<\/figcaption>\n<\/figure>\n\n<h2>배기량·차령별 2027년 1월 연납 금액 표<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"배기량·차령별 2027년 1월 연납 금액 표 요약 카드: 새 차·큰 차일수록 절감액이 크다\">\n<p style=\"color:#1d3a29;\">자주 보이는 배기량과 차령으로 1월 연납 금액을 미리 계산해 두었어요. \"나눠 낼 때\"는 6월·12월 정기분에 지방교육세를 더한 1년 합계이고, \"1월 연납\"은 공제 뒤 자동차세와 그에 맞춰 줄어든 지방교육세를 더한 금액입니다. 자기 차 배기량이 표와 다르면 첫 번째 H2의 다섯 줄 계산에 숫자만 바꿔 넣으면 돼요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\">\n<thead><tr><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">차량 (차령)<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">나눠 낼 때 합계<\/th><th style=\"border:1px solid #cfe3d4;padding:10px;background:#1f4d36;color:#ffffff;\">1월 연납 / 줄어드는 돈<\/th><\/tr><\/thead>\n<tbody>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">998cc 경차 (2년 이하)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">103,792원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">99,043원 / 4,749원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,598cc (2년 이하)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">290,836원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">277,529원 / 13,307원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,598cc (9년, 35% 경감)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">189,043원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">180,394원 / 8,649원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,998cc (2년 이하)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">519,480원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">495,712원 / 23,768원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,998cc (7년, 25% 경감)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">389,610원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">371,784원 / 17,826원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">1,998cc (12년 이상, 50% 경감)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">259,740원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">247,856원 / 11,884원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">2,497cc (2년 이하)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">649,220원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">619,516원 / 29,704원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">3,342cc (2년 이하)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">868,920원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">829,164원 / 39,756원<\/td><\/tr>\n<tr><th style=\"border:1px solid #cfe3d4;padding:10px;text-align:left;background:#eef7f0;color:#1d3a29;\">전기차 (차령 무관)<\/th><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">130,000원<\/td><td style=\"border:1px solid #cfe3d4;padding:10px;color:#1d3a29;\">124,052원 / 5,948원<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#1d3a29;\">표를 보면 절감액은 차가 클수록, 새 차일수록 커요. 같은 1,998cc라도 새 차는 2만 3,768원, 12년 넘은 차는 1만 1,884원이 줄어 절반 차이가 납니다. 차령 경감으로 연세액 자체가 이미 반으로 줄었기 때문이에요. 반대로 3,342cc 대형 세단은 한 번 연납으로 4만 원 가까이 아낄 수 있습니다.<\/p>\n<p style=\"color:#1d3a29;\">돈을 미리 내는 대신 예금에 넣어 두는 쪽과도 비교해 볼 만해요. 1월 연납은 6월분 절반을 약 5개월, 12월분 절반을 약 11개월 앞당겨 내는 구조라 평균으로 치면 연세액 전체를 242일쯤 먼저 내는 셈입니다. 4.58%를 이 기간으로 연 환산하면 약 6.9%이고, 공제에는 세금이 붙지 않아요. 연 3% 예금이라면 이자소득세 15.4%를 뗀 뒤 실수령 이율이 약 2.54%라서, 같은 돈을 굴리는 것보다 연납 쪽이 계산상 앞섭니다. 이 연 환산치는 위 조문 숫자로 직접 계산한 값이에요.<\/p>\n\n<h2>연납 이득이 작아지거나 놓치기 쉬운 경우<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"연납 이득이 작아지거나 놓치기 쉬운 경우 요약 카드: 자동이체로는 연납이 안 된다\">\n<p style=\"color:#1d3a29;\">계산상 이득이 분명해도 실제로는 공제를 못 받거나 혜택이 줄어드는 경우가 있어요. 가장 흔한 건 자동이체를 믿고 기다리는 경우입니다. 행정안전부 보도자료는 연납이 정기분과 달리 자동이체가 적용되지 않아, 기존에 지방세 자동이체를 설정해 둔 사람도 기한 안에 직접 납부해야 한다고 적었어요. 신청만 하고 기간 안에 돈을 넣지 않으면 6월·12월 정기분이 원래대로 나옵니다.<\/p>\n<ul style=\"margin:12px 0;padding-left:22px;line-height:1.8;color:#1d3a29;\">\n<li style=\"color:#1d3a29;\"><strong style=\"color:#1d3a29;\">연세액 10만 원 미만 차량:<\/strong> 110 안내에 따르면 위택스에서 1월과 3월에만 연납을 신청할 수 있어요. 지방세법 제128조 제4항은 연세액 10만 원 이하 자동차세를 6월 제1기분 때 전액 부과하면서 제2기분 세액의 5%를 빼 줄 수 있게 해 두었습니다. 998cc 경차라면 6월 일괄 부과 시 공제가 1,996원, 1월 연납이면 3,653원이에요.<\/li>\n<li style=\"color:#1d3a29;\"><strong style=\"color:#1d3a29;\">해가 바뀌어 차를 바꾼 경우:<\/strong> 위택스 신청 화면은 차량번호로 검색해 그 차의 세액을 띄우는 구조예요. 연납하던 차를 팔고 새 차를 샀다면 1월에 오는 연납 고지서는 옛 차 기준이라, 새 차는 차량번호로 다시 신청해야 합니다.<\/li>\n<li style=\"color:#1d3a29;\"><strong style=\"color:#1d3a29;\">6월 연납:<\/strong> 제2기분만 공제되고 이미 나온 제1기분은 따로 내야 해서, 체감 이득이 연세액의 2.5%로 1월의 절반 남짓입니다.<\/li>\n<\/ul>\n<p style=\"color:#1d3a29;\">연중에 차를 팔거나 폐차할 계획이 있어도 손해는 아니에요. 보도자료는 연납 뒤 차량을 양도하거나 폐차하면 보유하지 않은 기간만큼 일할 계산해 돌려준다고 밝혔습니다. 위택스 신청 화면에서 환급계좌를 입력해 두면 이렇게 생긴 환급금이 그 계좌로 들어가요(위택스 사용자 매뉴얼). 다른 시·군·구로 이사해도 그해 자동차세를 다시 신고할 필요가 없다는 점은 시행령 제125조 제4항에도 적혀 있어요.<\/p>\n<div style=\"background:#fff8ed;border-left:4px solid #b54708;border-radius:8px;padding:14px 16px;margin:20px 0;color:#5c2b12;\">\n<strong style=\"color:#5c2b12;\">2027년 공제율이 바뀔 가능성<\/strong>\n<p style=\"margin:6px 0 0;line-height:1.7;color:#5c2b12;\">공제 상한은 법에서 \"100분의 10의 범위\"로, 실제 이자율은 시행령에서 5%로 정합니다. 시행령은 국회를 거치지 않고 고칠 수 있어서, 연말 개정이 있으면 1월 비율이 달라질 수 있어요. 11월 22일 현재 시행 조문에는 5%가 그대로 있고, 이 글의 계산도 모두 5% 기준입니다.<\/p>\n<\/div>\n<p style=\"color:#1d3a29;\">상황을 두 가지로 나눠 보면 판단이 쉬워요. 2026년식 2,497cc SUV 한 대를 둔 가구는 1월 연납으로 2만 9,704원이 줄고, 1월에 64만 9천 원 남짓을 한 번에 내야 합니다. 2019년 상반기에 등록한 1,598cc 소형차(2027년 차령 9년)와 전기차를 함께 가진 가구는 두 대 합쳐 1만 4,597원이 줄고, 1월 납부액은 30만 4,446원이에요. 앞 가구는 절감액이 크지만 목돈 부담도 크고, 뒤 가구는 부담이 작은 대신 절감액도 작습니다.<\/p>\n\n<h2>위택스·이택스 신청 순서와 12월에 미리 챙길 것<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"위택스·이택스 신청 순서와 12월에 미리 챙길 것 요약 카드: 신청 → 연세액납부 → 자동차세\">\n<p style=\"color:#1d3a29;\">2026년에 이미 연납을 했다면 새로 신청하지 않아도 돼요. 시행령 제125조 제2항은 연세액을 한꺼번에 낸 사람에게 다음 해 1월 중에 납부서를 보낼 수 있게 했고, 지자체들도 전년도 연납자에게 1월 고지서를 보내 줍니다. 처음 연납하는 차라면 1월 16일부터 아래 순서로 신청해요. 메뉴 이름은 위택스 사용자 매뉴얼과 110 안내(2026년 1월 30일 작성) 기준입니다.<\/p>\n<ol style=\"margin:12px 0;padding-left:22px;line-height:1.8;color:#1d3a29;\">\n<li style=\"color:#1d3a29;\">위택스(wetax.go.kr) 또는 스마트 위택스 앱에 본인 명의로 로그인합니다. 110 안내에 따르면 로그인한 본인 차량만 신청되고, 가족 차는 관할 세무과에 전화로 신청해요.<\/li>\n<li style=\"color:#1d3a29;\">상단 메뉴에서 [신청] → [연세액납부] → [자동차세] → [연세액납부 신청]으로 들어갑니다.<\/li>\n<li style=\"color:#1d3a29;\">차량번호를 넣고 검색하면 차량 정보와 세액이 나옵니다. 등록지가 서울이면 [서울]을 체크하고 관할 구를 고른 뒤 검색해요.<\/li>\n<li style=\"color:#1d3a29;\">환급계좌를 고르고 [검증]을 누른 다음 [신청하기]를 누르면 전자납부번호와 납부기한이 나옵니다.<\/li>\n<li style=\"color:#1d3a29;\">[연세액납부 신청내역]에서 해당 건을 골라 [선택납부]로 바로 내거나, 전자납부번호로 은행·가상계좌 납부를 합니다.<\/li>\n<\/ol>\n<p style=\"color:#1d3a29;\">서울 차량은 1월 신청 기간에 위택스 신청이 제한된다고 110이 안내하고 있어서, 서울시 이택스(etax.seoul.go.kr)나 관할 구청 세무과로 신청하는 편이 빨라요. 서초구는 세무관리과 전화(02-2155-6591~6594) 신청도 받는다고 안내합니다. 위택스 [연세액납부 신청내역] 화면에서는 아직 납부하지 않은 신청을 취소할 수도 있어요.<\/p>\n<div style=\"background:#f3f9f4;border:1px solid #cfe3d4;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1d3a29;\">\n<h3 style=\"margin:0 0 8px;color:#1d3a29;\">연납 신청·납부를 하는 공식 사이트<\/h3>\n<p style=\"margin:0 0 12px;line-height:1.7;color:#1d3a29;\">1월 연납은 1월 16일부터, 서울 차량은 이택스 또는 구청 세무과. 연납분은 자동이체가 되지 않으니 납부까지 같은 기간 안에 끝냅니다.<\/p>\n<p style=\"margin:0 0 8px;color:#1d3a29;\"><a class=\"official-link-btn\" href=\"https://www.wetax.go.kr/main.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#1f4d36;color:#ffffff;font-weight:700;text-decoration:none;\">위택스에서 자동차세 연납 신청 →<\/a><\/p>\n<p style=\"margin:0 0 8px;color:#1d3a29;\"><a class=\"official-link-btn\" href=\"https://etax.seoul.go.kr/\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #1f4d36;color:#1f4d36;font-weight:700;text-decoration:none;\">서울 차량은 이택스에서 신청 →<\/a><\/p>\n<p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:#1d3a29;\">전화 문의: 정부민원안내콜센터 <strong style=\"color:#1d3a29;\">110<\/strong> · 관할 시·군·구청 세무과<\/p>\n<\/div>\n<p style=\"color:#1d3a29;\">12월에 할 일은 두 가지예요. 첫째, 12월 16~31일 제2기분 고지서를 받으면 차령 경감이 반영된 금액인지 보고, 그 금액의 두 배를 대략 내년 연세액으로 잡아 두면 1월 목돈 계획이 섭니다. 차령이 한 해 늘어나면 경감률이 5%p 커지니 내년 금액은 조금 줄어요. 둘째, 1월 말까지 낼 돈을 미리 떼어 두는 겁니다. 1월에는 연말정산 서류 준비도 겹치는데, 연납 기간이 보름 남짓뿐이라 날짜를 달력에 적어 두는 편이 안전해요.<\/p>\n\n<h3>이 글의 계산 근거로 삼은 공식 자료<\/h3>\n<ul style=\"line-height:1.8;color:#1d3a29;\">\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A7%80%EB%B0%A9%EC%84%B8%EB%B2%95\">국가법령정보센터, 지방세법 제127조·제128조·제150조·제151조<\/a><\/li>\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A7%80%EB%B0%A9%EC%84%B8%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\">국가법령정보센터, 지방세법 시행령 제122조·제125조 (2026년 10월 1일 시행본)<\/a><\/li>\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.mois.go.kr/frt/bbs/type010/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000008&amp;nttId=123496\">행정안전부 보도자료, 자동차세 연납 2월 4일 마감, 5% 공제 혜택 챙기세요 (2026년 1월 29일)<\/a><\/li>\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.110.go.kr/data/counselView.do?num=A01_660057\">정부민원안내콜센터 110, 위택스에서 자동차세 연납 신청 가능한가요?<\/a><\/li>\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.wetax.go.kr/tcp/wtg/J040103M01.do\">위택스 이용안내<\/a> · 위택스 사용자 매뉴얼 「자동차세 연납 신청」<\/li>\n<li style=\"color:#1d3a29;\"><a style=\"color:#1f6b43;\" href=\"https://www.seocho.go.kr/site/tax/03/10303010000002023050810.jsp\">서초구청, 자동차세 연납(선납) 할인혜택<\/a><\/li>\n<\/ul>\n<\/div>\n"}};
const TABS = ["b3"];
for (const id of TABS) {
  const p = POSTS[id];
  if (p) document.getElementById('ed-' + id).innerHTML = p.html;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
