<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const articleHTML = "<h1>창문 결로 왜 생길까? 환기·습도·단열로 줄이는 방법과 결로 곰팡이 대처법<\/h1>\n<p>아침에 커튼을 걷으면 창문 유리와 창틀에 물방울이 줄줄 맺혀 있는 집이 많습니다. 기온이 떨어지는 가을부터 겨울까지 자주 보이는 <strong>창문 결로<\/strong>입니다. 그냥 닦고 넘기기 쉽지만, 결로가 반복되면 창틀과 벽 모서리에 곰팡이가 생기기 쉽습니다. 이 글에서는 환경부·국립환경과학원, 한국에너지공단, 국토교통부, 질병관리청의 공식 안내를 바탕으로 <strong>결로가 생기는 이유 → 환기 → 습도 관리 → 난방·단열(뽁뽁이 포함) → 결로 곰팡이 대처<\/strong> 순서로 정리했습니다. (2026년 9월 26일 확인 기준)<\/p>\n<h2>한눈에 보는 창문 결로 관리<\/h2>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">항목<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">공식 안내 내용<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">출처<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">결로가 잘 생기는 곳<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">실내 습도가 높고 온도가 차가운 창·벽·바닥·천장, 특히 창문틀과 취약 구조 부위<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">환경부·국립환경과학원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">적정 실내 습도<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>40~60%<\/strong> (결로가 생기면 환기·제습기 등으로 습도를 낮게 유지)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">환경부·국립환경과학원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">결로 방지 환기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">모든 창문을 활짝 열고 짧게 자주, <strong>1회 5~10분<\/strong> 정도<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">한국에너지공단<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">겨울철 적정 난방온도<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>20℃<\/strong><\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">한국에너지공단<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">창문 단열<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">에어캡(뽁뽁이)·두꺼운 커튼·문풍지로 창을 통한 열손실 줄이기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">한국에너지공단<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">곰팡이가 생겼다면<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">곰팡이 제거 → 누수 확인·수리 → 완전히 건조, 청소할 때는 마스크 착용 권장<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">환경부<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h2>창문 결로 왜 생길까? 결로 원인부터 알기<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig1.png\" alt=\"창문 결로 원인: 습한 실내 공기가 차가운 창·벽에 닿을 때\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>결로는 따뜻하고 습한 실내 공기가 차가운 표면에 닿아 공기 속 수증기가 물방울로 맺히는 현상입니다. 환경부·국립환경과학원 자료는 결로가 <strong>실내 습도가 높고 온도가 차가운 창·벽·바닥·천장<\/strong>에서 생길 확률이 높다고 설명합니다. 특히 <strong>창문틀과 취약 구조 부위<\/strong>는 누수와 결로가 더 쉽게 생기므로 유의해서 점검하라고 안내합니다.<\/p>\n<p>한국에너지공단은 결로 방지를 위해 벽체와 바닥에 단열재와 방습층을 시공해 <strong>실내 표면 온도가 이슬점 이하로 떨어지는 것을 막는다<\/strong>고 설명합니다. 거꾸로 말하면, 창이나 벽의 안쪽 표면 온도가 이슬점 아래로 내려가면 물방울이 맺힌다는 뜻입니다. 가을·겨울에 결로가 늘어나는 이유도 여기에 있습니다. 바깥이 추워지면 창 표면이 차가워지고, 창문을 닫고 실내에서 지내는 시간이 길어지면서 요리·샤워 등으로 생긴 습기가 집 안에 쌓이기 쉽습니다.<\/p>\n<h3>결로가 잘 생기는 곳과 점검 포인트<\/h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">위치<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">왜 잘 생기나<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">점검 포인트<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">창 유리·창문틀<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">바깥 공기와 맞닿아 표면이 차가운 곳<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">아침에 유리 아래쪽과 창틀에 물이 고였는지 확인<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">외벽·벽 모서리·천장<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">차가운 벽면과 취약 구조 부위<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">벽지 얼룩·들뜸, 검은 점이 생겼는지 확인<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">벽에 붙인 가구·가전 뒤<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">공기가 통하지 않아 습기가 머무름<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">벽과 일정 간격을 띄워 공기가 통하게 배치(환경부)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">욕실·주방 주변<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">샤워·조리로 습기가 많이 생김<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">샤워 후 배기팬·문 열기, 조리 중 레인지 후드 사용<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>새 아파트인데도 결로가 생길 수 있나요?<\/h3>\n<p>국토교통부 「공동주택 결로 방지를 위한 설계기준」은 공동주택을 설계할 때 창과 벽의 결로 방지 성능을 판단하는 표준 조건으로 <strong>실내 온도 25℃·상대습도 50%<\/strong>, 바깥 온도는 지역에 따라 <strong>-20℃, -15℃, -10℃<\/strong>를 쓰도록 정하고 있습니다. 이 값은 설계 때 성능을 평가하기 위한 조건이지, 생활할 때 맞춰야 하는 권장 온습도가 아닙니다. 성능이 정해진 조건에서 평가되는 만큼, 실제 집의 습도나 바깥 기온이 이 조건과 다르면 결로가 생길 수 있다는 점을 알아 두면 좋습니다. 그래서 새집이든 오래된 집이든 환기와 습도 관리가 기본입니다.<\/p>\n<h2>결로 방지 방법 ① 환기: 짧게 자주, 맞통풍으로<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig2.png\" alt=\"결로 방지 환기 방법: 에너지공단과 국립환경과학원 안내 비교\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>결로를 줄이려면 집 안에 쌓인 습기를 밖으로 내보내야 합니다. 환경부·국립환경과학원 자료는 결로를 예방하려면 <strong>주기적으로 환기<\/strong>하고 제습기 등으로 습도를 낮게 유지해야 한다고 안내합니다. 다만 환기 시간은 기관별 안내의 목적에 따라 조금 다르게 제시돼 있어 두 가지를 함께 정리했습니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">구분<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">한국에너지공단 (결로 방지·에너지 절약)<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">환경부·국립환경과학원 (겨울철 실내공기질)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">방법<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">가능한 집안의 모든 창문을 활짝 열고 짧게 자주<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">맞통풍 방식<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">시간·횟수<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>1회 5~10분<\/strong> 정도가 적당<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>하루 3회 이상, 1회 30분 이상<\/strong>(기상 후·오후·취침 전 등 8시간 주기)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">주의할 점<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">너무 오래 열면 실내 온도가 떨어져 난방부하가 커지고 결로의 원인이 될 수 있음. 환기할 때 난방을 약하게 틀면 에너지비용을 줄일 수 있음<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">맞통풍이 어려운 구조면 부분적으로라도 창을 열고, 기계식 환기장치가 있으면 함께 활용<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>결로가 걱정되는 추운 날에는 에너지공단 안내처럼 <strong>창문을 한꺼번에 활짝 열어 짧게, 여러 번<\/strong> 환기하는 방법을 참고할 수 있습니다. 미세먼지 농도가 높을 때는 자연환기보다 기계환기 설비를 쓰는 편이 좋다고 국립환경과학원 자료는 안내합니다. 기계환기 설비는 적정 단계(중)나 최대 단계(강)로 연속 가동하거나, 하루 3번 이상 1회 2시간 이상 가동하는 것이 효과적이라고 합니다.<\/p>\n<h3>습기가 많이 생기는 순간엔 국소환기<\/h3>\n<ul>\n<li><strong>요리할 때:<\/strong> 레인지 후드를 켜고 창문을 조금이라도 열어 두세요. 창을 닫은 채 후드만 돌리면 효과가 떨어진다고 안내돼 있습니다.<\/li>\n<li><strong>샤워 후:<\/strong> 배기팬을 작동하고 문을 열어 습기를 내보낸 뒤 물기를 닦아 주세요.<\/li>\n<li><strong>가구·가전 배치:<\/strong> 세탁기나 선반 등은 벽과 일정 간격을 띄워 설치해 공기가 통하게 합니다.<\/li>\n<\/ul>\n<h2>결로 방지 방법 ② 실내 습도 관리: 40~60%, 결로가 보이면 낮게<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig3.png\" alt=\"결로 방지 습도 관리: 실내 적정 습도 40~60%\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>환경부·국립환경과학원 자료에 따르면 사람이 가장 쾌적하게 느끼고 건강한 환경을 유지하기 위한 습도는 <strong>40~60%<\/strong>입니다. 실내가 너무 건조하면 여러 질환을 일으킬 수 있고, 반대로 너무 습하면 미생물이 번식할 수 있습니다. 특히 결로가 생기고 있다면 <strong>주기적인 환기와 제습기 사용 등으로 습도를 낮게 유지<\/strong>하라고 안내합니다.<\/p>\n<ul>\n<li><strong>습도계로 확인하기:<\/strong> 체감만으로는 습도를 알기 어렵습니다. 습도계를 두고 40~60% 범위를 벗어나는지 살펴보세요.<\/li>\n<li><strong>난방만으로는 습도 조절이 어렵습니다:<\/strong> 실내 온도는 난방기로 쉽게 맞출 수 있지만 습도는 그렇지 않아서, 가습기·제습기·식물 키우기 등 여러 방법을 함께 써야 한다고 안내합니다.<\/li>\n<li><strong>가습기·제습기는 관리가 먼저:<\/strong> 이런 기기도 제대로 관리하지 않으면 오히려 실내공기질을 더 오염시키는 원인이 될 수 있습니다. 창에 물방울이 맺히기 시작했다면 가습보다 환기와 제습 쪽으로 습도를 낮게 유지하는 것이 환경부 안내에 맞습니다.<\/li>\n<li><strong>제습·항습 유지:<\/strong> 환경부 환경보건포털은 곰팡이 예방을 위해 제습제나 건조기, 에어컨 등을 사용해 실내를 일정한 온도와 습도로 유지하라고 안내합니다.<\/li>\n<\/ul>\n<h2>결로 방지 방법 ③ 난방 온도와 창문 단열(뽁뽁이·문풍지·커튼)<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig4.png\" alt=\"난방 적정온도 20도와 창문 단열: 에어캡·커튼·문풍지\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>한국에너지공단은 겨울철 적정 실내 난방온도를 <strong>20℃<\/strong>로 안내하고, 창문 등으로 난방열이 새어 나가지 않도록 관리하라고 권합니다. 창을 통한 열손실을 줄이는 방법으로는 다음을 제시합니다.<\/p>\n<ul>\n<li>창 표면에 <strong>에어캡(뽁뽁이)<\/strong>을 붙이고 <strong>두꺼운 커튼<\/strong>을 쳐서 열손실 줄이기<\/li>\n<li>창문 틈에 <strong>문풍지<\/strong>를 붙여 열손실 줄이기<\/li>\n<li>바닥에 러그나 매트를 깔아 발로 빼앗기는 열 막기<\/li>\n<\/ul>\n<p>에너지공단 안내에 따르면 이렇게 창문 등으로 새는 열을 관리하면 <strong>실내 온도를 약 2~3℃ 높이는 효과<\/strong>가 있습니다. 또 2025년 2월 보도자료에서는 에어캡·문풍지·커튼으로 틈새 열손실과 외풍을 막으면 <strong>한 달 도시가스 사용량의 5.5%<\/strong>를 줄일 수 있다고 밝혔습니다.<\/p>\n<h3>결로 방지 뽁뽁이, 효과 있을까?<\/h3>\n<p>공식 자료에서 에어캡은 <strong>창을 통한 열손실을 줄이는 수단<\/strong>으로 안내돼 있습니다. 결로에 대해서는 에너지공단이 \"단열을 강화해 실내 표면 온도가 이슬점 이하로 떨어지지 않게 한다\"는 원리를 제시하는데, 이 원리 자체는 벽체와 바닥의 단열재·방습층 시공을 두고 한 설명입니다. 이번에 확인한 공식 자료 범위에서는 <strong>에어캡이 창문 결로를 얼마나 줄이는지 수치로 제시한 자료는 찾지 못했습니다.<\/strong> 그러니 뽁뽁이를 붙였더라도 환기와 습도 관리는 그대로 하고, 창틀과 유리 가장자리에 물기가 맺히는지 계속 확인하는 편이 안전합니다.<\/p>\n<h3>결로가 너무 심하다면: 단열 보강<\/h3>\n<p>환기와 습도 관리를 해도 결로가 계속 심하다면 근본적인 해결이 필요할 수 있습니다. 환경부·국립환경과학원 자료는 이런 경우 <strong>건축 관련 전문가의 자문을 받아 단열 시공<\/strong>을 하는 것이 좋다고 안내합니다. 에너지공단도 벽체와 바닥에 단열재와 방습층을 시공해 실내 표면 온도가 이슬점 아래로 떨어지지 않게 하라고 설명합니다. 세입자라면 임의로 시공하기보다 집주인이나 관리주체와 먼저 상의하세요.<\/p>\n<h2>결로 곰팡이 예방하는 법과 생겼을 때 대처법<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig5.png\" alt=\"결로 곰팡이 대처 순서: 제거, 누수 수리, 건조\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>누수나 결로가 생긴 집은 곰팡이 같은 미생물이 번식하기 쉽습니다. 환경부·국립환경과학원 자료는 결로를 방치하면 곰팡이 포자가 공기 중으로 퍼져 <strong>천식·비염 같은 호흡기 질환이나 아토피<\/strong>를 일으킬 수 있고, 일부 곰팡이는 가려움증·습진 등의 증상을 일으키기도 한다고 설명합니다. 환경부 환경보건포털에 따르면 어린이, 노인, 임산부, 만성폐질환이 있는 사람처럼 면역이 약한 사람은 곰팡이에 더 취약할 수 있습니다.<\/p>\n<h3>곰팡이가 생겼을 때 순서<\/h3>\n<ol>\n<li><strong>보이면 바로 제거:<\/strong> 곰팡이는 번식하기 전에 제거하고, 곰팡이 전용 제거제를 쓴 뒤 <strong>완전히 건조<\/strong>시킵니다(환경부).<\/li>\n<li><strong>원인 수리:<\/strong> 벽이나 노후 배관, 외벽에서 물이 새는 곳이 있는지 확인하고 되도록 빨리 수리합니다(환경부 환경보건포털).<\/li>\n<li><strong>오염된 자재는 교체 후 결로 대책:<\/strong> 결로로 미생물이 번식했다면 오염된 자재를 제거한 뒤 결로 방지대책을 실행하는 것이 좋다고 안내합니다(환경부·국립환경과학원).<\/li>\n<li><strong>재발 막기:<\/strong> 온도 차이로 창문 등에 습기가 생기지 않도록 예방하고, 곰팡이의 먹이가 될 수 있는 먼지를 없애도록 정기적으로 청소합니다.<\/li>\n<\/ol>\n<h3>곰팡이 제거할 때 안전 수칙<\/h3>\n<ul>\n<li>환경부 환경보건포털은 일반적인 곰팡이 제거에 <strong>시중의 곰팡이 제거 제품<\/strong>을 쓰거나 <strong>약 3.8리터의 물에 표백제 1컵 이하<\/strong>를 넣어 쓰는 방법을 소개합니다. 제품을 쓸 때는 제품에 적힌 사용법을 따르세요.<\/li>\n<li><strong>암모니아가 첨가된 표백제는 사용하지 마세요.<\/strong> 위험한 유독가스가 생길 수 있다고 안내돼 있습니다.<\/li>\n<li>곰팡이를 청소할 때는 <strong>마스크 착용<\/strong>이 권장되고, 밀폐된 채 청소하기보다 <strong>환기하면서<\/strong> 청소하는 것이 좋습니다.<\/li>\n<li>범위가 넓거나 벽 속까지 번진 것 같으면 무리하게 혼자 해결하려 하기보다 원인(누수·단열)을 먼저 확인하세요.<\/li>\n<\/ul>\n<p>질병관리청 국가건강정보포털은 곰팡이를 집먼지진드기·꽃가루와 함께 대표적인 호흡기 알레르기 항원으로 소개하며, 알레르기 치료의 기본 원칙은 <strong>원인 항원에 노출되는 것을 피하거나 줄이는 것<\/strong>이라고 설명합니다. 곰팡이가 생긴 뒤 콧물·기침 같은 증상이 계속되거나 천식 증상이 조절되지 않으면 의료기관에서 진료를 받으세요.<\/p>\n<h2>창문 결로 줄이기 체크리스트<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig6.png\" alt=\"창문 결로 줄이기 체크리스트\" style=\"width:100%;border-radius:12px;\"><\/p>\n<ul>\n<li>[ ] 아침마다 창 유리 아래쪽과 창문틀, 벽 모서리에 물기·검은 점이 없는지 확인했나요?<\/li>\n<li>[ ] 추운 날에도 창문을 활짝 열고 짧게(1회 5~10분 정도) 자주 환기하고 있나요?<\/li>\n<li>[ ] 요리할 때 레인지 후드를 켜고 창문을 조금 열어 두나요? 샤워 후 배기팬을 켜고 문을 열어 두나요?<\/li>\n<li>[ ] 습도계로 실내 습도가 40~60% 범위인지 확인하고, 결로가 보이면 환기·제습으로 낮추고 있나요?<\/li>\n<li>[ ] 난방은 20℃를 기준으로, 창에는 에어캡·커튼·문풍지로 열손실을 줄였나요?<\/li>\n<li>[ ] 가구와 가전을 벽에서 조금 띄워 공기가 통하게 했나요?<\/li>\n<li>[ ] 곰팡이가 보이면 바로 제거하고 완전히 말린 뒤, 누수가 없는지 확인했나요?<\/li>\n<\/ul>\n<h2>마무리<\/h2>\n<p>창문 결로는 <strong>습한 실내 공기가 차가운 창과 벽을 만날 때<\/strong> 생깁니다. 그래서 대책도 두 방향입니다. 환기와 제습으로 <strong>습기를 줄이고<\/strong>, 적정 난방과 단열로 <strong>창·벽이 너무 차가워지지 않게<\/strong> 하는 것입니다. 실내 습도는 40~60%를 기준으로 하되 결로가 보이면 낮게 유지하고, 추운 날엔 짧게 자주 환기해 보세요. 이미 곰팡이가 생겼다면 제거와 건조만큼 누수·단열 같은 원인을 함께 확인하는 것이 중요합니다.<\/p>\n<h2>출처<\/h2>\n<ul>\n<li>대한민국 정책브리핑(자료제공: 국립환경과학원), <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148909591\" target=\"_blank\" rel=\"noopener\">실내생활 늘어나는 겨울철, 공기질 관리 어떻게?(2022.12.20)<\/a><\/li>\n<li>대한민국 정책브리핑(자료: 환경부), <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148908744\" target=\"_blank\" rel=\"noopener\">“우리집 실내공기 이렇게 관리하세요”(2022.11.29)<\/a><\/li>\n<li>환경부 환경보건포털, <a href=\"https://www.ehtis.or.kr/cmn/sym/mnu/mpm/111021211/htmlCnView.do\" target=\"_blank\" rel=\"noopener\">실내공기 – 곰팡이<\/a><\/li>\n<li>한국에너지공단 냉난방 효율개선 지원안내센터, <a href=\"https://min24.energy.or.kr/consult/info/view4.do\" target=\"_blank\" rel=\"noopener\">겨울철 에너지절약·결로 방지 안내<\/a><\/li>\n<li>한국에너지공단 보도자료, <a href=\"https://www.energy.or.kr/front/board/View3.do?boardMngNo=3&amp;boardNo=10024875\" target=\"_blank\" rel=\"noopener\">일상 속 작은 실천이 난방비 절약의 핵심(2025.2.28)<\/a><\/li>\n<li>국가법령정보센터, <a href=\"https://www.law.go.kr/LSW/admRulSideInfoP.do?admRulSeq=2200000028943&amp;chrClsCd=010202&amp;docCls=jo&amp;joBrNo=00&amp;joChgYn=N&amp;joNo=0002&amp;langType=Ko&amp;urlMode=admRulScJoRltInfoR\" target=\"_blank\" rel=\"noopener\">국토교통부 「공동주택 결로 방지를 위한 설계기준」 제2조(정의)<\/a><\/li>\n<li>질병관리청 국가건강정보포털, <a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5806\" target=\"_blank\" rel=\"noopener\">알레르기<\/a><\/li>\n<\/ul>\n";
editor.innerHTML = articleHTML;

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}

copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  } else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({ block: 'center' });
    alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
