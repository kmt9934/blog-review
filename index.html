<script>
const POSTS = {"b3": {"title": "전기장판·전기히터 전기요금 계산법: 소비전력×시간에 누진 구간까지 넣어 한 달 요금 미리 보기", "html": "<h1>전기장판·전기히터 전기요금 계산법: 소비전력×시간에 누진 구간까지 넣어 한 달 요금 미리 보기<\/h1>\n<p>밤 기온이 한 자릿수로 내려가는 10월부터 전기장판과 전기히터를 꺼내는 집이 많습니다. 그런데 \"하루 몇 시간 켜면 한 달에 얼마\"라는 숫자는 제품 소비전력만으로 나오지 않습니다. 주택용 전기요금은 그 달 전체 사용량이 몇 kWh인지에 따라 1kWh 값이 달라지는 누진 구조라서, 같은 전기장판이라도 평소 전기를 적게 쓰는 집과 많이 쓰는 집의 추가 요금이 다릅니다. 이 글은 한국전력 주택용(저압) 요금표 숫자로 실제 청구액이 얼마나 늘어나는지 끝까지 계산해 봅니다. 숫자는 2026년 10~12월 적용 요금 기준입니다.<\/p>\n<h2>300kWh 쓰던 집에 전기장판 한 달, 청구서는 얼마나 늘까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"월 300kWh 가정에 전기장판 48kWh를 더했을 때 청구액 변화 요약 카드\"><\/p>\n<p>먼저 결론에 해당하는 숫자 하나부터 보겠습니다. 10월에 한 달 300kWh를 쓰는 집이 있다고 하겠습니다. 이 집이 소비전력 표기가 200W인 전기장판을 하루 8시간, 30일 동안 켠다면 전기장판이 쓰는 전력량은 0.2kW × 8시간 × 30일 = <strong>48kWh<\/strong>입니다. 그 달 사용량은 300kWh에서 348kWh로 늘어납니다.<\/p>\n<p>한전 요금표로 두 경우를 각각 계산하면 300kWh일 때 청구액은 <strong>57,760원<\/strong>, 348kWh일 때는 <strong>70,130원<\/strong>입니다. 전기장판 한 달 값이 <strong>12,370원<\/strong>이라는 뜻입니다. 48kWh를 단순히 \"1kWh에 120원\"으로 계산하면 5,760원이 나오는데, 실제 증가분은 그 두 배가 넘습니다. 이유는 두 가지입니다. 첫째, 추가로 쓴 48kWh는 이미 200kWh를 넘긴 뒤에 쓰는 전기라 2구간 단가 214.6원이 붙습니다. 둘째, 기후환경요금과 연료비조정요금이 kWh마다 더해지고, 그 합계에 부가가치세 10%와 전력산업기반기금 2.7%가 다시 붙습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">항목<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">300kWh (전기장판 없음)<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">348kWh (전기장판 추가)<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">기본요금<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,600원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,600원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전력량요금<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">45,460원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">55,760원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">기후환경요금(9원/kWh)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,700원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">3,132원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">연료비조정요금(5원/kWh)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,500원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,740원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전기요금계<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">51,260원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">62,232원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">부가가치세 10%<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">5,126원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">6,223원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전력산업기반기금 2.7%<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,380원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,680원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">청구액(10원 미만 절사)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">57,760원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">70,130원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>표의 마지막 줄 차이가 실제로 통장에서 더 나가는 돈입니다. 같은 전기장판을 평소 180kWh만 쓰는 집에서 켜면 결과가 달라집니다. 180kWh일 때 청구액은 28,200원, 228kWh가 되면 39,210원으로 11,010원이 늘어납니다. 이 집은 사용량이 200kWh 선을 넘으면서 기본요금이 910원에서 1,600원으로 바뀌는 것까지 겹쳤습니다. 그래서 \"우리 집은 얼마\"를 알려면 평소 사용량부터 알아야 합니다. 지난달 청구서의 사용량(kWh) 칸이나 한전ON 사용량 조회 화면에서 이 숫자를 먼저 적어 두면 아래 계산을 그대로 따라 할 수 있습니다.<\/p>\n<h2>계산식 풀이: kWh 구하기부터 부가세·기금까지<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"전기요금 계산 순서 5단계 요약 카드\"><\/p>\n<p>전기요금 청구액은 다섯 단계로 나옵니다. 첫 단계는 기기별 사용 전력량입니다. 소비전력(W)을 1,000으로 나눠 kW로 바꾸고 하루 사용 시간과 사용 일수를 곱합니다. 전기히터 표기가 2,000W라면 2kW이고, 하루 3시간씩 30일이면 2 × 3 × 30 = 180kWh입니다. 온도조절 장치가 있는 제품은 설정 온도에 이르면 전원을 끊었다 다시 켜므로, 이렇게 구한 값은 \"가장 많이 쓴 경우\"로 보면 됩니다.<\/p>\n<p>두 번째 단계는 평소 사용량에 이 값을 더해 그 달 전체 사용량을 구하는 일입니다. 누진 구간은 기기별이 아니라 계량기 하나 전체 사용량으로 정해집니다. 세 번째 단계에서 전체 사용량으로 기본요금과 전력량요금을 구합니다. 기본요금은 구간 하나에 해당하는 금액만 내고, 전력량요금은 구간마다 나눠서 더합니다. 348kWh라면 처음 200kWh는 120원, 나머지 148kWh는 214.6원을 곱해 24,000원 + 31,760.8원 = 55,760.8원입니다.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">348kWh 청구액을 처음부터 끝까지 계산<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">기본요금: 201~400kWh 구간이라 1,600원<\/li><li style=\"color:#1c2f52;\">전력량요금: 200 × 120.0 + 148 × 214.6 = 55,760.8원<\/li><li style=\"color:#1c2f52;\">기후환경요금 348 × 9 = 3,132원, 연료비조정요금 348 × 5 = 1,740원<\/li><li style=\"color:#1c2f52;\">전기요금계: 1,600 + 55,760.8 + 3,132 + 1,740 = 62,232원(원 미만 버림)<\/li><li style=\"color:#1c2f52;\">부가가치세 62,232 × 10% = 6,223원, 전력산업기반기금 62,232 × 2.7% = 1,680원(10원 미만 버림)<\/li><li style=\"color:#1c2f52;\">청구액: 62,232 + 6,223 + 1,680 = 70,135원 → <strong style=\"color:#1c2f52;\">70,130원<\/strong><\/li><\/ol><\/div>\n<p>네 번째 단계는 기후환경요금과 연료비조정요금입니다. 둘 다 전체 사용량에 단가를 곱합니다. 2026년 10~12월에는 기후환경요금 kWh당 9원, 연료비조정요금 kWh당 +5원이 붙습니다. 다섯 번째 단계에서 여기까지의 합계(전기요금계)에 부가가치세 10%와 전력산업기반기금을 더합니다. 기금 요율은 전기사업법 시행령 제36조에 \"전기요금의 1천분의 27\"로 정해져 있어 2.7%입니다. 인터넷 계산 예시 가운데 아직 3.7%로 계산한 글이 있으니 비교할 때 이 숫자부터 맞춰 보세요. 끝자리 처리(원 미만, 10원 미만 버림)는 한전 계산기와 몇십 원 차이가 날 수 있습니다.<\/p>\n<h2>사용량 구간에 따라 1kWh 값이 달라지는 표<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"주택용 저압 누진 구간별 기본요금과 kWh당 실제 부담액 표 카드\"><\/p>\n<p>계산을 매번 처음부터 하기 번거롭다면 \"추가 1kWh가 실제로 얼마인가\"만 외워 두면 됩니다. 전력량요금 단가에 기후환경요금 9원과 연료비조정요금 5원을 더하고, 부가세와 기금을 합친 12.7%를 곱하면 구간별 실제 부담액이 나옵니다. 1구간은 (120.0 + 14) × 1.127 = 약 151원, 2구간은 (214.6 + 14) × 1.127 = 약 258원, 3구간은 (307.3 + 14) × 1.127 = 약 362원입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">구간(1~6월·9~12월)<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">기본요금<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">전력량요금<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">추가 1kWh 실제 부담<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">200kWh 이하<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">910원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">120.0원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 151원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">201~400kWh<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,600원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">214.6원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 258원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">400kWh 초과<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">7,300원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">307.3원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 362원<\/td><\/tr><\/tbody><\/table><\/div>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"구간별 추가 1kWh 실제 부담액이 151원, 258원, 362원으로 올라가는 계단 그래프\"><figcaption>같은 1kWh도 3구간에서는 1구간의 2.4배<\/figcaption><\/figure>\n<p>구간 경계는 계절마다 다릅니다. 7월 1일부터 8월 31일까지 여름철에는 300kWh와 450kWh가 경계이고, 나머지 달은 200kWh와 400kWh가 경계입니다. 난방 기기를 쓰는 10월~3월은 모두 200·400kWh 기준을 적용받습니다. 또 12월 1일부터 2월 말일까지 겨울철에 한 달 1,000kWh를 넘기면 넘는 부분에 kWh당 736.2원이 붙는 슈퍼유저 요금이 있습니다. 일반 가정에서 흔한 경우는 아니지만 전기 보일러나 대형 히터를 여러 대 쓰는 집이라면 함께 따져 볼 숫자입니다.<\/p>\n<p>위 단가는 한전 요금표에 2023년 11월 9일부터 적용으로 표시된 주택용 저압 요금이고, 아파트처럼 고압으로 공급받는 집은 주택용 고압 요금(1구간 105.0원, 2구간 174.0원, 3구간 242.3원)을 씁니다. 관리비 고지서에 전기료가 함께 나오는 아파트라면 단지 계약 방식에 따라 계산이 달라지므로, 고지서에 적힌 우리 집 사용량과 금액을 기준으로 위 방식의 증가분만 가늠하는 편이 현실적입니다.<\/p>\n<h2>전기장판과 전기히터, 같은 한 달이 다른 결과가 나오는 이유<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"전기장판 48kWh와 전기히터 180kWh 추가 시 청구액 비교 카드\"><\/p>\n<p>난방 기기 요금 차이는 대부분 소비전력에서 갈립니다. 같은 300kWh 집에서 표기 200W 전기장판을 하루 8시간 쓰면 48kWh가 늘고, 표기 2,000W 전기히터를 하루 3시간 쓰면 180kWh가 늘어납니다. 사용 시간은 히터가 훨씬 짧은데 전력량은 3.75배입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">상황(월 300kWh 집)<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">늘어난 사용량<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">청구액<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">증가분<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전기장판 200W × 8시간 × 30일<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">48kWh → 348kWh<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">70,130원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">+12,370원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전기히터 2,000W × 3시간 × 30일<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">180kWh → 480kWh<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">118,910원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">+61,150원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">둘 다 사용<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">228kWh → 528kWh<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">136,300원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">+78,540원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>전기히터를 켠 경우 청구액이 두 배 가까이 되는 이유는 사용량이 400kWh를 넘어 3구간에 들어갔기 때문입니다. 480kWh에서 기본요금은 7,300원으로 오르고, 400kWh를 넘긴 80kWh에는 307.3원이 붙습니다. 전력량요금은 200 × 120 + 200 × 214.6 + 80 × 307.3 = 91,504원, 전기요금계는 105,524원, 부가세 10,552원과 기금 2,840원을 더해 청구액 118,910원이 됩니다.<\/p>\n<p>두 기기를 모두 쓰는 경우도 같은 방식입니다. 528kWh로 계산하면 기본요금 7,300원, 전력량요금 24,000 + 42,920 + 39,334.4 = 106,254.4원이 나오고 여기에 기후환경·연료비조정요금 7,392원, 부가세 12,095원, 기금 3,260원이 붙어 136,300원입니다. 온도조절기로 히터가 실제로는 절반만 돌았다면 결과는 훨씬 낮아집니다.<\/p>\n<p>이 비교에서 읽을 수 있는 판단 기준은 이렇습니다. 몸에 닿는 곳만 데우는 전기장판은 사용 시간이 길어도 kWh가 작고, 공기를 데우는 히터는 짧게 써도 kWh가 큽니다. 히터를 쓸 생각이라면 \"하루 몇 시간\"보다 \"우리 집이 400kWh 선을 넘느냐\"를 먼저 계산해 보는 편이 요금 예측에 정확합니다. 제품 소비전력은 본체 명판이나 설명서, 그리고 한국에너지공단 효율관리제도 사이트에서 모델명으로 신고 정보를 찾아볼 수 있습니다.<\/p>\n<h2>400kWh 경계에서 생기는 6,780원 차이와 줄이는 순서<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"400kWh와 401kWh 청구액 차이 6,780원 요약 카드\"><\/p>\n<p>누진 구조에서 가장 손해가 큰 지점은 구간 경계입니다. 1~6월·9~12월 기준으로 400kWh를 쓴 집의 청구액은 83,530원인데, 1kWh 더 쓴 401kWh에서는 90,310원입니다. 1kWh 차이로 <strong>6,780원<\/strong>이 늘어납니다. 기본요금이 1,600원에서 7,300원으로 5,700원 오르고, 그 금액에 부가세와 기금이 붙기 때문입니다. 401kWh째 전기 자체의 값은 300원대지만 기본요금 변화가 그보다 훨씬 큽니다.<\/p>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"400kWh 83,530원과 401kWh 90,310원 청구액 비교 막대 그림\"><figcaption>기본요금 1,600원→7,300원이 차이의 대부분<\/figcaption><\/figure>\n<p>그래서 겨울철 전기 난방을 쓰는 집은 400kWh 근처에서 사용량을 조정할 때 효과가 가장 큽니다. 같은 원리로 200kWh 경계에서도 기본요금이 910원에서 1,600원으로 바뀌지만 차이는 690원 수준이라 400kWh 경계만큼 크지 않습니다.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">400kWh 선 근처라면 이 순서로 줄여 보기<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">지난달 사용량과 검침일을 확인: 청구서의 검침 기간 안에서 남은 날짜를 셉니다.<\/li><li style=\"color:#1c2f52;\">하루 여유량 계산: (400 − 현재까지 사용량) ÷ 남은 일수. 예를 들어 20일 동안 280kWh를 썼고 10일이 남았다면 하루 12kWh입니다.<\/li><li style=\"color:#1c2f52;\">큰 기기부터 시간 조정: 2kW 히터 1시간을 줄이면 하루 2kWh, 200W 전기장판 1시간은 0.2kWh입니다.<\/li><li style=\"color:#1c2f52;\">잠잘 때 장판 온도와 예약 시간을 낮추고, 히터는 방을 데운 뒤 끄는 방식으로 사용 시간을 줄입니다.<\/li><\/ol><\/div>\n<p>한전ON에서는 검침 주기 안의 사용량을 조회할 수 있어 월말에 갑자기 놀라는 일을 줄일 수 있습니다. 검침일은 집마다 달라서 \"1일~말일\"이 아니라 청구서에 찍힌 검침 기간으로 계산해야 맞습니다. 전기 난방을 처음 시작하는 10월에 한 번, 한파가 시작되는 12월 초에 한 번 남은 여유량을 계산해 보면 경계를 넘을지 미리 알 수 있습니다.<\/p>\n<h2>우리 집 숫자로 다시 계산할 때 쓰는 자료와 주의점<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"전기요금 계산에 필요한 자료와 주의점 요약 카드\"><\/p>\n<p>직접 계산할 때 필요한 숫자는 세 가지입니다. 평소 한 달 사용량(kWh), 기기 소비전력(W), 하루 사용 시간과 일수입니다. 평소 사용량은 지난해 같은 달 청구서를 보는 편이 정확합니다. 10월 사용량과 1월 사용량은 집마다 꽤 다르기 때문입니다. 그다음 이 글의 순서대로 전체 사용량을 구하고, 구간별 단가를 적용하면 됩니다.<\/p>\n<p>요금이 바뀌는 시점도 알아 두면 좋습니다. 연료비조정단가는 분기마다 정해지며 kWh당 ±5원 범위 안에서만 움직입니다. 한전은 2026년 10~12월분을 +5원으로 유지한다고 9월 21일 발표했습니다. 1~3월분 단가는 12월에 다시 정해지므로, 1월 이후 요금을 계산할 때는 그때 발표를 반영해야 합니다. 기본요금과 전력량요금은 정부 인가를 거쳐 바뀌므로 바뀌면 한전 요금표 페이지의 적용일자가 달라집니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">다시 계산할 때 볼 것<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">어디서<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">이 글 기준값<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">구간별 기본요금·전력량요금<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">한전 주택용 요금표<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">910/1,600/7,300원, 120.0/214.6/307.3원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">연료비조정단가<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">한전 분기 발표<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">+5원(2026년 10~12월)<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전력산업기반기금<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">전기사업법 시행령 제36조<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2.7%<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">우리 집 사용량·검침일<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">한전ON, 청구서<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">집마다 다름<\/td><\/tr><\/tbody><\/table><\/div>\n<p>복지할인(장애인·국가유공자·기초생활수급 등)이나 대가족·출산가구 요금을 받는 집은 할인액이 별도로 빠지므로 이 글의 금액보다 적게 나옵니다. 한전 요금표 페이지에는 복지할인 대상 중 월 200kWh 이하 사용 가구에 추가 감액 제도가 있다고 안내돼 있고, 정확한 금액은 한전 전기요금 계산기에서 할인 종류를 고르면 나옵니다.<\/p>\n<div style=\"background:#eef4fb;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">요금표와 사용량을 공식 사이트에서 열기<\/h3><p style=\"margin:0 0 12px;line-height:1.7;color:#1c2f52;\">요금표는 로그인 없이 볼 수 있고, 사용량 조회는 한전ON 로그인 뒤 가능합니다.<\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://cyber.kepco.co.kr/ckepco/front/jsp/CY/E/E/CYEEHP00101.jsp\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#174ea6;color:#ffffff;font-weight:700;text-decoration:none;\">한전 주택용 전기요금표 보기 →<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://online.kepco.co.kr/\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">한전ON에서 우리 집 사용량 조회 →<\/a><\/p><\/div>\n<p>마지막으로, 온라인 계산기 결과가 이 글과 다르다면 세 가지를 맞춰 보세요. 기금 요율이 2.7%인지, 연료비조정요금 +5원이 들어갔는지, 계절 구간(200·400kWh)이 맞는지입니다. 이 세 가지가 같으면 남는 차이는 끝자리 처리 정도입니다.<\/p>\n<h3>이 글에서 숫자를 가져온 곳<\/h3><ul><li><a href=\"https://cyber.kepco.co.kr/ckepco/front/jsp/CY/E/E/CYEEHP00101.jsp\">한국전력공사 사이버지점 주택용 전력 요금표<\/a><\/li><li><a href=\"https://home.kepco.co.kr/kepco/EB/A/htmlView/EBAAHP002_07.do?menuCd=FN430101\">한국전력공사 기후환경요금·연료비조정요금 안내<\/a><\/li><li><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\">국가법령정보센터 전기사업법 시행령 제36조<\/a><\/li><li><a href=\"https://eep.energy.or.kr/\">한국에너지공단 효율관리제도<\/a><\/li><li><a href=\"https://online.kepco.co.kr/\">한전ON<\/a><\/li><\/ul>"}};

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
