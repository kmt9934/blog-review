<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const articleHTML = "<h1>가습기 청소 방법과 주기 총정리: 구연산·베이킹소다·식초 써도 될까?<\/h1>\n<p>날씨가 건조해지면 창고에 넣어 두었던 가습기를 다시 꺼내게 됩니다. 그런데 가습기는 물을 담아 두는 기기라서 관리가 소홀하면 물때와 세균이 생기기 쉽습니다. 이 글에서는 질병관리청(당시 질병관리본부)·보건복지부의 가습기 세척요령, 한국소비자원의 가습기 사용·세척 주의사항, 환경부·국립환경과학원의 실내 습도 안내를 바탕으로 <strong>청소 안 하면 생기는 일 → 청소 주기 → 청소 방법 → 써도 되는 세제 → 가습기 살균제 사건 → 물 관리와 사용 습관<\/strong> 순서로 정리했습니다. (2026년 9월 27일 확인 기준)<\/p>\n<p><strong>먼저 한 가지 원칙:<\/strong> 가습기 물통에는 <strong>물 이외의 어떤 것도 넣지 마세요.<\/strong> 살균제든 세정제든 향료든 마찬가지입니다. 한국소비자원은 제품 내부에 물 이외의 첨가물을 넣으면 입자로 분해돼 호흡기로 들어가 기관지에 염증을 일으킬 수 있다고 안내합니다. 세제는 물통을 <strong>씻을 때만<\/strong> 쓰고, 남지 않게 헹궈 내는 것이 공식 세척요령입니다.<\/p>\n<h2>한눈에 보는 가습기 관리 기준<\/h2>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">항목<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">공식 안내 내용<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">출처<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">물 교체<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>하루에 한 번<\/strong>. 물이 남아 있어도 하루 지난 물은 새 물로 교체<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">물통·진동자 닦기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>이틀마다<\/strong> 부드러운 스펀지나 천으로<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">세제 세척<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>1주일에 한 번<\/strong> 중성세제로 세척 후 <strong>3회 이상<\/strong> 헹굼<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">분무유도관·분출구<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">1주일에 한 번 솔이나 천으로 닦기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">쓰면 안 되는 것<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">락스, 비누, 알칼리성·산성 세제, 기름 성분이 있는 유기 세제 / 물통에 물 이외의 첨가물<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011), 한국소비자원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">보관<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">물통·진동자의 물을 없애고 건조한 상태로<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">질병관리본부(2011)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">실내 습도<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>40~60%<\/strong><\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">환경부·국립환경과학원<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h2>가습기 청소 안 하면 생기는 일<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig1.png\" alt=\"가습기 청소 안 하면 생기는 일: 세균·곰팡이 증가와 호흡기 영향\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>가습기는 물이 고여 있는 구조라 세균과 곰팡이가 자라기 쉽습니다. 공식 자료에서 확인되는 내용은 다음과 같습니다.<\/p>\n<ul>\n<li><strong>며칠만 방치해도 세균이 늘어납니다.<\/strong> 한국정책방송(KTV)의 정부 브리핑 영상은 쓰고 남은 물을 갈지 않고 두거나 <strong>2~3일만 세척을 안 해도 세균 수가 급격히 늘어난다<\/strong>고 전하며, 물은 하루만 쓰고 남은 물은 버리라고 안내합니다. 특히 초음파식은 자주 세척하지 않으면 물속 세균이 그대로 호흡기에 영향을 줄 수 있다고 설명합니다.<\/li>\n<li><strong>물을 쓰는 가전은 오염원이 될 수 있습니다.<\/strong> 질병관리청 국가건강정보포털은 냉방기·가습기처럼 물을 쓰는 가전을 정기적으로 청소하지 않으면 곰팡이, 세균 등이 오염원으로 작용해 <strong>과민성 폐장염, 레지오넬라증, 가습기열<\/strong> 등이 생길 수 있다고 설명합니다.<\/li>\n<li><strong>오래 보관했던 가습기는 특히 주의합니다.<\/strong> 한국소비자원은 오랫동안 쓰지 않고 보관한 가습기는 물때와 세균이 번식했을 가능성이 높으니 세척 없이 바로 쓰지 말라고 안내합니다.<\/li>\n<li><strong>습도가 너무 높아도 문제입니다.<\/strong> 환기되지 않는 밀폐된 공간에서 가습기를 오래 틀면 습도가 지나치게 높아져 곰팡이와 세균이 크게 늘 수 있다고 한국소비자원은 경고합니다.<\/li>\n<\/ul>\n<h2>가습기 청소 주기: 매일·이틀·일주일<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig2.png\" alt=\"가습기 청소 주기: 물은 매일, 물통·진동자는 이틀마다, 세제 세척은 주 1회\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>2011년 보건복지부·질병관리본부가 \"살균제 없이 가습기를 안전하게 사용하기 위한\" 세척요령으로 발표한 주기를 정리하면 다음과 같습니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">주기<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">할 일<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">매일<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">물 교체. 물통에 물을 5분의 1가량 넣고 충분히 흔들어 2회 이상 헹군 뒤 새 물 담기. 진동자 부분의 물은 가습기에 표시된 배출구 쪽으로 기울여 모두 빼기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">이틀마다<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">진동자 부분과 물통을 부드러운 스펀지나 천으로 닦기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">1주일에 한 번<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">중성세제로 물통·진동자 세척(3회 이상 헹굼), 분무유도관·분출구는 솔이나 천으로 닦기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">2~3일 쓰지 않았을 때<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">다시 쓰기 전에 반드시 물통과 진동자를 씻기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">쓰지 않을 때<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">물통과 진동자 부분의 물을 없애고 건조한 상태로 보관<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>가습기 구조와 부품 재질은 제품마다 다르므로 <strong>제품 사용설명서의 세척 방법<\/strong>도 함께 확인하세요. 위 주기는 공식 안내의 기본 기준입니다.<\/p>\n<h2>가습기 청소 방법: 부위별 순서<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig3.png\" alt=\"가습기 청소 방법: 손 씻기, 물통·진동자 세척, 헹굼과 건조\" style=\"width:100%;border-radius:12px;\"><\/p>\n<ol>\n<li><strong>손부터 씻기:<\/strong> 가습기를 세척하기 전에 손을 깨끗이 씻습니다.<\/li>\n<li><strong>물통:<\/strong> 부드러운 솔이나 천을 넣어 깨끗이 닦습니다. 한국소비자원도 수조 내부는 잔여물이 남지 않도록 충분히 세척하라고 안내합니다.<\/li>\n<li><strong>진동자(초음파식):<\/strong> 물통과 함께 진동자 부분도 세척합니다. 세제를 썼다면 세제 성분이 남지 않도록 진동자 부분을 천으로 깨끗이 닦아 냅니다. 한국소비자원은 진동자를 <strong>흐르는 물이나 부드러운 솔<\/strong>로 조심스럽게 청소하라고 안내합니다.<\/li>\n<li><strong>분무유도관·분출구(증기 토출부):<\/strong> 1주일에 한 번 솔이나 천으로 닦고, 정기적으로 먼지를 없앱니다.<\/li>\n<li><strong>헹굼:<\/strong> 중성세제를 썼다면 세제가 남지 않도록 <strong>3회 이상<\/strong> 깨끗이 헹굽니다.<\/li>\n<li><strong>건조·보관:<\/strong> 사용하지 않을 때는 물통과 진동자 부분의 물을 없애고 건조한 상태로 둡니다.<\/li>\n<\/ol>\n<h2>가습기 청소, 구연산·베이킹소다·식초 써도 될까?<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig4.png\" alt=\"가습기 청소 세제: 중성세제만 공식 안내, 락스·산성·알칼리성 세제는 금지\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>검색을 해 보면 구연산, 베이킹소다, 식초로 가습기를 닦는 방법이 많이 나옵니다. 하지만 이번에 확인한 공식 세척요령에는 이 세 가지를 쓰라는 안내가 <strong>없습니다.<\/strong> 공식 안내가 제시한 것은 다음 한 가지입니다.<\/p>\n<p>보건복지부·질병관리본부 세척요령은 1주일에 한 번 <strong>중성세제<\/strong>로 세척하되, <strong>반드시 세제 표시사항에서 중성세제임을 확인<\/strong>하라고 합니다. 그리고 <strong>락스나 비누, 알칼리성·산성 세제, 기름 성분이 있는 유기 세제<\/strong>는 쓰면 안 된다고 명시합니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">구분<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">공식 안내에서 확인되는 내용<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">정리<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">중성세제<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">표시사항에서 중성 확인 후 주 1회 세척, 3회 이상 헹굼<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">공식 안내에 있는 방법<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">락스·비누<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">사용하면 안 됨<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">쓰지 않기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">산성·알칼리성 세제<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">사용하면 안 됨<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">쓰지 않기<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">구연산·식초·베이킹소다<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">공식 세척요령에 언급 없음<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">구연산·식초는 산성, 베이킹소다는 약알칼리성이라는 점을 참고. 제조사 설명서가 따로 허용하지 않았다면 공식 기준(중성세제)을 따르기<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>어떤 세정제를 쓰든 <strong>물통에 넣고 가습기를 켜는 것은 안 됩니다.<\/strong> 세척이 끝나면 충분히 헹궈 잔여물을 없애고, 물통에는 물만 담으세요.<\/p>\n<h2>가습기 살균제 사건, 무엇이 문제였나<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig5.png\" alt=\"가습기 살균제 사건 2011년 경과와 피해구제 상담\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>\"물통에 아무것도 넣지 말라\"는 원칙은 2011년 가습기 살균제 사건에서 나왔습니다. 공식 자료로 확인되는 경과만 정리하면 다음과 같습니다.<\/p>\n<ul>\n<li><strong>2011년 8월 31일:<\/strong> 보건복지부 질병관리본부는 원인미상 폐손상에 대한 중간 조사 결과 <strong>가습기살균제(또는 세정제)가 위험요인으로 추정<\/strong>된다고 발표하고, 국민에게 사용 자제를 권고했습니다. 환자-대조군 역학조사에서 폐손상에 대한 가습기살균제의 교차비(Odds ratio)는 47.3으로 나타났습니다. 이때 복지부는 권고 대상이 <strong>가습기 자체가 아니라 가습기에 넣는 살균제<\/strong>라고 강조하며, 매일 물을 갈고 세척요령에 따라 관리하라고 당부했습니다.<\/li>\n<li><strong>2011년 11월 4일:<\/strong> 질병관리본부는 흡입독성 동물실험 1차 부검에서 잠정적인 이상 소견이 나타나자 <strong>모든 국민에게 가습기 살균제 사용 중단을 강력히 권고<\/strong>하고, 살균제 없이 가습기를 쓰기 위한 세척요령을 발표했습니다. 앞에서 정리한 청소 주기가 이때 발표된 내용입니다.<\/li>\n<li><strong>질병관리청 설명:<\/strong> 국가건강정보포털은 이 사건에서 위해물질이 포함된 가습기살균제가 유통돼 임산부·어린이·환자 등에서 원인불명의 호흡기질환과 사망 사례가 발생했다고 설명합니다.<\/li>\n<\/ul>\n<h3>피해가 의심된다면<\/h3>\n<p>가습기살균제 사용으로 생명이나 건강에 피해를 입은 피해자와 유족은 한국환경산업기술원이 운영하는 <strong>가습기살균제 피해지원 종합포털<\/strong>(healthrelief.or.kr)에서 피해구제 제도를 안내받고 신청할 수 있습니다. 제도 일반과 개인 상담은 <strong>☎ 1833-9085<\/strong>로 문의하면 됩니다.<\/p>\n<h2>가습기 물 관리와 안전하게 쓰는 습관<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig6.png\" alt=\"가습기 물 관리와 사용 습관: 기준선, 직접 흡입 금지, 습도 40~60%\" style=\"width:100%;border-radius:12px;\"><\/p>\n<h3>물 관리<\/h3>\n<ul>\n<li>물은 <strong>하루에 한 번<\/strong> 갈고, 남은 물이 있어도 하루 지난 물은 버립니다.<\/li>\n<li>물을 넣을 때는 <strong>기준선<\/strong>을 지킵니다. 한국소비자원은 기준선 이상으로 물을 넣으면 성능 저하와 사고 위험이 있다고 안내합니다.<\/li>\n<li>물통에는 <strong>물만<\/strong> 넣습니다.<\/li>\n<\/ul>\n<h3>사용 습관<\/h3>\n<ul>\n<li>분무되는 습기를 <strong>직접 들이마시지 않도록<\/strong> 합니다(한국소비자원).<\/li>\n<li>바닥이 평탄하고 수평인 곳에 두고, <strong>작동 중에는 옮기지 않습니다.<\/strong> 넘어지면 안전사고나 화재·감전 위험이 있습니다.<\/li>\n<li><strong>밀폐된 공간에서 오래 틀지 않습니다.<\/strong> 오래 사용한 뒤에는 환기로 공기를 순환시켜 곰팡이·진드기 증식을 막는 것이 좋다고 KTV 정부 브리핑은 전합니다.<\/li>\n<li>실내 습도는 <strong>40~60%<\/strong>를 기준으로 합니다(환경부·국립환경과학원). 가습기·제습기도 제대로 관리하지 않으면 오히려 실내공기질을 오염시킬 수 있다고 안내합니다.<\/li>\n<li><strong>가열식은 화상 주의:<\/strong> 한국소비자원 시험에서 일부 가열식 제품은 가습 증기 최대온도가 99℃로 측정됐습니다. 어린이가 손대지 않는 곳에 두세요.<\/li>\n<\/ul>\n<h2>가습기 청소 체크리스트<\/h2>\n<ul>\n<li>[ ] 오늘 물을 새로 갈았나요? (물통을 흔들어 2회 이상 헹군 뒤)<\/li>\n<li>[ ] 이틀에 한 번 물통과 진동자를 부드러운 스펀지나 천으로 닦았나요?<\/li>\n<li>[ ] 이번 주에 중성세제(표시사항 확인)로 세척하고 3회 이상 헹궜나요?<\/li>\n<li>[ ] 분무유도관·분출구의 먼지를 닦았나요?<\/li>\n<li>[ ] 물통에 물 이외의 것(살균제·세정제·향료 등)을 넣지 않았나요?<\/li>\n<li>[ ] 2~3일 쓰지 않았다면 다시 쓰기 전에 씻었나요?<\/li>\n<li>[ ] 습도계로 실내 습도가 40~60% 범위인지 확인했나요?<\/li>\n<\/ul>\n<h2>마무리<\/h2>\n<p>가습기 관리의 핵심은 <strong>물은 매일 갈고, 물통·진동자는 이틀마다 닦고, 일주일에 한 번 중성세제로 씻은 뒤 충분히 헹구는 것<\/strong>입니다. 구연산·식초·베이킹소다는 공식 세척요령에 없는 방법이니 제조사 설명서가 허용할 때만 고려하고, 어떤 경우에도 물통에는 물만 넣으세요. 가습기 살균제 사건 이후 정부가 강조해 온 원칙은 \"살균제 대신 세척과 건조\"입니다.<\/p>\n<h2>출처<\/h2>\n<ul>\n<li>대한민국 정책브리핑(질병관리본부), <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148721617\" target=\"_blank\" rel=\"noopener\">가습기 살균제 사용·판매 중단 강력 권고(2011.11.4)<\/a><\/li>\n<li>대한민국 정책브리핑(보건복지부·질병관리본부 브리핑 내용), <a href=\"https://www.korea.kr/news/healthView.do?newsId=148721624\" target=\"_blank\" rel=\"noopener\">가습기, 안전하게 사용하기 위한 세척요령(2011.11.4)<\/a><\/li>\n<li>보건복지부 보도자료, <a href=\"https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=258624&amp;mid=a10503010300&amp;nPage=965&amp;tag=\" target=\"_blank\" rel=\"noopener\">가습기살균제, 원인미상 폐손상 위험요인 추정(2011.8.31)<\/a><\/li>\n<li>한국소비자원 소비자시대, <a href=\"https://www.kca.go.kr/webzine/board/view?div=kca_2512&amp;linkId=954&amp;menuId=MENU00307\" target=\"_blank\" rel=\"noopener\">가습기 13종 품질비교 – 가습기 사용·세척 시 주의사항(2025년 12월호)<\/a><\/li>\n<li>대한민국 정책브리핑(KTV), <a href=\"https://www.korea.kr/briefing/policyBriefingView.do?newsId=148720489\" target=\"_blank\" rel=\"noopener\">가습기, 잦은 세척으로 세균 막아야(2011.10.20)<\/a><\/li>\n<li>질병관리청 국가건강정보포털, <a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6716\" target=\"_blank\" rel=\"noopener\">공기 오염<\/a><\/li>\n<li>대한민국 정책브리핑(자료제공: 국립환경과학원), <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148909591\" target=\"_blank\" rel=\"noopener\">실내생활 늘어나는 겨울철, 공기질 관리 어떻게?(2022.12.20)<\/a><\/li>\n<li>한국환경산업기술원, <a href=\"https://healthrelief.or.kr/home/main.do\" target=\"_blank\" rel=\"noopener\">가습기살균제 피해지원 종합포털<\/a><\/li>\n<\/ul>\n";
editor.innerHTML = articleHTML;

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}

copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  } else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({ block: 'center' });
    alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
