<script>
const POSTS = {"b3": {"title": "퇴직금 계산: 평균임금에 상여금·연차수당 넣는 법", "html": "<h1>퇴직금 계산: 평균임금에 상여금·연차수당 넣는 법<\/h1>\n<div class=\"article-rich\" style=\"color:#3b1d0f;\">\n<p style=\"color:#3b1d0f;\">월 기본급 300만 원에 매달 연장근로수당 70만 원을 받으며 5년을 일하고 2026년 12월 31일에 마지막 근무를 마친 사람의 퇴직금은, 연장수당까지 넣은 평균임금으로 계산하면 18,107,743원입니다. 월 지급액 370만 원에 근속연수 5를 곱한 1,850만 원보다 392,257원 적어요. 연 600만 원의 정기 상여금과 5일치 미사용 연차수당을 평균임금에 넣으면 20,788,897원까지 올라갑니다. 내 계산과 회사 금액이 다를 때 먼저 볼 곳은 평균임금에 무엇을 얼마나 넣었는지와, 마지막에 통상임금과 비교하는 단계예요.<\/p>\n<p style=\"color:#3b1d0f;\">이 글은 2026년 11월 28일에 열어 본 <a style=\"color:#a8431a;\" href=\"https://www.moel.go.kr/retirementpayCal.do\">고용노동부 퇴직금 계산 페이지<\/a>와 <a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/LSW/lsInfoR.do?efYd=20260918&amp;lsiSeq=284455\">「근로자퇴직급여 보장법」<\/a> 제4조·제8조·제9조·제10조, <a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029727793\">「근로기준법 시행령」 제2조<\/a>·<a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=000600000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">제6조<\/a>·<a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=001700000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">제17조<\/a>·<a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=001800000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">제18조<\/a>, <a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=003700000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95&amp;mode=10\">「근로기준법」 제37조<\/a>, <a style=\"color:#a8431a;\" href=\"https://1350.moel.go.kr/rtmview.do?id=1000284929\">고용노동부 1350 상담 답변<\/a>, <a style=\"color:#a8431a;\" href=\"https://www.minimumwage.go.kr/file/downloadSeq.do?bultnId=4657&amp;fileSeq=1\">2026년 적용 최저임금 고시<\/a>, <a style=\"color:#a8431a;\" href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202111190926213291000\">고용노동부 빠른인터넷상담<\/a>, <a style=\"color:#a8431a;\" href=\"https://labor.moel.go.kr/minwonApply/minwonApply.do\">고용노동부 노동포털 민원서식<\/a>을 바탕으로 썼습니다. 퇴직금제도를 쓰는 사업장의 법정 퇴직금만 다루고, 퇴직연금 DB·DC의 적립금 계산과 퇴직소득세는 범위 밖입니다. 아래에서는 같은 사람의 숫자를 하나씩 바꿔 가며 원인을 짚습니다.<\/p>\n<h2>월 지급액×근속연수와 퇴직금이 다른 이유는?<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"월 지급액에 근속연수를 곱한 값과 퇴직금이 다른 이유 요약 카드\">\n<p style=\"color:#3b1d0f;\">먼저 비교 기준이 되는 사람을 정해 둡니다. 2022년 1월 1일에 입사해 2026년 12월 31일까지 일했고, 월 기본급 300만 원에 실제 연장근로 시간에 따라 달라지는 연장근로수당이 매달 70만 원씩 나왔다고 하겠습니다. 상여금은 아직 없어요. 재직일수는 1,826일입니다. 5년이지만 2024년 윤년이 끼어 있어서 365일의 5배인 1,825일보다 하루 많습니다.<\/p>\n<p style=\"color:#3b1d0f;\">법은 퇴직금을 월급이 아니라 평균임금으로 정합니다. 「근로자퇴직급여 보장법」 제8조 제1항은 계속근로기간 1년에 대해 30일분 이상의 평균임금을 퇴직금으로 지급하는 제도를 두라고 정해요. 고용노동부 계산 페이지의 식으로 쓰면 퇴직금은 1일 평균임금 × 30일 × (재직일수 ÷ 365)입니다. 1일 평균임금은 퇴직 직전 3개월 동안 받은 임금 총액을 그 3개월의 총 일수로 나눈 값이에요.<\/p>\n<p style=\"color:#3b1d0f;\">이 사람의 마지막 3개월은 2026년 10월 1일부터 12월 31일까지 92일입니다. 임금 총액은 (300만 + 70만) × 3 = 1,110만 원이고, 92일로 나눈 1일 평균임금은 120,652원이에요. 월 지급액 370만 원을 30일로 나눈 123,333원이 아닙니다. 3개월이 92일이면 한 달이 평균 30.67일로 잡혀서 평균임금 30일분은 월 지급액보다 조금 작아져요. 여기에 30과 1,826/365를 곱하면 18,107,743원입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #e3c2a8;\">\n  <thead><tr><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">항목<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">값<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">계산<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">재직일수<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">1,826일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">2022.1.1~2026.12.31<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">퇴직 직전 3개월<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">92일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">2026.10.1~2026.12.31<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">3개월 임금 총액<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">11,100,000원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">(기본급 300만 + 연장수당 70만) × 3<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">1일 평균임금<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">120,652원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">11,100,000 ÷ 92<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">퇴직금(평균임금 기준)<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,107,743원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">120,652 × 30 × 1,826 ÷ 365<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">월 지급액 × 5년과의 차이<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">392,257원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,500,000 − 18,107,743<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#3b1d0f;\">표의 퇴직금은 1일 평균임금을 원 미만까지 그대로 곱한 값입니다. 표에 적은 120,652원으로 곱하면 몇 원 달라질 수 있고, 회사의 원 미만 처리에 따라 실제 입금액도 몇 원 다를 수 있어요.<\/p>\n<figure>\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"평균임금에 3개월 임금 총액, 상여금의 3/12, 연차수당의 3/12을 더해 3개월 일수로 나눈 뒤 퇴직금을 구하는 흐름\">\n<figcaption>3개월 임금 총액에 상여금과 연차수당의 3/12을 더해 평균임금을 구하는 순서<\/figcaption>\n<\/figure>\n<p style=\"color:#3b1d0f;\">다음 장부터는 이 기준 사람의 숫자에 퇴사 시기, 상여금, 연차수당, 평균임금을 깎는 사정을 하나씩 얹어 퇴직금이 얼마나 움직이는지 봅니다.<\/p>\n<h2>퇴사일이 달라지면 3개월 일수가 달라집니다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"퇴사일이 달라지면 3개월 일수가 달라진다는 요약 카드\">\n<p style=\"color:#3b1d0f;\">평균임금의 분모는 30이나 90이 아니라 퇴직 직전 3개월의 실제 달력 일수입니다. 퇴직일자를 입력할 때 고용노동부 계산 페이지는 마지막으로 근무한 날의 다음 날을 적으라고 안내해요. 12월 31일까지 일했으면 퇴직일자는 1월 1일이고, 3개월은 10월 1일부터 12월 31일입니다.<\/p>\n<p style=\"color:#3b1d0f;\">매달 받는 금액이 같으면 3개월 임금 총액은 그대로인데 일수만 달라집니다. 일수가 적을수록 하루 평균임금은 올라가요. 아래 표는 재직일수를 1,826일로 같게 두고 마지막 근무일의 달만 바꾼 비교입니다. 월 지급액은 370만 원으로 고정했어요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #e3c2a8;\">\n  <thead><tr><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">마지막 근무일<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">3개월 구간<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">일수<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">1일 평균임금<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">퇴직금<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">2026.11.30<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">9.1~11.30<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">91일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">121,978원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,306,729원<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">2026.12.31<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">10.1~12.31<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">92일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">120,652원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,107,743원<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">2027.1.31<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">11.1~1.31<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">92일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">120,652원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,107,743원<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">2027.2.28<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">12.1~2.28<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">90일<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">123,333원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">18,510,137원<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#3b1d0f;\">12월 말과 1월 말은 둘 다 92일이라 같고, 2월 말은 90일이라 12월 말보다 402,394원 많습니다. 다만 이 비교는 재직일수를 같게 맞춘 것이라, 실제로 퇴사일을 한두 달 미루면 재직일수가 늘어 퇴직금이 더 커지는 효과가 따로 붙어요. 그 달에 상여금이나 수당이 지급되는지, 연차가 새로 생기는지도 결과를 바꿉니다. 일수 차이만 보고 퇴사 날짜를 정하기보다, 아래 세 가지와 같이 계산해 보는 편이 안전합니다.<\/p>\n<p style=\"color:#3b1d0f;\">시급·일급으로 일하거나 달마다 수당이 달라지는 경우에는 3개월 임금 총액 자체가 달라지므로, 급여명세서의 세전 금액을 달마다 적어서 합산해야 합니다. 1350 상담 답변에도 평균임금은 세전 임금 기준이라고 적혀 있어요. 실수령액을 합산하면 평균임금이 실제보다 낮게 나옵니다.<\/p>\n<h2>상여금은 12개월분의 3개월치를 더합니다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"상여금은 직전 12개월 지급액의 3/12을 평균임금에 더한다는 요약 카드\">\n<p style=\"color:#3b1d0f;\">상여금이 퇴직금에 들어가는지는 지급 방식에 달려 있습니다. 1350 상담 답변에 따르면 단체협약, 취업규칙, 근로계약에 지급 조건이 미리 정해져 있거나 관례로 계속 지급해 왔다면 임금으로 보고, 지급 횟수가 연 1회든 4회든 평균임금 산정에 넣습니다. 반대로 사용자의 재량으로 줄지 말지가 정해지는 상여금은 임금으로 보기 어려워서 평균임금에도 통상임금에도 들어가지 않아요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #e3c2a8;\">\n  <thead><tr><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">상여금의 성격<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">평균임금 산입<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">근거<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">취업규칙·근로계약에 지급 조건이 정해져 있음<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">산입<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">1350 상담 답변<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">관례로 계속 지급해 온 사실이 인정됨<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">산입<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">1350 상담 답변<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">지급 여부가 사용자 재량이고 사유가 불확정적임<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">산입하지 않음<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">1350 상담 답변<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#3b1d0f;\">산입할 때는 상여금을 받은 달에 전액을 넣지 않습니다. 평균임금을 산정해야 할 사유가 생긴 날 이전 12개월 동안 받은 상여금 전액에 3/12을 곱해서 3개월 임금 총액에 더해요. 1350 답변이 인용한 고용노동부 행정해석(1994년 8월 1일)은 퇴직 직전 3개월에 상여금이 지급됐는지와 상관없이 이 방식을 쓴다고 봅니다.<\/p>\n<p style=\"color:#3b1d0f;\">기준 사람에게 설과 추석에 각각 300만 원, 연 600만 원의 상여금이 정기적으로 지급된다고 해 보겠습니다. 600만 원 × 3/12은 150만 원이에요. 3개월 임금 총액 1,110만 원에 더하면 1,260만 원이고, 92일로 나눈 1일 평균임금은 136,957원입니다. 퇴직금은 136,957 × 30 × 1,826 ÷ 365로 20,554,735원이 됩니다. 상여금을 빼고 계산한 18,107,743원보다 2,446,992원 많아요.<\/p>\n<p style=\"color:#3b1d0f;\">상여금을 퇴직 직전 3개월에 받은 금액만 넣거나, 아예 빼고 계산하면 이 차이가 그대로 생깁니다. 반대로 12개월 합계를 92일로 비례 배분하는 것도 맞지 않아요. 1350 상담 게시판에는 연차와 상여금을 92일 일할로 계산해 왔는데 틀렸는지 묻는 질문이 올라와 있고, 답변은 3/12 방식이었습니다.<\/p>\n<h2>연차수당은 이미 발생한 분만 3/12을 더합니다<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"연차수당은 퇴직 전전년도 출근율로 퇴직 전년도에 생긴 미사용분만 3/12 산입한다는 요약 카드\">\n<p style=\"color:#3b1d0f;\">연차 미사용수당도 평균임금에 들어가지만 모든 연차가 대상은 아닙니다. 1350 상담 답변을 정리하면 이렇습니다. 퇴직 전전년도 출근율로 퇴직 전년도에 발생한 연차 가운데 쓰지 않고 일한 날의 수당액에 3/12을 곱해 평균임금 산정 기준임금에 포함합니다. 퇴직하는 해에 생긴 연차를 쓰지 못하고 퇴직해서 비로소 지급 사유가 생긴 수당은, 퇴직 전에 지급된 임금이 아니라서 평균임금에 넣지 않아요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #e3c2a8;\">\n  <thead><tr><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">구분<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">예: 2026.12.31 퇴직<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">평균임금 산입<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">퇴직 전에 이미 발생한 미사용수당<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">2025년에 발생한 연차 중 안 쓴 날의 수당<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">수당액 × 3/12 산입<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">퇴직으로 비로소 지급 사유가 생긴 수당<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">2026년에 발생해 쓰지 못한 연차의 수당<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">산입하지 않음<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#3b1d0f;\">1350 답변이 든 사례는 계속근로기간이 2023년 4월 1일부터 2026년 12월 31일까지인 사람입니다. 이 경우 퇴직 전년도인 2025년에 발생한 연차 중 쓰지 않은 날의 수당에 3/12을 곱해 넣으면 된다고 안내해요. 연차는 「근로기준법」 제60조 제1항에 따라 1년간 80% 이상 출근한 사람에게 1년이 지난 다음 날 15일의 유급휴가로 생깁니다. 회사가 입사일 기준인지 회계연도 기준인지에 따라 어느 해에 발생한 연차인지가 달라질 수 있으니, 급여 담당자에게 발생일을 물어보는 편이 좋아요.<\/p>\n<p style=\"color:#3b1d0f;\">금액은 일 통상임금에 일수를 곱해 구합니다. 「근로기준법 시행령」 제6조는 월급 금액으로 정한 임금을 월의 통상임금 산정 기준시간 수로 나눠 시간급을 구하고, 일급은 거기에 1일 소정근로시간을 곱하도록 정해요. 고용노동부 빠른인터넷상담은 주 40시간, 하루 8시간, 주 5일 근로자의 월급을 209시간으로 나눠 시간급 통상임금을 구하라고 안내하고, 2026년 최저임금 고시의 월 환산액 215만 6,880원도 시간급 1만 320원에 209시간을 곱한 값이에요. 이 글도 209시간을 씁니다. 월 300만 원이면 시간급 약 14,354원, 하루 8시간 일 통상임금은 114,833원이에요.<\/p>\n<p style=\"color:#3b1d0f;\">기준 사람이 2025년에 생긴 연차 중 5일을 쓰지 못했다고 가정하면 수당은 114,833 × 5 = 574,165원이고, 3/12인 143,541원이 산입됩니다. 3개월 임금 1,110만 원, 상여금 가산 150만 원, 연차수당 가산 143,541원을 합친 12,743,541원을 92일로 나누면 1일 평균임금은 138,517원입니다. 퇴직금은 20,788,897원이에요. 상여금만 넣은 20,554,735원보다 234,162원 많고, 기본 18,107,743원보다는 2,681,154원 많습니다.<\/p>\n<figure>\n<img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"같은 사람의 퇴직금이 기본 18,107,743원, 상여금 포함 20,554,735원, 연차수당까지 포함 20,788,897원으로 늘어나는 비교\">\n<figcaption>같은 사람의 퇴직금이 상여금과 연차수당을 넣을 때마다 달라지는 모습<\/figcaption>\n<\/figure>\n<h2>평균임금에서 빼는 기간과 통상임금 하한<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"평균임금 산정에서 빼는 기간과 통상임금 하한 요약 카드\">\n<p style=\"color:#3b1d0f;\">평균임금을 구할 때 모든 날이 3개월에 들어가는 것은 아닙니다. 「근로기준법 시행령」 제2조 제1항은 평균임금 산정기간 중에 아래 기간이 있으면 그 기간과 그 기간에 지급된 임금을 분모와 분자에서 각각 빼도록 정하고 있어요.<\/p>\n<ul style=\"color:#3b1d0f;line-height:1.7;\">\n  <li style=\"color:#3b1d0f;\">수습을 시작한 날부터 3개월 이내의 기간<\/li>\n  <li style=\"color:#3b1d0f;\">사용자의 귀책사유로 휴업한 기간(법 제46조)<\/li>\n  <li style=\"color:#3b1d0f;\">출산전후휴가 및 유산·사산 휴가 기간<\/li>\n  <li style=\"color:#3b1d0f;\">업무상 부상 또는 질병으로 요양하기 위해 휴업한 기간<\/li>\n  <li style=\"color:#3b1d0f;\">육아휴직 기간<\/li>\n  <li style=\"color:#3b1d0f;\">노동조합 쟁의행위 기간<\/li>\n  <li style=\"color:#3b1d0f;\">병역·예비군·민방위 의무를 이행하느라 휴직하거나 일하지 못한 기간(그 기간에 임금을 받았다면 제외)<\/li>\n  <li style=\"color:#3b1d0f;\">업무 외 부상이나 질병, 그 밖의 사유로 사용자의 승인을 받아 휴업한 기간<\/li>\n<\/ul>\n<p style=\"color:#3b1d0f;\">같은 조 제2항은 임시로 지급된 임금과 수당, 통화 외의 것으로 지급된 임금을 총액에 넣지 않는다고 정하되, 고용노동부 장관이 정하는 것은 예외로 둡니다. 고용노동부 계산 페이지에는 입력칸이 두 종류 있어요. 미산입기간은 육아휴직처럼 평균임금 산정기간에서 빼는 기간이고, 근무제외기간은 개인휴직 등으로 근속기간에서 빼는 기간입니다. 두 칸을 헷갈려 한쪽에만 넣으면 결과가 어긋납니다.<\/p>\n<p style=\"color:#3b1d0f;\">계산 페이지 하단에는 1일 통상임금이 1일 평균임금보다 크면 통상임금을 기준으로 퇴직금을 계산한다는 문구가 있습니다. 근로기준법 제2조 제2항을 옮긴 것이고, 1350 상담 답변은 통상임금의 기준일이 퇴직일이라고 덧붙여요. 월급제 근로자의 1일 통상임금은 시행령 제6조에 따라 월급을 월 통상임금 산정 기준시간 수로 나눈 시간급에 1일 소정근로시간을 곱해 구합니다. 209시간으로 나누는 방식은 앞 장에서 설명한 고용노동부 안내를 그대로 따릅니다.<\/p>\n<p style=\"color:#3b1d0f;\">기준 사람의 월 통상임금을 기본급 300만 원으로 보면 시간급은 약 14,354원, 1일 통상임금은 114,833원입니다. 평균임금 120,652원이 더 크므로 이 사람은 평균임금으로 계산합니다. 연장근로수당은 소정근로의 대가가 아니라서 통상임금에 넣지 않는 것으로 두었고, 평균임금에는 근로의 대가로 받은 임금이 모두 들어가기 때문이에요. 정기 상여금을 통상임금에 넣어 월 350만 원으로 보더라도 1일 통상임금은 133,971원이라, 상여금과 연차수당을 넣은 평균임금 138,517원이 여전히 큽니다. 통상임금에 무엇이 들어가는지는 별도 판단이 필요해서, 이 글은 기본급만으로 본 값과 상여금까지 넣은 값 두 가지만 비교했어요.<\/p>\n<p style=\"color:#3b1d0f;\">반대 경우를 보겠습니다. 같은 사람이 연장근로수당도 상여금도 없이 월 300만 원만 받았다면 3개월 임금 총액은 900만 원이고 1일 평균임금은 97,826원입니다. 1일 통상임금 114,833원이 더 커서 이 경우 고용노동부 안내대로면 통상임금으로 계산해요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\">\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #e3c2a8;\">\n  <thead><tr><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">월 300만 원만 받은 경우<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">1일 금액<\/th><th style=\"border:1px solid #e3c2a8;padding:10px;background:#6b2d14;color:#ffffff;\">퇴직금(재직 1,826일)<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">평균임금 (900만 ÷ 92일)<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">97,826원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">14,681,954원<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">통상임금 (300만 ÷ 209시간 × 8시간)<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">114,833원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">17,234,388원<\/td><\/tr>\n    <tr><th style=\"border:1px solid #e3c2a8;padding:10px;text-align:left;background:#fdeee3;color:#3b1d0f;\">적용되는 쪽 (큰 금액)<\/th><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">114,833원<\/td><td style=\"border:1px solid #e3c2a8;padding:10px;color:#3b1d0f;\">17,234,388원<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<\/div>\n<p style=\"color:#3b1d0f;\">두 값은 2,552,434원 차이가 납니다. 회사가 평균임금만으로 14,681,954원을 줬다면 이 비교가 빠졌는지 물어볼 수 있어요. 다만 통상임금 산정 기준시간이 209시간이 아닌 근무 형태이거나 취업규칙이 따로 정한 경우에는 금액이 달라지므로, 분쟁이 되면 노동청이나 법원이 사실관계를 보고 판단합니다.<\/p>\n<h2>내 계산과 다를 때 무엇부터 확인하나요?<\/h2>\n<img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"계산이 다를 때 확인 순서와 지급 기한 요약 카드\">\n<p style=\"color:#3b1d0f;\">회사가 알려 준 금액이 내 계산과 다르면 아래 순서로 따져 보면 원인을 빨리 좁힐 수 있습니다.<\/p>\n<ol style=\"color:#3b1d0f;line-height:1.7;\">\n  <li style=\"color:#3b1d0f;\">재직일수를 입사일부터 마지막 근무일까지 달력으로 세어 봅니다. 계약직 갱신처럼 중간에 끊겼다면 계속근로로 이어졌는지 따로 봅니다.<\/li>\n  <li style=\"color:#3b1d0f;\">퇴직 직전 3개월의 세전 임금 총액을 급여명세서에서 달마다 적습니다. 기본급과 수당을 모두 넣고, 식대나 연장근로수당처럼 정기적으로 받은 항목이 빠지지 않았는지 봅니다.<\/li>\n  <li style=\"color:#3b1d0f;\">취업규칙이나 근로계약서에서 상여금 지급 조건을 찾아 연간 총액을 정하고, 퇴직 전전년도 출근율로 퇴직 전년도에 생긴 미사용 연차가 있었는지 확인합니다.<\/li>\n  <li style=\"color:#3b1d0f;\">시행령 제2조의 제외 기간(육아휴직, 출산전후휴가, 수습 3개월 등)이 마지막 3개월에 있었는지 보고, 고용노동부 퇴직금 계산 페이지에서 같은 숫자로 다시 계산합니다.<\/li>\n<\/ol>\n<p style=\"color:#3b1d0f;\">지급 요건부터 맞는지도 봅니다. 「근로자퇴직급여 보장법」 제4조 제1항은 계속근로기간이 1년 미만인 근로자와, 4주간을 평균해 1주 소정근로시간이 15시간 미만인 근로자를 퇴직급여제도 설정 대상에서 뺍니다. 두 조건을 모두 넘어야 법정 퇴직금이 발생합니다.<\/p>\n<p style=\"color:#3b1d0f;\">기한은 제9조 제1항에 있습니다. 사용자는 지급 사유가 발생한 날부터 14일 이내에 퇴직금을 지급해야 하고, 특별한 사정이 있으면 당사자 합의로 연장할 수 있어요. 제9조 제2항은 퇴직금을 근로자가 지정한 개인형퇴직연금제도(IRP) 계정 등으로 이전해서 지급하는 것을 원칙으로 둡니다. 55세 이후 퇴직 같은 대통령령 사유는 예외이고, 계정을 지정하지 않으면 근로자 명의 IRP 계정으로 이전해요. 내가 받을 방식이 IRP 이전인지 현금 지급인지 회사에 물어보는 편이 좋습니다.<\/p>\n<p style=\"color:#3b1d0f;\">기한을 넘기면 「근로기준법」 제37조에 따라 지급 사유 발생 14일이 되는 날의 다음 날부터 지연이자가 붙습니다. 법은 연 40% 이내에서 대통령령으로 이율을 정하게 하고, 열람한 「근로기준법 시행령」 제17조(2025년 10월 23일 시행본)는 연 20%예요. 기준 사람의 퇴직금 18,107,743원이 기한보다 30일 늦으면 18,107,743 × 20% × 30 ÷ 365로 약 297,662원입니다. 시행령 제18조는 임금채권보장법상 사유, 법령상 제약으로 자금을 확보하기 어려운 경우, 지급할 금액의 존부를 법원이나 노동위원회에서 다투는 것이 적절하다고 인정되는 경우 등을 적용 제외 사유로 정합니다. 이 경우 이자가 붙지 않을 수 있어요.<\/p>\n<p style=\"color:#3b1d0f;\">퇴직금을 받을 권리는 제10조에 따라 3년간 행사하지 않으면 시효로 소멸합니다. 회사와 이야기해도 풀리지 않으면 고용노동부 노동포털의 민원서식 목록에 「진정서(임금체불, 직장내 괴롭힘, 기타 노동법 위반)」가 있고, 처리기간은 25일로 안내되어 있습니다. 상담은 국번 없이 1350입니다.<\/p>\n<div style=\"background:#fdeee3;border:1px solid #e3c2a8;border-radius:14px;padding:16px 18px;margin:20px 0;color:#3b1d0f;\">\n  <h3 style=\"margin:0 0 8px;color:#6b2d14;\">공식 사이트에서 계산과 진정 절차 보기<\/h3>\n  <p style=\"margin:0 0 12px;line-height:1.7;color:#3b1d0f;\">직접 입력해 보려면 고용노동부 계산 페이지를, 지급이 늦어졌다면 노동포털 민원서식을 열어 보세요. 로그인과 본인 인증은 각 사이트 안내를 따릅니다.<\/p>\n  <p style=\"margin:0 0 8px;color:#3b1d0f;\"><a class=\"official-link-btn\" href=\"https://www.moel.go.kr/retirementpayCal.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#b4471a;color:#ffffff;font-weight:700;text-decoration:none;\">고용노동부 퇴직금 계산 페이지 열기 →<\/a><\/p>\n  <p style=\"margin:0 0 8px;color:#3b1d0f;\"><a class=\"official-link-btn\" href=\"https://labor.moel.go.kr/minwonApply/minwonApply.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #b4471a;color:#b4471a;font-weight:700;text-decoration:none;\">노동포털 진정서 신청 서식 열기 →<\/a><\/p>\n  <p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:#3b1d0f;\">제도 문의: 고용노동부 고객상담센터 <strong style=\"color:#3b1d0f;\">1350<\/strong> (유료, 평일 9시~18시)<\/p>\n<\/div>\n<h3>이 글의 숫자 출처와 한계<\/h3>\n<ul style=\"color:#3b1d0f;line-height:1.7;\">\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.moel.go.kr/retirementpayCal.do\">고용노동부, 퇴직금 계산 (계산식, 미산입기간·근무제외기간, 통상임금 비교 안내, 계산 예제)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://1350.moel.go.kr/rtmview.do?id=1000284929\">고용노동부 1350, 퇴직금·상여금·연차수당 평균임금 산입 상담 답변<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/LSW/lsInfoR.do?efYd=20260918&amp;lsiSeq=284455\">국가법령정보센터, 「근로자퇴직급여 보장법」 제4조·제8조·제9조·제10조<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029727793\">국가법령정보센터, 「근로기준법 시행령」 제2조 (평균임금 계산에서 제외되는 기간과 임금)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=000600000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">국가법령정보센터, 「근로기준법 시행령」 제6조 (통상임금)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=001700000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">국가법령정보센터, 「근로기준법 시행령」 제17조 (지연이자 이율)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=001800000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&amp;mode=10\">국가법령정보센터, 「근로기준법 시행령」 제18조 (지연이자 적용제외 사유)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.law.go.kr/lsLinkProc.do?joNo=003700000&amp;lsNm=%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95&amp;mode=10\">국가법령정보센터, 「근로기준법」 제37조 (미지급 임금에 대한 지연이자)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202111190926213291000\">고용노동부, 빠른인터넷상담 (월급제 통상임금 209시간 환산)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://www.minimumwage.go.kr/file/downloadSeq.do?bultnId=4657&amp;fileSeq=1\">최저임금위원회, 2026년 적용 최저임금 고시 (시간급 1만 320원, 월 환산 215만 6,880원)<\/a><\/li>\n  <li style=\"color:#3b1d0f;\"><a style=\"color:#a8431a;\" href=\"https://labor.moel.go.kr/minwonApply/minwonApply.do\">고용노동부 노동포털, 민원서식 (진정서 처리기간)<\/a><\/li>\n<\/ul>\n<p style=\"color:#3b1d0f;\">본문의 사람은 계산을 보여 주려고 정한 가상의 근로자입니다. 실제 퇴직금은 취업규칙, 단체협약, 임금 구성, 근로시간에 따라 달라지고 회사 내규상 더 많이 주는 경우도 있어요. 연차 발생일 구분과 통상임금 산정 기준시간은 회사 규정에 따라 달라질 수 있고, 시행령은 열람한 조문본 기준입니다. 분쟁이 있는 금액은 고용노동부 상담이나 노무 전문가와 확인하세요.<\/p>\n<\/div>\n"}};
const TABS = ["b3"];
for (const id of TABS) {

}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
</html>
