<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f172a; color:#e2e8f0; font-family:'Malgun Gothic',-apple-system,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px; }

  h1.logo { font-size:18px; margin:0; color:#fff; font-weight:700; }

  #editor h3 { font-size:18px; margin:22px 0 8px; }

  #editor ul, #editor ol { padding-left:24px; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:#062b12; padding:10px 20px; border-radius:10px; font-weight:700; display:none; z-index:99; }
  #rawBox { display:none; width:100%; height:220px; margin:12px 0; background:#0b1120; color:#e2e8f0; border:1px solid #334155; border-radius:8px; font-size:12px; }

<body>
<header>
  <div class="bar">
    <h1 class="logo">블로그 검토</h1>

</header>
<div class="wrap">
  <div class="thumb-wrap"><img src="https://kmt9934.github.io/blog-review/thumbnail.png" alt="보일러 외출모드와 완전히 끄기, 난방비는 어느 쪽이 덜 나올까 썸네일"></div>
  <div class="toolbar">
    <button type="button" data-cmd="bold"><b>B</b></button>

  </div>

  <div class="hint">이 영역에서 글을 수정한 뒤 「HTML 복사」를 누르면 Blogger에 붙여넣을 수 있습니다. 자동 발행은 하지 않습니다.</div>
  <textarea id="rawBox" readonly></textarea>
  <div class="hint" id="rawHint" style="display:none;">위 박스를 길게 눌러 전체선택 → 복사하세요</div>

<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const articleHTML = "<h1>보일러 외출모드와 완전히 끄기, 난방비는 어느 쪽이 덜 나올까<\/h1>\n<p>겨울에 집을 비울 때 보일러를 외출모드로 둘지, 아예 끌지 고민되시죠. 답부터 말하면 <strong>항상 이기는 쪽은 없습니다.<\/strong> 얼마나 오래 비우는지, 집의 단열 상태, 바깥 기온에 따라 달라집니다. 다만 제조사들이 공통으로 권하는 것이 하나 있습니다. <strong>한겨울에 보일러 전원을 완전히 끄는 것은 피하라<\/strong>는 것입니다. 이 글에서는 공식 자료를 바탕으로 상황별 선택법과 난방비를 줄이는 기본 습관, 오래 집을 비울 때의 동파 예방 체크리스트를 정리했습니다.<\/p>\n\n<h2>먼저 결론: 외출 시간별 선택표<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig1.png\" alt=\"보일러 외출 시간별 선택표\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>아래 표는 제조사 설명서와 공식 안내를 바탕으로 정리한 <strong>일반적인 기준<\/strong>입니다. 집마다 단열 상태와 보일러 모델이 다르니 참고용으로 보세요.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">상황<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">권장 방법<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">이유<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">잠깐 외출(장보기, 몇 시간)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">끄지 말고 설정 온도를 조금 낮추기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">끄면 실내 온도가 떨어져 돌아와서 다시 데우는 데 난방비가 더 들 수 있음<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">출근 등 하루 대부분 비움<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">설정 온도 낮추기 또는 예약 기능. 단열·바깥 기온에 따라 외출모드도 선택지<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">집이 얼마나 빨리 식는지에 따라 유리한 쪽이 달라짐<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">여행·명절 등 며칠 비움<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">외출모드 + 전원·가스밸브·분배기 밸브 열어두기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">외출모드는 집을 비울 때 보일러를 최소로 돌리는 기능. 동결 방지 기능도 유지됨<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">전원 완전히 끄기<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">겨울에는 권장하지 않음(난방이 필요 없는 계절에만)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">전원이 끊기면 동결 방지 기능이 작동하지 않음<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>참고로 공식 자료에서 \"외출모드가 끄기보다 몇 % 싸다\"처럼 수치로 비교한 내용은 찾을 수 없었습니다. 그래서 이 글에서도 수치를 단정하지 않고 판단 기준만 정리했습니다.<\/p>\n\n<h2>외출모드는 원래 어떤 기능일까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig2.png\" alt=\"보일러 외출모드의 의미\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>이름 때문에 \"나갈 때마다 누르는 버튼\"으로 생각하기 쉽지만, 제조사 설명서를 보면 <strong>최소한으로 가동하는 기능<\/strong>에 가깝습니다.<\/p>\n<ul>\n<li><strong>린나이<\/strong> 실내온도조절기 설명서는 외출 기능을 \"외출할 경우 보일러를 최소로 작동시켜 실내를 보온하는 기능\"이라고 설명하고, 해당 모델은 <strong>4시간 간격으로 최소 난방을 반복<\/strong>한다고 안내합니다. 또 \"일정 시간 동안 집을 비울 때 사용하면 가스비를 절약할 수 있다\"고 적혀 있습니다.<\/li>\n<li><strong>경동나비엔<\/strong> 실내온도조절기 안내(해당 모델 기준)는 외출 기능을 \"난방을 하지 않고 온수만 사용하는 여름철이나, 집에 사람이 없는 경우\" 쓰면 편리한 기능으로 소개합니다.<\/li>\n<\/ul>\n<p>이처럼 <strong>외출모드가 실제로 어떻게 작동하는지는 제조사와 모델마다 다릅니다.<\/strong> 우리 집 보일러의 외출모드가 어떤 방식인지 온도조절기 모델명으로 사용설명서를 먼저 확인해 보세요.<\/p>\n\n<h2>왜 겨울에 '완전히 끄기'는 권장되지 않을까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig3.png\" alt=\"보일러 전원을 끄면 동결 방지 기능도 멈춤\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>가장 큰 이유는 <strong>동파<\/strong>입니다. 보일러에는 동결 방지 기능이 있는데, <strong>전원이 연결돼 있어야<\/strong> 작동합니다.<\/p>\n<ul>\n<li>귀뚜라미는 자사 보일러에 난방수 온도가 8℃ 이하로 떨어지면 순환펌프를 돌리고, 5℃ 이하에서는 자동으로 난방을 가동하는 2단계 동결 방지 기능이 있다고 설명합니다. 이 기능은 <strong>전원이 끊기면 작동하지 않기 때문에<\/strong> 한파 때는 전원을 계속 연결하고 가스 밸브와 분배기 밸브를 열어두라고 안내합니다.<\/li>\n<li>같은 안내에서 귀뚜라미는 외출할 때 보일러를 완전히 끄기보다 <strong>실내 설정 온도를 낮춰 쓰는 편이 낫다<\/strong>고 권합니다. 끄고 오래 나가 있으면 실내 온도가 급격히 떨어져 동파 위험이 커지고, 돌아와서 다시 켤 때 오히려 난방비 부담이 늘 수 있다는 설명입니다.<\/li>\n<li>린나이도 동결 방지 기능은 전원이 연결되어야 작동한다며, 전원 코드가 콘센트에 꽂혀 있는지 꼭 확인하라고 안내합니다.<\/li>\n<\/ul>\n<p>즉 \"끄면 무조건 절약\"이라고 생각하기 쉽지만, 겨울에는 동파 수리비와 다시 데우는 비용까지 생각해야 합니다.<\/p>\n\n<h2>어느 쪽이 덜 나올지 결정하는 4가지<\/h2>\n<p>외출모드로 둘지, 설정 온도를 낮춰 유지할지는 아래 조건에 따라 달라집니다.<\/p>\n<ol>\n<li><strong>비우는 시간:<\/strong> 짧을수록 온도를 낮춰 유지하는 편이, 길수록 외출모드가 유리한 경향이 있습니다.<\/li>\n<li><strong>단열·외풍:<\/strong> 단열이 약하고 외풍이 심한 집은 빨리 식어서 돌아와 다시 데우는 부담이 커질 수 있습니다.<\/li>\n<li><strong>바깥 기온:<\/strong> 한파일수록 집이 빨리 식고 동파 위험도 커집니다.<\/li>\n<li><strong>보일러 모델:<\/strong> 외출모드가 몇 시간 간격으로 잠깐씩 난방하는지, 동결 방지 때만 가동하는지 모델마다 다릅니다.<\/li>\n<\/ol>\n<p>정책브리핑의 난방비 절약 안내에도 \"외출 시 보일러 외출모드로 전환하기\"가 들어 있습니다. 제조사 안내와 함께 보면 공통 원칙은 <strong>겨울에 전원을 끄지 않는 것<\/strong>이고, 외출모드와 온도 낮추기 중에서는 비우는 시간과 집 상태를 보고 고르면 됩니다.<\/p>\n\n<h2>난방비를 줄이는 기본 습관<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig4.png\" alt=\"겨울철 적정 실내온도와 습도\" style=\"width:100%;border-radius:12px;\"><\/p>\n<h3>적정 실내 온도와 습도<\/h3>\n<ul>\n<li>정부 정책브리핑은 겨울철 실내 적정 온도를 <strong>18~20℃<\/strong>, 적정 습도를 <strong>40~60%<\/strong>로 안내합니다. 귀뚜라미는 18~21℃를 권장합니다.<\/li>\n<li>정책브리핑 안내에 따르면 보일러 설정 온도를 1℃ 낮추면 난방 에너지를 <strong>최대 7%<\/strong> 아낄 수 있습니다.<\/li>\n<li>내복을 입으면 체감 온도가 약 3도 올라가는 효과가 있다고 합니다. 수면양말이나 무릎담요도 도움이 됩니다.<\/li>\n<\/ul>\n<h3>외풍 막기와 생활 습관<\/h3>\n<ul>\n<li>에어캡(뽁뽁이)이나 문풍지를 창문에 붙이면 열 손실을 줄일 수 있고, 커튼과 러그는 실내와 바닥 온기를 지키는 데 도움이 됩니다.<\/li>\n<li>평소에는 수도꼭지 레버를 냉수 쪽으로 돌려 두세요(정책브리핑 절약 안내).<\/li>\n<li>보일러 난방 밸브를 조정하고 보일러를 꾸준히 청소하는 것도 정책브리핑이 안내하는 절약 방법입니다.<\/li>\n<\/ul>\n<h3>보일러 예약 기능 사용법<\/h3>\n<p>예약 기능은 정해 둔 시간 간격마다 잠깐씩 난방을 반복하는 기능입니다. 린나이 설명서 기준으로는 예약 버튼을 눌러 원하는 간격을 고르면 그 간격마다 난방이 작동하고, 한 번 더 누르면 해제됩니다. 설명서는 이 기능이 <strong>봄·가을처럼 가끔 난방이 필요할 때나 잠들기 전<\/strong>에 편리하다고 안내합니다. 버튼 이름과 설정 범위는 모델마다 다르니 온도조절기 설명서를 확인하세요.<\/p>\n<h3>전기장판 전기세, 이렇게 계산해 보세요<\/h3>\n<p>보일러 온도를 낮추고 전기장판 같은 개인 난방기구를 함께 쓰는 집도 많습니다. 전기요금은 다음 순서로 대략 계산할 수 있습니다.<\/p>\n<ol>\n<li>제품 라벨이나 설명서에서 <strong>소비전력(W)<\/strong>을 확인합니다.<\/li>\n<li>소비전력 × 하루 사용 시간 ÷ 1,000 = 하루 사용 전력량(kWh)입니다. 예를 들어 소비전력이 100W인 제품을 8시간 쓰면 0.8kWh입니다(설명을 위한 가정).<\/li>\n<li>한 달 사용량을 한국전력 전기요금 계산기에 넣어 보세요. 주택용 전기요금은 사용량 구간에 따라 단가가 달라서, 집 전체 사용량과 합쳐서 봐야 정확합니다.<\/li>\n<\/ol>\n<p>정책브리핑은 난방기구를 고를 때 쓰는 전기에 비해 발열량이 높은 제품을 고르라고 안내합니다. 사용할 때는 제품 설명서의 안전 수칙을 꼭 지키세요.<\/p>\n\n<h2>며칠 집을 비울 때 동파 예방 체크리스트<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig5.png\" alt=\"장기간 외출 전 보일러 동파 예방 체크리스트\" style=\"width:100%;border-radius:12px;\"><\/p>\n<ul>\n<li>[ ] 보일러 전원 코드가 콘센트에 꽂혀 있나요?<\/li>\n<li>[ ] 가스 밸브와 각 방 분배기 밸브를 열어 두었나요?<\/li>\n<li>[ ] 보일러를 끄지 않고 외출모드로 설정했나요?<\/li>\n<li>[ ] 밖으로 드러난 배관(직수·난방·온수·응축수)을 보온재로 감쌌나요? 낡거나 찢어진 보온재는 교체했나요?<\/li>\n<li>[ ] 콘덴싱 보일러라면 응축수 배출 호스가 늘어지거나 꼬이지 않았나요?<\/li>\n<li>[ ] 한파 예보가 있다면 온수 쪽 수도꼭지를 조금 열어 두었나요?<\/li>\n<\/ul>\n<h3>이미 얼었다면<\/h3>\n<ul>\n<li><strong>온수가 안 나올 때:<\/strong> 직수·온수 배관이 얼었을 수 있습니다. 보온재를 벗기고 수건을 감싼 뒤 미지근한 물부터 시작해 따뜻한 물(귀뚜라미 안내 기준 50~60℃)로 천천히 녹이세요. 갑자기 뜨거운 물을 부으면 배관이 깨질 수 있습니다.<\/li>\n<li><strong>난방을 해도 바닥이 차가울 때:<\/strong> 보일러 내부나 난방 배관 문제일 수 있어 직접 고치기 어렵습니다. 제조사 고객센터나 전문 업체에 도움을 요청하세요.<\/li>\n<\/ul>\n\n<h2>난방비가 부담된다면 확인할 지원 제도<\/h2>\n<ul>\n<li><strong>에너지바우처:<\/strong> 기초생활보장 수급 가구 중 노인·영유아·한부모가족 등 조건을 충족하면 신청할 수 있습니다. 2026년 신청 기간은 12월 31일까지이고, 동절기 사용은 2026년 10월부터 2027년 5월 31일까지입니다(한국에너지공단 안내).<\/li>\n<li><strong>도시가스 요금 경감:<\/strong> 장애인, 국가유공자, 기초생활수급자, 차상위계층, 다자녀가구 등이 대상이며 주소지 도시가스사, 행정복지센터, 정부24·복지로에서 신청할 수 있습니다.<\/li>\n<li><strong>도시가스 절약 캐시백:<\/strong> 전년 같은 기간보다 도시가스를 일정 비율 이상 아끼면 현금으로 돌려받는 제도입니다. 이번 겨울 일정은 k-가스캐시백 누리집 공지를 확인하세요.<\/li>\n<\/ul>\n\n<h2>마무리<\/h2>\n<p>정리하면 <strong>짧게 나갈 때는 끄지 말고 온도만 조금 낮추고, 며칠 비울 때는 외출모드로 두고, 겨울에 전원을 완전히 끄는 것은 피하는 것<\/strong>이 기본입니다. 어느 쪽이 더 절약되는지는 집의 단열과 바깥 기온, 보일러 모델에 따라 다르니 오늘 우리 집 온도조절기 모델명을 확인하고 설명서의 외출·예약 기능부터 살펴보세요.<\/p>\n\n<h2>참고한 공식자료<\/h2>\n<ul>\n<li>대한민국 정책브리핑, <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148924892\" target=\"_blank\" rel=\"noopener\">겨울철 난방비 절약팁은?(행정안전부, 2024.1.18)<\/a><\/li>\n<li>대한민국 정책브리핑, <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148937437\" target=\"_blank\" rel=\"noopener\">나에게 맞는 난방비 절약 방법(법제처, 2024.12.16)<\/a><\/li>\n<li>귀뚜라미 홍보센터, <a href=\"https://krb.co.kr/pr/26579\" target=\"_blank\" rel=\"noopener\">한파특보 \"보일러 동결 예방과 난방비 관리 동시에 챙기세요\"(2026.1.21)<\/a><\/li>\n<li>린나이, <a href=\"http://rhpa2.rinnai.co.kr/upload/explain/1576052869526_20191211172802493.pdf\" target=\"_blank\" rel=\"noopener\">실내온도조절기 사용설명서(외출·예약 기능)<\/a><\/li>\n<li>린나이, <a href=\"http://m.rinnai.co.kr/qr/rbmc35/prevent.asp\" target=\"_blank\" rel=\"noopener\">RBMC-35 간편사용설명서: 동결 예방·조치 방법<\/a><\/li>\n<li>경동나비엔, <a href=\"http://2016.kdnavien.co.kr/product/indoor_boiler13_popup\" target=\"_blank\" rel=\"noopener\">실내온도조절기 동영상 매뉴얼(외출 설정/해제)<\/a><\/li>\n<li>한국에너지공단 에너지바우처, <a href=\"https://www.energyv.or.kr/\" target=\"_blank\" rel=\"noopener\">2026년도 에너지바우처 안내<\/a><\/li>\n<li>정부24 보조금24, <a href=\"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/B55121000003\" target=\"_blank\" rel=\"noopener\">사회적 배려대상자 도시가스요금 경감<\/a><\/li>\n<li>도시가스 캐시백, <a href=\"https://k-gascashback.or.kr/ko/intro/about\" target=\"_blank\" rel=\"noopener\">제도 소개<\/a><\/li>\n<\/ul>";
editor.innerHTML = articleHTML;

function legacyCopy(text) {
  let ok = false;
  const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}

copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  } else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({ block: 'center' });
    alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
