const POSTS = {"b3": {"title": "2027 최저임금 월급 계산: 주휴수당 포함", "html": "<h1>2027 최저임금 월급 계산: 주휴수당 포함<\/h1>\n<p>2027년 1월 1일부터 시간급 최저임금은 10,700원입니다. 올해 10,320원보다 380원(3.7%) 오른 금액이고, 주 40시간 일하는 사람의 월 환산액은 2,236,300원이에요. 그런데 아르바이트로 주 20시간, 주 14시간처럼 일하는 사람에게는 이 숫자가 그대로 맞지 않습니다. 주휴수당이 붙는지, 몇 시간분이 붙는지에 따라 한 달 금액이 크게 달라지기 때문이에요.<\/p>\n<p>이 글은 일하는 형태를 다섯 가지 상황으로 나눠, 각 상황에서 2027년 최저임금으로 한 달에 최소 얼마를 받아야 하는지 계산합니다. 금액은 <a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19744\" style=\"color:#174ea6;\">고용노동부 2027년도 적용 최저임금 보도자료<\/a>와 <a href=\"https://www.moel.go.kr/info/lawinfo/instruction/view.do?bbs_seq=20260800150\" style=\"color:#174ea6;\">고용노동부 고시 제2026-60호<\/a>를 기준으로 했고, 주휴수당 계산식은 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&cciNo=2&cnpClsNo=1&csmSeq=1347&popMenu=ov\" style=\"color:#174ea6;\">찾기쉬운 생활법령정보 단시간근로자 보호<\/a>와 <a href=\"https://1350.moel.go.kr/home/hp/data/faqView.do?faq_idx=1000000822\" style=\"color:#174ea6;\">고용노동부 1350 상담센터 답변<\/a>에 나온 식을 그대로 썼습니다. 2026년 10월 28일 기준 내용이에요.<\/p>\n<h2>주 40시간 풀타임이라면 월 2,236,300원<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"주 40시간 근무 시 2027년 최저임금 월급 요약 카드\"><\/p>\n<p>하루 8시간, 주 5일 일하는 풀타임 근로자는 계산이 가장 단순합니다. 고시문에 적힌 월 환산 기준시간 209시간에 시간급 10,700원을 곱하면 끝이에요. 209시간이라는 숫자는 실제로 일한 160시간 남짓에 유급 주휴시간이 더해진 값입니다.<\/p>\n<p><a href=\"https://labor.moel.go.kr/minwonSysInfo/minwagesys.do\" style=\"color:#174ea6;\">고용노동부 노동포털 최저임금 제도 안내<\/a>는 이 기준시간을 (1주 소정근로 40시간 + 유급주휴 8시간) × 365일 ÷ 7일 ÷ 12개월로 계산합니다. 1년 52.14주를 12로 나누면 한 달이 평균 약 4.345주이고, 여기에 주 48시간을 곱하면 약 208.6시간이 나와 고시에서는 209시간으로 씁니다.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">주 40시간 근로자의 2027년 최저 월급<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">주 소정근로 40시간 + 유급주휴 8시간 = 주 48시간<\/li><li style=\"color:#1c2f52;\">48시간 × 365 ÷ 7 ÷ 12 = 약 209시간(고시 기준)<\/li><li style=\"color:#1c2f52;\">209시간 × 10,700원 = <strong style=\"color:#1c2f52;\">2,236,300원<\/strong><\/li><li style=\"color:#1c2f52;\">2026년 2,156,880원과 비교하면 한 달 79,420원 차이<\/li><\/ol><\/div>\n<p>여기서 주의할 숫자는 세전 금액이라는 점이에요. 2,236,300원은 최저임금 판단에 쓰는 임금 총액이고, 실제 통장에 들어오는 돈은 국민연금·건강보험·고용보험료와 소득세가 빠진 금액입니다. 그래서 급여명세서의 실수령액이 223만 원보다 적다고 해서 바로 최저임금 위반이 되는 건 아니에요. 비교는 공제 전 지급총액으로 합니다.<\/p>\n<p>하루 7시간, 주 35시간으로 계약한 경우도 같은 방식으로 풀 수 있어요. 주휴시간이 7시간이 되어 (35 + 7) × 365 ÷ 7 ÷ 12 = 182.5시간이고, 10,700원을 곱하면 월 1,952,750원입니다. 고용노동부 온라인 상담 답변에서도 주 35시간 근로자의 월 환산 기준시간을 182.5시간으로 계산하고 있어요.<\/p>\n<h2>주 15~39시간 아르바이트라면 주휴수당부터 비례 계산<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"단시간 근로자 주휴수당 비례 계산 요약 카드\"><\/p>\n<p>통상 근로자보다 짧게 일하는 단시간 근로자도 4주 평균 1주 소정근로시간이 15시간 이상이고 그 주에 정해진 날을 모두 출근했다면 주휴수당을 받습니다. 다만 8시간분이 아니라 일한 시간에 비례한 만큼이에요. 생활법령정보에 나온 식은 <strong>4주 동안의 소정근로시간 ÷ 4주 동안 통상 근로자의 총 소정근로일수 × 시간급<\/strong>입니다.<\/p>\n<p>통상 근로자가 주 5일 40시간 일하는 사업장이라면 식을 더 줄일 수 있어요. 주휴시간 = 1주 소정근로시간 ÷ 40 × 8입니다. 주 20시간이면 4시간, 주 15시간이면 3시간, 주 30시간이면 6시간이 주휴시간이 됩니다. 고용노동부 상담 답변도 월·수 8시간, 금 4시간으로 주 20시간 일하는 사람의 하루 유급휴일 시간을 80시간 ÷ 20일 = 4시간으로 계산했어요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">주 소정근로<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">주휴시간<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">한 주 주휴수당<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">월 환산 시간<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">2027년 최저 월급<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">40시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">8시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">85,600원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">209시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,236,300원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">35시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">7시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">74,900원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">182.5시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,952,750원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">30시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">6시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">64,200원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 156.4시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 1,673,790원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">20시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">4시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">42,800원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 104.3시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 1,115,860원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">15시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">3시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">32,100원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 78.2시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 836,890원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">14시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">없음<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">0원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 60.8시간<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 650,920원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>표의 월 환산 시간은 (주 소정근로 + 주휴시간) × 365 ÷ 7 ÷ 12로 계산했고, 금액은 원 단위에서 반올림했습니다. 실제 급여는 그 달 주 수(4주 또는 5주)에 따라 몇 만 원씩 오르내릴 수 있어요. 예를 들어 주 20시간 아르바이트가 그 달 4주를 개근했다면 근무 80시간 × 10,700원 = 856,000원에 주휴수당 4주 × 42,800원 = 171,200원을 더해 1,027,200원이고, 5주가 들어 있는 달이면 1,284,000원이 됩니다.<\/p>\n<p>여기서 자주 틀리는 부분은 연장근로예요. 계약은 주 20시간인데 손님이 많아 매주 25시간을 일했다고 해서 주휴시간이 5시간으로 늘지는 않습니다. 고용노동부 상담 답변은 주휴수당을 실제 근로시간이 아니라 근로계약서에 약정한 소정근로시간으로 계산한다고 설명해요. 늘어난 시간은 시급으로 따로 받고, 상시 5명 이상 사업장이라면 연장 가산수당이 붙습니다.<\/p>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"주 소정근로시간 40, 35, 20, 15, 14시간일 때 2027년 최저 월급 막대 비교\"><figcaption>주 15시간을 넘는지에 따라 주휴수당이 붙고 안 붙고가 갈립니다.<\/figcaption><\/figure>\n<h2>주 15시간 미만이면 빠지는 것들<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"주 15시간 미만 초단시간 근로자 적용 제외 요약 카드\"><\/p>\n<p>근로기준법 제18조 제3항은 4주 동안을 평균해 1주 소정근로시간이 15시간 미만인 근로자에게 주휴일(제55조)과 연차유급휴가(제60조)를 적용하지 않는다고 정해 두었습니다. 이런 근로자를 흔히 초단시간 근로자라고 불러요. 그래서 주 14시간 계약이면 시간당 10,700원은 똑같이 받지만 주휴수당은 붙지 않습니다.<\/p>\n<p>주 15시간과 14시간의 차이를 한 달로 바꿔 보면 꽤 큽니다. 주 15시간은 주휴 3시간이 붙어 월 약 836,890원, 주 14시간은 월 약 650,920원이에요. 일하는 시간은 주 1시간 차이인데 월 금액은 약 185,970원 차이가 납니다. 한 시간 차이가 주휴수당 유무를 가르기 때문이에요.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">주 15시간과 14시간, 한 달 비교<\/h3><ul style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">주 15시간: (15 + 3) × 365 ÷ 7 ÷ 12 = 약 78.2시간 → 약 836,890원<\/li><li style=\"color:#1c2f52;\">주 14시간: 14 × 365 ÷ 7 ÷ 12 = 약 60.8시간 → 약 650,920원<\/li><li style=\"color:#1c2f52;\">차이: 약 185,970원(근무시간 차이는 주 1시간)<\/li><\/ul><\/div>\n<p>판단 기준은 한 주가 아니라 4주 평균이라는 점도 기억해 두면 좋아요. 어떤 주는 12시간, 어떤 주는 18시간처럼 들쭉날쭉하게 계약했다면 4주 합계를 4로 나눈 값이 15시간 이상인지 봅니다. 계약서에 요일별 시간을 적어 두면 나중에 다툴 일이 줄어듭니다.<\/p>\n<p>최저임금 자체는 초단시간 근로자에게도 그대로 적용됩니다. 노동포털 안내대로 최저임금법은 근로자 1명 이상인 모든 사업장에 적용되고, 정규직이든 아르바이트든 청소년이든 외국인이든 시간당 10,700원보다 적게 정한 계약 부분은 무효가 되어 최저임금액으로 지급한 것으로 봐요. 주휴수당이 빠지는 것과 시급이 깎이는 것은 별개의 문제입니다.<\/p>\n<h2>수습 3개월 동안 90%를 받는 경우와 못 깎는 직종<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"수습 근로자 최저임금 감액 조건 요약 카드\"><\/p>\n<p>입사 초 수습 기간에는 최저임금의 90%만 줘도 되는 경우가 있습니다. 조건은 세 가지가 모두 맞아야 해요. 근로계약 기간이 1년 이상이고, 수습 중이며, 수습을 시작한 날부터 3개월 이내여야 합니다. 이때 2027년 시간급은 10,700원의 90%인 9,630원, 주 40시간 월 환산액은 9,630원 × 209시간 = 2,012,670원이에요.<\/p>\n<p>계약 기간이 1년 미만이면 수습이라는 이름을 붙여도 감액할 수 없습니다. 3개월짜리 단기 아르바이트, 6개월 계약직은 첫날부터 10,700원이에요. 또 근로계약서나 취업규칙에 수습 기간이 정해져 있지 않으면 감액 근거가 없다는 것이 고용노동부 상담 답변의 설명입니다.<\/p>\n<p>직종에 따른 예외도 있어요. 한국표준직업분류 대분류 9에 해당하는 단순노무 종사자는 수습 여부나 계약 기간과 상관없이 최저임금 100%를 받아야 합니다. 2018년 3월 20일 이후 새로 채용된 단순노무 직종부터 적용된 규칙이에요. 내 직종이 대분류 9에 들어가는지는 <a href=\"https://www.moel.go.kr/miniWageMain.do\" style=\"color:#174ea6;\">최저임금 모의계산기<\/a> 안내에 나온 대로 통계청 분류 시스템에서 직종 이름으로 검색해 볼 수 있습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">상황<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">2027년 시간급<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">주 40시간 월 환산<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">1년 이상 계약, 수습 3개월 이내<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">9,630원(90%)<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,012,670원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">1년 이상 계약, 수습 4개월째부터<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">10,700원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,236,300원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">1년 미만 계약(수습 표기 있어도)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">10,700원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,236,300원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">단순노무 직종(대분류 9)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">10,700원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,236,300원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>90% 감액이 가능한 경우라도 3개월이 지나면 바로 100%로 돌아갑니다. 예를 들어 2027년 1월 4일에 1년 계약으로 입사해 수습 3개월을 적용받았다면 4월 3일까지가 감액 가능 기간이고, 그 뒤 근무분부터는 시간당 10,700원으로 계산해야 해요. 수습 기간을 6개월로 늘려 적어도 감액은 3개월까지만 인정됩니다.<\/p>\n<h2>상여금·식대가 있다면 최저임금 미달인지 따져 보는 법<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"상여금과 식대 최저임금 산입 판단 요약 카드\"><\/p>\n<p>기본급만 보면 최저임금보다 낮은데 식대나 매달 나오는 상여금이 있는 경우가 많습니다. 이때는 매달 1회 이상 정기적으로 받는 임금 중 최저임금에 들어가는 항목을 더한 뒤 시간당 금액으로 바꿔 비교해요. 노동포털 표를 보면 정기상여금과 현금 복리후생비의 미산입 비율이 2019년 25%·7%에서 해마다 줄어 2024년부터는 0%가 됐습니다. 즉 매월 현금으로 주는 상여금과 식비·교통비·숙박비는 전부 최저임금에 들어갑니다.<\/p>\n<p>반대로 들어가지 않는 항목도 정해져 있어요. 연장·휴일근로 임금과 연장·야간·휴일 가산수당, 연차 미사용수당, 법정 주휴일을 뺀 유급휴일 임금, 그리고 현물로 주는 식사나 숙소는 산입하지 않습니다. 회사 식당에서 밥을 주는 것은 현물이라 빠지고, 식대 20만 원을 현금으로 급여에 넣어 주는 것은 들어간다는 차이예요.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">주 40시간, 월 209시간 근로자 두 사례<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">사례 1: 기본급 2,000,000원 + 현금 식대 200,000원 = 2,200,000원 ÷ 209시간 = 약 10,526원 → 10,700원 미달<\/li><li style=\"color:#1c2f52;\">사례 2: 기본급 2,050,000원 + 현금 식대 200,000원 = 2,250,000원 ÷ 209시간 = 약 10,766원 → 충족<\/li><li style=\"color:#1c2f52;\">사례 1에서 식대를 회사 식당 현물 식사로 바꾸면 산입액은 2,000,000원 → 약 9,569원으로 더 크게 미달<\/li><\/ol><\/div>\n<p>사례 1과 2의 차이는 기본급 5만 원뿐인데 결과가 갈립니다. 월급제라면 2027년 1월 급여부터 이 계산을 한 번 해 보는 것이 좋아요. 2026년에는 2,200,000원 ÷ 209 = 약 10,526원이 10,320원보다 높아 문제가 없었지만, 같은 월급을 2027년에 그대로 받으면 미달이 됩니다.<\/p>\n<p>1년에 두 번 나오는 명절 상여금처럼 1개월을 넘는 주기로 주는 돈은 그 자체로는 매월 정기 임금이 아니라서 들어가지 않아요. 회사가 이 상여금을 총액은 그대로 두고 12개월로 나눠 매달 주도록 취업규칙을 바꾸는 경우에는 근로자 과반수의 의견을 들으면 된다는 특례가 노동포털에 안내돼 있습니다. 이렇게 바뀌면 그때부터는 최저임금에 들어갑니다.<\/p>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"지급총액에서 미산입 항목을 빼고 월 기준시간으로 나눈 뒤 10,700원과 비교하는 3단계 흐름\"><figcaption>공제 전 금액으로, 연장수당과 현물은 빼고 비교합니다.<\/figcaption><\/figure>\n<h2>모의계산기로 내 월급 넣어 보는 순서<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"고용노동부 최저임금 모의계산기 입력 순서 요약 카드\"><\/p>\n<p>손으로 계산하기 번거롭다면 고용노동부 누리집의 최저임금 모의계산기를 쓰면 됩니다. 2026년 10월 28일 화면 기준으로 입력 단계는 아래와 같아요. 화면에서 기본급에는 소정근로시간에 대한 임금만 넣고, 연장·휴일근로 임금과 가산수당, 연차 미사용수당은 넣지 말라고 안내합니다.<\/p>\n<ol><li>고용노동부 누리집에서 최저임금 모의계산기 화면을 엽니다.<\/li><li>임금 지급 형태(시급·일급·월급)와 기본급을 입력합니다. 기본급에는 소정근로시간 임금만 넣어요.<\/li><li>상여금·장려가급·능률수당·근속수당·정근수당이 매달 나오면 「등록」을 눌러 산정 주기를 고릅니다.<\/li><li>복리후생비 칸에 식비·숙박비·교통비 금액과 현금·현물 여부, 매월 지급 여부를 적습니다.<\/li><li>수습을 시작한 지 3개월 이내인지 고르고 최저임금 위반 여부 확인을 누릅니다.<\/li><\/ol>\n<p>결과 화면은 지급 임금이 최저임금을 넘는지 아닌지를 보여 주지만, 임금체계가 복잡하면 정확하지 않을 수 있다고 함께 적어 둡니다. 계산 결과가 미달로 나오고 회사와 의견이 다르면 사업장 관할 지방고용노동관서에 상담하거나 고객상담센터 1350(평일 09시~18시)에 전화로 물어볼 수 있어요.<\/p>\n<p>사장 입장에서 봐야 할 의무도 있습니다. 노동포털 안내에 따르면 사용자는 최저임금액, 산입하지 않는 임금의 범위, 적용 제외 근로자의 범위를 근로자가 볼 수 있는 곳에 게시해야 하고, 어기면 100만 원 이하의 과태료 대상이에요. 최저임금보다 적게 지급하면 3년 이하의 징역 또는 2천만 원 이하의 벌금에 처할 수 있고 둘을 함께 받을 수도 있습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">미리 준비할 숫자<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">어디서 보나<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">주 소정근로시간·근무 요일<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">근로계약서<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">기본급·매월 수당 항목<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">급여명세서 지급 항목<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">식대가 현금인지 현물인지<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">급여명세서 또는 취업규칙<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">계약 기간·수습 시작일<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">근로계약서<\/td><\/tr><\/tbody><\/table><\/div>\n<div style=\"background:#eef4fb;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">최저임금 계산 공식 페이지<\/h3><p style=\"margin:0 0 12px;line-height:1.7;color:#1c2f52;\">2027년 금액 고시문과 모의계산기를 바로 열 수 있습니다.<\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.moel.go.kr/miniWageMain.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#174ea6;color:#ffffff;font-weight:700;text-decoration:none;\">고용노동부 최저임금 모의계산기 열기 →<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.moel.go.kr/info/lawinfo/instruction/view.do?bbs_seq=20260800150\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">2027년 적용 최저임금 고시 보기 →<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://labor.moel.go.kr/minwonSysInfo/minwagesys.do\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">노동포털 최저임금 제도 안내 →<\/a><\/p><\/div>\n<h3>계산에 쓴 공식 자료<\/h3><ul><li><a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19744\">고용노동부 보도자료: 2027년도 적용 최저임금 시간급 10,700원<\/a><\/li><li><a href=\"https://www.moel.go.kr/info/lawinfo/instruction/view.do?bbs_seq=20260800150\">고용노동부 고시 제2026-60호<\/a><\/li><li><a href=\"https://www.minimumwage.go.kr/\">최저임금위원회<\/a><\/li><li><a href=\"https://labor.moel.go.kr/minwonSysInfo/minwagesys.do\">고용노동부 노동포털 최저임금 제도<\/a><\/li><li><a href=\"https://www.moel.go.kr/miniWageMain.do\">고용노동부 최저임금 모의계산기<\/a><\/li><li><a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&cciNo=2&cnpClsNo=1&csmSeq=1347&popMenu=ov\">찾기쉬운 생활법령정보 단시간근로자의 보호<\/a><\/li><li><a href=\"https://1350.moel.go.kr/home/hp/data/faqView.do?faq_idx=1000000822\">고용노동부 1350 상담센터 주휴수당 지급요건<\/a><\/li><li><a href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202401081620124231000\">고용노동부 온라인 상담 주휴수당 계산<\/a><\/li><\/ul>"}};

  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
