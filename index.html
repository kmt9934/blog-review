<script>
const editor = document.getElementById('editor');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const articleHTML = "<h1>2026~2027 독감 예방접종 무료 대상과 날짜 정리: 어르신 10월 6일부터, 어린이는 14세까지<\/h1>\n<p>올해는 인플루엔자(독감) 유행주의보가 9월 11일에 일찍 발령되면서, 질병관리청이 2026~2027절기 독감 국가예방접종 시작일을 앞당겼습니다. 어린이와 임신부는 <strong>9월 21일부터<\/strong> 이미 접종이 시작됐고, 65세 이상 어르신은 <strong>10월 6일(75세 이상)<\/strong>부터 연령대별로 차례차례 시작됩니다. 어린이 무료 대상도 올해부터 <strong>14세까지<\/strong> 넓어졌습니다. 이 글에서는 질병관리청 보도참고자료, 예방접종도우미, 정책브리핑의 2026~2027절기 안내를 바탕으로 <strong>무료 대상 → 대상별 날짜 → 접종기관 찾기·준비물 → 코로나19 동시접종 → 효과가 생기는 시점<\/strong> 순서로 정리했습니다. (2026년 9월 26일 확인 기준)<\/p>\n<h2>한눈에 보는 2026~2027절기 독감 국가예방접종<\/h2>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">항목<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">2026~2027절기 내용<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">무료 대상<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">생후 6개월~14세 어린이(2012.1.1.~2026.8.31. 출생), 임신부, 65세 이상 어르신(1961.12.31. 이전 출생)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">접종 기간<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2026년 9월 21일(월) ~ 2027년 4월 30일(금), 대상별로 시작일이 다름<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">어르신 시작일<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">75세 이상 10월 6일(화) / 70~74세 10월 12일(월) / 65~69세 10월 15일(목)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">접종 장소<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주소지와 관계없이 전국 위탁의료기관(약 2.3만 개소) 및 보건소<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">백신<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">WHO 권장주가 모두 포함된 불활성화 3가 백신<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">문의<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">관할 보건소, 질병관리청 콜센터 ☎ 1339<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h2>독감 예방접종 무료 대상: 누가 받을 수 있나요<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig1.png\" alt=\"2026~2027 독감 예방접종 무료 대상: 어린이 14세까지, 임신부, 65세 이상\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>2026~2027절기 국가예방접종(무료) 대상은 <strong>어린이, 임신부, 65세 이상 어르신<\/strong> 세 그룹입니다. 이번 절기부터 어린이 대상이 기존 '생후 6개월~13세'에서 <strong>'생후 6개월~14세(중학교 2학년)'<\/strong>로 확대됐습니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">대상<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">출생일 기준<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">확인 기준<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">어린이<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">생후 6개월~14세<br>(2012.1.1.~2026.8.31. 출생)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주민등록상 생년월일과 실제 생년월일이 다르면 <strong>실제 생년월일<\/strong> 기준으로 지원<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">임신부<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">임신 주수 무관<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">산모수첩, 임신확인서 등으로 임신 확인<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">65세 이상 어르신<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">1961.12.31. 이전 출생<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">주민등록상 출생연도 기준<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>무료 대상이 아니라면<\/h3>\n<p>질병관리청 FAQ에 따르면 국가예방접종 대상이 아닌 경우 가까운 인플루엔자 예방접종 시행 의료기관에서 <strong>유료로<\/strong> 접종할 수 있습니다. 또 일부 지자체는 독감 예방접종 비용을 따로 지원하기도 하니, 우리 지역에 그런 사업이 있는지와 내가 해당되는지는 <strong>관할 보건소<\/strong>에 문의해 보세요. 참고로 올해는 새 백신주 생산 과정에서 국내 전체 생산·수입 물량이 줄어, 질병관리청이 민간 접종용 물량을 추가 확보했지만 <strong>민간 공급 여건이 예년보다 여유롭지 않다<\/strong>고 안내했습니다. 유료 접종을 계획한다면 방문 전에 접종 가능 여부를 먼저 확인하는 편이 좋습니다.<\/p>\n<h2>독감 예방접종 시기 2026: 대상별 접종 날짜<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig2.png\" alt=\"2026 독감 예방접종 시기: 어린이·임신부 9월 21일, 어르신 10월 6일부터 연령별\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>질병관리청은 8월 25일 처음 일정을 발표한 뒤, 이른 유행에 대응해 <strong>9월 16일 시작일을 앞당겼습니다.<\/strong> 아래 표는 조정된 최종 일정입니다. 종료일은 모든 대상이 <strong>2027년 4월 30일<\/strong>로 같습니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">접종 대상<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">처음 발표(8.25)<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">변경된 시작일(9.16)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">어린이 2회 접종 대상<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">9월 21일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>9월 21일(월)<\/strong> (변동 없음)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">어린이 1회 접종 대상<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">9월 28일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>9월 21일(월)<\/strong><\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">임신부<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">9월 21일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>9월 21일(월)<\/strong> (변동 없음)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">75세 이상 (1951.12.31. 이전 출생)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 12일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>10월 6일(화)<\/strong><\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">70~74세 (1952.1.1.~1956.12.31. 출생)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 15일(목)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>10월 12일(월)<\/strong><\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">65~69세 (1957.1.1.~1961.12.31. 출생)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 19일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\"><strong>10월 15일(목)<\/strong><\/td><\/tr>\n<\/tbody>\n<\/table>\n<h3>어르신 독감 무료접종 언제부터?<\/h3>\n<ul>\n<li><strong>75세 이상:<\/strong> 2026년 10월 6일(화)부터<\/li>\n<li><strong>70~74세:<\/strong> 10월 12일(월)부터<\/li>\n<li><strong>65~69세:<\/strong> 10월 15일(목)부터<\/li>\n<li><strong>면역저하자 등 고위험군:<\/strong> 연령별 일정과 관계없이 10월 6일(화)부터 <strong>의료진과 상담 후<\/strong> 접종할 수 있습니다.<\/li>\n<li><strong>요양병원·요양시설:<\/strong> 집단감염에 취약한 점을 고려해 백신이 공급되는 대로 접종을 시작합니다.<\/li>\n<\/ul>\n<p>어르신 접종 시작일을 연령별로 나눈 이유는 접종 초기 한꺼번에 몰리는 현상과 그로 인한 안전사고를 막기 위해서라고 질병관리청은 설명합니다. 시작일이 지나면 2027년 4월 30일까지 언제든 무료로 접종할 수 있습니다.<\/p>\n<h3>어린이 1회·2회 접종 대상 구분<\/h3>\n<p>올해는 접종 횟수와 관계없이 생후 6개월~14세 <strong>모든 어린이가 9월 21일부터<\/strong> 접종할 수 있습니다. 다만 생후 6개월~9세 미만 어린이 중 아래에 해당하면 <strong>2회 접종<\/strong>이 지원됩니다.<\/p>\n<ul>\n<li>인플루엔자 예방접종을 처음 하거나 이전 접종력을 모르는 경우<\/li>\n<li>2026년 6월 30일까지 인플루엔자 백신을 총 1회만 접종한 경우<\/li>\n<\/ul>\n<p>그 외 어린이는 1회 접종입니다. 두 번째 접종 시기 등 구체적인 일정과 횟수는 <strong>예진 의사와 상담<\/strong>하라고 안내돼 있습니다.<\/p>\n<h2>위탁의료기관 찾는 법과 준비물<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig3.png\" alt=\"독감 무료접종 위탁의료기관 찾기와 준비물\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>독감 국가예방접종은 <strong>주소지와 관계없이<\/strong> 가까운 위탁의료기관이나 보건소(보건지소, 보건진료소)에서 받을 수 있습니다. 전국 위탁의료기관은 약 2.3만 개소입니다.<\/p>\n<h3>예방접종도우미에서 찾는 순서<\/h3>\n<ol>\n<li>예방접종도우미 누리집(nip.kdca.go.kr)에 접속합니다.<\/li>\n<li><strong>예방접종관리 → 지정의료기관 찾기 → 인플루엔자 예방접종<\/strong> 메뉴로 들어갑니다.<\/li>\n<li>어린이·어르신·임신부 중 해당 대상을 고르고, 시/도·시/군/구·읍/면/동 또는 기관명으로 검색합니다.<\/li>\n<li>결과에 나온 병·의원 전화번호로 <strong>접종 가능 여부를 먼저 확인<\/strong>한 뒤 방문합니다.<\/li>\n<\/ol>\n<p>질병관리청은 일정이 조정된 만큼 방문 전에 관할 보건소나 예방접종도우미로 <strong>해당 기관의 접종 가능 여부를 반드시 확인<\/strong>하라고 권장하고 있습니다. 같은 메뉴에는 <strong>세포배양 인플루엔자 국가지원 백신 보유 의료기관<\/strong> 안내도 따로 있는데, 이 정보는 의료기관이 직접 표시한 것이라 역시 방문 전 확인이 필요합니다. 인터넷 사용이 어렵다면 관할 보건소에 전화로 물어봐도 됩니다.<\/p>\n<h3>준비물 체크리스트<\/h3>\n<ul>\n<li>[ ] 어르신·성인: <strong>신분증<\/strong> (접종 대상자 확인용)<\/li>\n<li>[ ] 어린이: 주민등록등본, 국민건강보험증 등 나이를 확인할 수 있는 서류<\/li>\n<li>[ ] 임신부: 산모수첩, 임신확인서 등 임신을 확인할 수 있는 서류<\/li>\n<li>[ ] 방문 전 전화로 접종 가능 여부 확인<\/li>\n<\/ul>\n<h2>코로나19 백신과 동시접종, 이렇게 안내됩니다<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig4.png\" alt=\"65세 이상 독감·코로나19 동시접종 일정\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>2026~2027절기부터 코로나19 예방접종은 임시예방접종에서 <strong>필수예방접종<\/strong>으로 전환됐습니다. 질병관리청은 65세 이상 어르신이 독감과 코로나19 접종 대상에 모두 해당하므로 <strong>접종기관 한 번 방문으로 동시 접종<\/strong>받을 것을 권고했습니다. 동시에 맞을 때는 <strong>각각 다른 부위<\/strong>에 접종합니다.<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:15px;\">\n<thead><tr><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">대상<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">독감 시작일<\/th><th style=\"border:1px solid #94a3b8;padding:8px;background:#e2e8f0;color:#0f172a;\">코로나19 시작일<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">75세 이상<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 6일(화)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 12일(월) (70세 이상)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">70~74세<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 12일(월)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 12일(월)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">65~69세<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 15일(목)<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">10월 15일(목)<\/td><\/tr>\n<tr><td style=\"border:1px solid #94a3b8;padding:8px;\">종료일<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2027년 4월 30일<\/td><td style=\"border:1px solid #94a3b8;padding:8px;\">2027년 6월 30일<\/td><\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>코로나19 접종은 신규 XFG 백신으로 연 1회(면역저하자는 2회) 접종합니다.<\/li>\n<li>12세 이상 면역저하자와 감염취약시설 입원·입소자도 10월 12일(월)부터 코로나19 접종을 시작합니다.<\/li>\n<li>75세 이상은 독감 시작일(10월 6일)과 코로나19 시작일(10월 12일)이 다르니, 한 번에 두 가지를 맞고 싶다면 방문하려는 기관에 <strong>두 백신 모두 접종 가능한지<\/strong> 미리 확인해 보세요.<\/li>\n<\/ul>\n<h2>독감 예방접종 효과 기간은? 언제부터 효과가 생기나요<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig5.png\" alt=\"독감 예방접종 효과: 접종 후 약 2주 뒤 방어 항체 형성\" style=\"width:100%;border-radius:12px;\"><\/p>\n<p>질병관리청 FAQ는 <strong>접종 후 약 2주가 지나면 방어 항체가 형성된다<\/strong>고 안내합니다. 즉 접종 직후부터 바로 보호되는 것은 아니라서, 그 사이에는 독감에 걸릴 수 있습니다.<\/p>\n<ul>\n<li><strong>100% 예방은 아닙니다.<\/strong> 백신 효과는 백신과 유행 바이러스의 일치 정도, 개인 면역 등에 따라 차이가 있습니다.<\/li>\n<li>그럼에도 백신은 감염 예방 외에 <strong>중증과 사망 위험을 낮추기 때문에<\/strong> 중요하다고 설명합니다.<\/li>\n<li><strong>매년 접종이 기준입니다.<\/strong> 어르신과 임신부는 이전 절기 접종력과 상관없이 매년 1회 접종합니다. 이번 절기 백신은 WHO 권고에 따라 A형(H1N1, H3N2)과 B형(Victoria) 백신주가 지난 절기와 모두 달라졌습니다.<\/li>\n<\/ul>\n<p>효과가 몇 개월 동안 유지되는지에 대해서는 이번 절기 공식 안내에서 구체적인 기간을 따로 제시하지 않았습니다. 그래서 이 글에서도 기간을 단정하지 않고, <strong>\"약 2주 후 방어 항체 형성, 매 절기 접종\"<\/strong>이라는 공식 안내만 정리했습니다.<\/p>\n<h2>접종 전후 주의사항<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/fig6.png\" alt=\"독감 예방접종 전후 주의사항\" style=\"width:100%;border-radius:12px;\"><\/p>\n<h3>접종 전: 예진 의사와 상담이 필요한 경우<\/h3>\n<p>예방접종도우미의 인플루엔자 백신 안내에서 <strong>금기<\/strong>로 적힌 경우는 생후 6개월 미만, 과거 인플루엔자 백신 접종 후 또는 백신 성분에 중증(생명에 위협적인) 알레르기 반응이 있었던 경우입니다. 또 중등증 이상의 급성 질환이 있으면 증상이 나아질 때까지 접종을 미루도록 하고 있습니다.<\/p>\n<p><strong>계란 알레르기<\/strong>가 있다면 접종 전에 반드시 의사와 상담한 뒤 접종 여부를 정하라고 안내합니다. 해당되는 항목이 있거나 걱정되는 점이 있다면 스스로 판단하지 말고 예진 때 의사에게 알리세요.<\/p>\n<h3>접종 후<\/h3>\n<ul>\n<li>접종 후 <strong>20~30분<\/strong>은 접종기관에 머물러 이상반응이 없는지 지켜본 뒤 귀가하고, 충분히 쉬어야 합니다.<\/li>\n<li>가장 흔한 이상반응은 <strong>접종 부위가 붉어지거나 아픈 것<\/strong>이며, 대부분 1~2일 안에 사라진다고 안내돼 있습니다.<\/li>\n<li>65세 이상, 면역저하자 등 고위험군은 발열이나 호흡기 증상이 생기면 <strong>일찍 의료기관을 방문해<\/strong> 진단과 치료를 받는 것이 필요합니다.<\/li>\n<\/ul>\n<p>접종 전후 모두 손 씻기, 기침 예절, 사람이 많은 곳에서 마스크 착용, 주기적인 환기 같은 호흡기감염병 예방수칙도 함께 지켜 달라는 것이 질병관리청의 당부입니다.<\/p>\n<h2>접종 전에 확인할 체크리스트<\/h2>\n<ul>\n<li>[ ] 우리 가족 중 무료 대상(2012.1.1.~2026.8.31. 출생 어린이, 임신부, 1961.12.31. 이전 출생 어르신)이 누구인지 확인했나요?<\/li>\n<li>[ ] 어르신이라면 출생연도에 맞는 시작일(10월 6일 / 12일 / 15일)을 달력에 적어 두었나요?<\/li>\n<li>[ ] 9세 미만 자녀가 처음 접종이거나 2026년 6월 30일까지 1회만 맞았다면 2회 접종 대상인지 예진 의사와 상담할 준비가 됐나요?<\/li>\n<li>[ ] 예방접종도우미 '지정의료기관 찾기'에서 가까운 기관을 찾고, 전화로 접종 가능 여부를 확인했나요?<\/li>\n<li>[ ] 신분증(어린이는 주민등록등본·건강보험증, 임신부는 산모수첩 등)을 챙겼나요?<\/li>\n<li>[ ] 65세 이상이라면 코로나19 동시접종이 가능한지 기관에 함께 물어봤나요?<\/li>\n<li>[ ] 접종 후 20~30분 머물 시간을 비워 두었나요?<\/li>\n<\/ul>\n<h2>마무리<\/h2>\n<p>정리하면 2026~2027절기 독감 무료 예방접종은 <strong>어린이(14세까지)·임신부는 9월 21일부터, 어르신은 10월 6일(75세 이상)부터 연령별로<\/strong> 시작되고, 모든 대상이 <strong>2027년 4월 30일<\/strong>까지 받을 수 있습니다. 올해는 일정이 앞당겨지고 백신 공급 상황도 빠듯한 편이라, 방문 전에 예방접종도우미나 보건소로 접종 가능 여부부터 확인해 보세요. 건강 상태에 따른 접종 여부는 예진 의사와 상담하시고, 궁금한 점은 질병관리청 콜센터(☎ 1339)나 관할 보건소에 물어보시면 가장 정확합니다.<\/p>\n<h2>출처<\/h2>\n<ul>\n<li>질병관리청 보도참고자료, <a href=\"https://www.kdca.go.kr/bbs/kdca/42/312642/artclView.do\" target=\"_blank\" rel=\"noopener\">이른 인플루엔자 유행에 대응해 어린이와 어르신 국가예방접종 앞당긴다(2026.9.16)<\/a><\/li>\n<li>질병관리청 보도참고자료, <a href=\"https://www.kdca.go.kr/bbs/kdca/42/312308/artclView.do\" target=\"_blank\" rel=\"noopener\">올겨울 인플루엔자 국가예방접종, 14세까지 확대해 9월 21일부터 순차 시행(2026.8.25, 붙임 FAQ 포함)<\/a><\/li>\n<li>질병관리청 보도자료, <a href=\"https://www.kdca.go.kr/bbs/kdca/42/312644/artclView.do\" target=\"_blank\" rel=\"noopener\">'26-'27절기 코로나19 국가예방접종 시행계획 발표(2026.9.17)<\/a><\/li>\n<li>대한민국 정책브리핑, <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972079\" target=\"_blank\" rel=\"noopener\">이른 인플루엔자 유행에 국가예방접종 앞당겨…어린이·임신부 21일부터(질병관리청, 2026.9.17)<\/a><\/li>\n<li>대한민국 정책브리핑, <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972097\" target=\"_blank\" rel=\"noopener\">코로나19 예방접종 '필수'로 전환…내달 12일부터 접종 시작(질병관리청, 2026.9.17)<\/a><\/li>\n<li>질병관리청 예방접종도우미, <a href=\"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuCd=134&amp;menuLv=1\" target=\"_blank\" rel=\"noopener\">2026-2027절기 인플루엔자 국가예방접종 사업 안내<\/a><\/li>\n<li>질병관리청 예방접종도우미, <a href=\"https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuCd=333&amp;menuLv=3&amp;menuSection=2\" target=\"_blank\" rel=\"noopener\">지정의료기관 찾기 – 인플루엔자 예방접종<\/a><\/li>\n<li>질병관리청 예방접종도우미, <a href=\"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuCd=1112&amp;menuLv=1\" target=\"_blank\" rel=\"noopener\">인플루엔자 – 금기사항·주의사항<\/a><\/li>\n<\/ul>\n";

    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y);
  return !!ok;
}

copyBtn.addEventListener('click', async () => {
  const text = editor.innerHTML;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  } else {
    const box = document.getElementById('rawBox');
    const hint = document.getElementById('rawHint');
    box.value = text;
    box.style.display = 'block';
    hint.style.display = 'block';
    box.scrollIntoView({ block: 'center' });
    alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
});

document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
    else document.execCommand(cmd, false, null);
    editor.focus();
  });
});
</script>
</body>
</html>
