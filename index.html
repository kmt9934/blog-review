<script>
const POSTS = {"b3": {"title": "연말정산 미리보기 전에: 신용카드 소득공제 계산", "html": "<h1>연말정산 미리보기 전에: 신용카드 소득공제 계산<\/h1>\n<p>총급여 5,000만 원인 직장인이 올해 카드로 2,200만 원을 썼다면 신용카드 소득공제는 얼마일까요? 신용카드 1,800만 원, 체크카드 400만 원으로 나눠 썼다면 공제액은 202만 5천 원이고, 같은 2,200만 원을 신용카드 1,250만 원과 체크카드 950만 원으로 썼다면 285만 원으로 82만 5천 원이 늘어나요. 쓴 돈은 같은데 결제수단 순서만 달라진 결과입니다.<\/p>\n<p>이 글은 신용카드 소득공제 계산을 숫자 예시부터 풀고, 공식과 한도, 남은 연말 결제 전략, 홈택스 연말정산 미리보기에 내 숫자를 넣는 순서까지 정리했습니다. 공제율과 한도는 <a href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033186513\" style=\"color:#174ea6;\">조세특례제한법 제126조의2<\/a>와 <a href=\"https://www.law.go.kr/LSW/flDownload.do?flSeq=168825161\" style=\"color:#174ea6;\">신용카드 등 소득공제 신청서(별지 제74호의6서식, 2026. 3. 20. 개정)<\/a>, 미리보기 일정은 <a href=\"https://i.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2209&nttSn=1355698\" style=\"color:#174ea6;\">국세청 뉴스레터 제1184호<\/a>를 기준으로 했어요. 2026년 10월 29일 기준, 2026년 귀속(2027년 1월 연말정산) 내용입니다.<\/p>\n<h2>총급여 5,000만 원, 카드 2,200만 원이면 공제는 얼마<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"신용카드 소득공제 계산 첫 예시 요약 카드\"><\/p>\n<p>첫 번째 예시의 조건은 이렇습니다. 총급여 5,000만 원, 부양자녀 없음, 올해 신용카드 사용액 1,800만 원, 체크카드 사용액 400만 원이에요. 전통시장·대중교통·문화체육 사용분은 없다고 두었습니다. 계산은 세 단계로 끝나요.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">첫 예시 계산 과정<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">최저사용금액: 총급여 5,000만 원 × 25% = 1,250만 원. 이 금액까지는 공제가 없습니다.<\/li><li style=\"color:#1c2f52;\">결제수단별 공제액 합계: 신용카드 1,800만 원 × 15% = 270만 원, 체크카드 400만 원 × 30% = 120만 원, 합계 390만 원<\/li><li style=\"color:#1c2f52;\">공제 제외금액: 신용카드 사용액(1,800만 원)이 최저사용금액보다 크므로 1,250만 원 × 15% = 187만 5천 원<\/li><li style=\"color:#1c2f52;\">공제 가능금액: 390만 원 − 187만 5천 원 = 202만 5천 원. 한도 300만 원 안이라 202만 5천 원이 그대로 공제됩니다.<\/li><\/ol><\/div>\n<p>여기서 202만 5천 원은 세금이 아니라 소득에서 빼 주는 금액이에요. 실제로 줄어드는 세금은 과세표준에 걸리는 소득세율을 곱해서 봐야 합니다. 과세표준이 1,400만 원 초과 5,000만 원 이하 구간(소득세율 15%)이라면 202만 5천 원 × 15% = 약 30만 4천 원, 지방소득세 10%를 더하면 약 33만 4천 원이 줄어드는 셈이에요.<\/p>\n<p>두 번째 줄의 예시처럼 신용카드를 1,250만 원까지만 쓰고 나머지 950만 원을 체크카드로 썼다면 어떻게 될까요? 결제수단별 공제액은 1,250만 원 × 15% = 187만 5천 원, 950만 원 × 30% = 285만 원으로 합계 472만 5천 원입니다. 신용카드 사용액이 최저사용금액과 같으니 제외금액은 똑같이 187만 5천 원이고, 공제 가능금액은 285만 원이 돼요. 첫 예시보다 82만 5천 원 많고, 15% 구간이라면 세금으로 약 13만 6천 원(지방소득세 포함) 차이입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">구분<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">신용카드 먼저 많이<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">문턱까지만 신용카드<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">신용카드 사용액<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,800만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1,250만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">체크카드 사용액<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">400만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">950만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">결제수단별 공제액 합계<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">390만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">472만 5천 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">공제 제외금액<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">187만 5천 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">187만 5천 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">소득공제액<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">202만 5천 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">285만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">세금 감소(15% 구간, 지방세 포함)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 33만 4천 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">약 47만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>신용카드 소득공제 계산 공식: 25% 문턱과 공제율<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"신용카드 소득공제 공식과 결제수단별 공제율 요약 카드\"><\/p>\n<p>공식의 뼈대는 신청서 서식에 그대로 적혀 있어요. 먼저 총급여의 25%를 <strong>최저사용금액<\/strong>으로 잡고, 결제수단별로 사용액에 공제율을 곱한 값을 모두 더한 뒤, 최저사용금액에 해당하는 부분의 공제액을 빼는 방식입니다. 총급여는 비과세 소득을 뺀 근로소득으로, 원천징수영수증의 「총급여」 칸 금액이에요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">결제수단<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">공제율<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">비고<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">신용카드<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">15%<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">최저사용금액을 채울 때 가장 먼저 차감<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">체크카드·선불카드·현금영수증<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">30%<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">직불카드 등으로 묶어서 계산<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">문화체육 사용분<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">30%<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">총급여 7천만 원 이하만 따로 계산<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">전통시장 사용분<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">40%<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">결제수단과 관계없이 40%<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">대중교통 이용분<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">40%<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">결제수단과 관계없이 40%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>제외금액을 계산할 때는 공제율이 낮은 사용분부터 최저사용금액을 채운다고 봅니다. 서식의 계산표는 세 경우로 나눠요. 신용카드 사용액만으로 문턱을 넘으면 문턱 × 15%를 빼고, 신용카드에 체크카드·현금영수증·문화체육을 더해야 넘으면 신용카드 × 15% + 나머지 부족분 × 30%를 빼며, 전통시장·대중교통까지 더해야 넘으면 그 부족분에 40%를 적용해 뺍니다.<\/p>\n<p>그래서 문턱까지는 어떤 수단으로 쓰든 신용카드로 채운 것으로 계산하는 편이 근로자에게 유리하고, 실제 서식도 그렇게 계산합니다. 반대로 문턱을 넘은 뒤에는 100만 원을 더 쓸 때 신용카드는 15만 원, 체크카드는 30만 원, 전통시장·대중교통은 40만 원이 공제 가능금액에 더해져요. 국세청도 한도를 넘으면 공제율이 낮은 신용카드 사용분부터 빼서 계산한다고 안내합니다.<\/p>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"최저사용금액 25%를 넘은 뒤 결제수단별 공제율이 15%, 30%, 40%로 달라지는 흐름도\"><figcaption>문턱 25%까지는 신용카드로 채우고, 넘은 뒤엔 공제율이 높은 수단이 유리<\/figcaption><\/figure>\n<h2>총급여와 자녀 수로 바뀌는 공제 한도<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"총급여와 자녀 수별 신용카드 소득공제 한도 요약 카드\"><\/p>\n<p>2026년 귀속부터 기본공제 한도가 자녀 수에 따라 나뉩니다. <a href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033186513\" style=\"color:#174ea6;\">조세특례제한법 제126조의2 제10항<\/a>은 2025년 12월 23일 개정으로, 총급여 7천만 원 이하는 연 300만 원, 자녀 등이 1명이면 350만 원, 2명 이상이면 400만 원을 한도로 정했어요. 7천만 원을 넘으면 250만 원, 275만 원, 300만 원입니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">기본공제 한도<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">총급여 7천만 원 이하<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">총급여 7천만 원 초과<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">부양자녀 없음<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">300만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">250만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">부양자녀 1명<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">350만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">275만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">부양자녀 2명 이상<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">400만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">300만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">추가공제 한도(전통시장·대중교통 등)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">300만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">200만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>여기서 부양자녀는 근로자 본인의 소득·세액공제 신고서에 기본공제 대상으로 올린 직계비속이에요. 서식 작성요령에 따르면 20세 이하(장애인은 나이 요건 없음)이면서 연 소득금액 100만 원(근로소득만 있으면 총급여 500만 원) 이하여야 하고, 동거입양자·위탁아동·재혼자의 자녀도 포함됩니다. 다른 사람이 기본공제를 받은 자녀는 세지 않아요.<\/p>\n<p>기본공제 한도를 넘는 금액이 있으면 전통시장·대중교통(총급여 7천만 원 이하는 문화체육 포함) 사용분에 대해 추가공제를 따로 받을 수 있습니다. 추가공제액은 한도 초과분과 그 특정 사용분 공제액 중 적은 금액이고, 위 표의 추가공제 한도(300만 원 또는 200만 원)를 넘지 못해요. 그래서 한도를 이미 채운 사람에게는 전통시장과 대중교통 결제가 마지막까지 공제를 늘리는 수단이 됩니다.<\/p>\n<p>총급여 7천만 원 초과자는 문화체육 사용분을 따로 30%로 계산하지 않고, 결제한 수단(신용카드·체크카드·현금영수증)의 공제율로 들어갑니다. 공연·도서 결제가 많은 고소득 근로자라면 이 차이를 계산에 반영해야 해요.<\/p>\n<h2>자녀 2명, 총급여 8,000만 원인 경우 다시 계산<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"총급여 8천만 원 자녀 2명 신용카드 소득공제 계산 요약 카드\"><\/p>\n<p>조건이 바뀌면 결과가 어떻게 달라지는지 두 번째 예시로 보겠습니다. 총급여 8,000만 원, 기본공제 대상 자녀 2명, 신용카드 3,000만 원, 체크카드 1,000만 원, 그리고 신용카드로 낸 대중교통 요금 100만 원이 있다고 두었어요.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">두 번째 예시 계산 과정<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">최저사용금액: 8,000만 원 × 25% = 2,000만 원<\/li><li style=\"color:#1c2f52;\">결제수단별 공제액: 신용카드 3,000만 원 × 15% = 450만 원, 체크카드 1,000만 원 × 30% = 300만 원, 대중교통 100만 원 × 40% = 40만 원, 합계 790만 원<\/li><li style=\"color:#1c2f52;\">제외금액: 신용카드만으로 문턱을 넘으므로 2,000만 원 × 15% = 300만 원 → 공제 가능금액 490만 원<\/li><li style=\"color:#1c2f52;\">일반 공제: 한도 300만 원(7천만 원 초과·자녀 2명)과 비교해 300만 원<\/li><li style=\"color:#1c2f52;\">추가공제: 한도 초과분 190만 원과 대중교통 공제액 40만 원 중 적은 40만 원(추가 한도 200만 원 안)<\/li><li style=\"color:#1c2f52;\">최종 소득공제: 300만 원 + 40만 원 = 340만 원<\/li><\/ol><\/div>\n<p>과세표준이 5,000만 원 초과 8,800만 원 이하 구간(소득세율 24%)이라면 340만 원 × 24% = 81만 6천 원, 지방소득세를 더하면 약 89만 8천 원의 세금이 줄어요. 같은 사람이 자녀가 없었다면 일반 공제 한도가 250만 원이라 최종 공제는 290만 원이 됩니다. 자녀 2명이라는 조건 하나로 공제가 50만 원, 세금은 약 13만 2천 원 차이가 나는 셈이에요.<\/p>\n<p>이 사람은 이미 기본 한도를 190만 원 넘겨 쓰고 있어서, 연말까지 신용카드든 체크카드든 일반 결제를 더 늘려도 공제는 늘지 않습니다. 남은 기간에 공제를 늘릴 수 있는 건 전통시장과 대중교통 사용분뿐이고, 추가 한도 200만 원 중 40만 원만 쓰고 있으니 여유가 있어요. 예를 들어 전통시장에서 200만 원을 더 쓰면 80만 원이 추가공제에 더해집니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">조건<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">일반 공제<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">추가공제<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">최종 공제<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">자녀 2명(이 예시)<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">300만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">40만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">340만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">자녀 1명<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">275만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">40만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">315만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">자녀 없음<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">250만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">40만 원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">290만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>남은 두 달은 어느 카드로 결제할까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"연말까지 남은 기간 결제수단 고르는 기준 요약 카드\"><\/p>\n<p>10월 말에 할 일은 지금까지 쓴 금액이 문턱과 한도 사이에서 어디쯤인지 보는 것이에요. 위치에 따라 남은 결제의 정답이 달라집니다. 아래 세 경우는 위 공식을 그대로 적용한 결과예요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">지금 위치<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">남은 기간 결제<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">이유<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">문턱(총급여 25%) 아래<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">어느 수단이든 문턱까지는 공제 0원, 신용카드 혜택을 써도 손해 없음<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">문턱까지는 신용카드로 채운 것으로 계산<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">문턱 위, 한도 아래<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">체크카드·현금영수증(30%), 전통시장·대중교통(40%)<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">같은 100만 원에 공제 15만 원 대신 30만~40만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">기본 한도 이미 초과<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">전통시장·대중교통(문화체육은 7천만 원 이하만)<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">일반 결제는 더 써도 공제 0원, 추가공제만 남음<\/td><\/tr><\/tbody><\/table><\/div>\n<p>예를 들어 총급여 5,000만 원인 사람이 1~9월 신용카드로 1,000만 원을 썼다면 문턱 1,250만 원까지 250만 원이 남아 있어요. 10~12월에 쓸 돈이 400만 원이라면 처음 250만 원은 신용카드든 체크카드든 공제 결과가 같고, 나머지 150만 원을 체크카드로 쓰면 45만 원, 신용카드로 쓰면 22만 5천 원이 공제 가능금액에 들어갑니다.<\/p>\n<p>공제를 위해 필요 없는 소비를 늘리는 건 손해예요. 문턱을 넘긴 뒤 100만 원을 체크카드로 더 써도 15% 구간이면 줄어드는 세금은 약 5만 원(30만 원 × 16.5%)이라, 쓰는 돈보다 돌려받는 돈이 훨씬 적습니다. 이미 쓸 예정인 지출의 결제수단만 바꾸는 쪽으로 계획하는 게 맞아요.<\/p>\n<p>맞벌이라면 신용카드 공제는 카드 명의인 기준으로 계산합니다(현금영수증은 영수증 거래자 기준). 배우자 카드 사용액은 배우자가 연 소득금액 100만 원(근로소득만 있으면 총급여 500만 원) 이하일 때만 내 공제에 합칠 수 있으니, 둘 다 소득이 있으면 각자 자기 문턱과 한도로 따로 계산해야 해요.<\/p>\n<h2>연말정산 미리보기에 내 숫자 넣는 순서<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"홈택스 연말정산 미리보기 이용 순서 요약 카드\"><\/p>\n<p>손으로 계산한 값이 맞는지는 홈택스에서 바로 비교해 볼 수 있어요. <a href=\"https://i.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2209&nttSn=1355698\" style=\"color:#174ea6;\">국세청 안내<\/a>에 따르면 2026년 귀속 연말정산 미리보기는 10월 28일(수)부터 12월 18일(금)까지 열리고, 1~9월 카드 사용금액이 이미 들어가 있습니다. 메뉴 경로와 단계는 국세청 안내 기준이에요.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">홈택스 연말정산 미리보기 따라 하기<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\"><a href=\"https://www.hometax.go.kr\" style=\"color:#174ea6;\">홈택스<\/a>에 로그인 → 「장려금·연말정산·기부금」 → 「편리한 연말정산」 → 「연말정산 미리보기」<\/li><li style=\"color:#1c2f52;\">1단계: 전년도 지급명세서를 불러오고 올해 예상 총급여와 이미 낸 세액을 입력<\/li><li style=\"color:#1c2f52;\">2단계: 1~9월 신용카드 등 사용금액을 확인하고 10~12월 예상 지출액을 결제수단별로 입력<\/li><li style=\"color:#1c2f52;\">3단계: 주택자금·보험료·의료비·교육비 같은 공제항목 예상 지출액을 수정<\/li><li style=\"color:#1c2f52;\">4단계: 예상세액과 최근 3년 공제금액·세액 변동 추이를 확인<\/li><\/ol><\/div>\n<p>2단계에서 10~12월 예상 지출을 신용카드와 체크카드로 바꿔 넣어 보면, 위에서 계산한 결제수단 차이가 예상세액으로 바로 보여요. 화면의 카드 사용액이 실제보다 적으면 카드사가 자료를 아직 내지 않았기 때문일 수 있습니다. 국세청은 누락분이 2027년 1월 개통 예정인 연말정산 간소화 서비스에서 제공된다고 안내해요.<\/p>\n<p>미리보기 결과는 전년도 자료와 입력값으로 계산한 예상치라서 실제 연봉과 지출이 바뀌면 달라집니다. 성년 자녀의 공제자료를 보려면 자녀가 따로 자료 제공 동의를 해야 하니, 자녀 카드 사용액을 합치려는 가정은 미리 동의를 받아 두면 1월에 덜 바빠요.<\/p>\n<div style=\"background:#eef4fb;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">계산 기준 원문 바로 가기<\/h3><p style=\"margin:0 0 12px;line-height:1.7;color:#1c2f52;\">공제율·한도 원문과 미리보기 서비스로 이동합니다.<\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.hometax.go.kr\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#174ea6;color:#ffffff;font-weight:700;text-decoration:none;\">홈택스 연말정산 미리보기<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033186513\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">조세특례제한법 제126조의2 한도 조문<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.law.go.kr/LSW/flDownload.do?flSeq=168825161\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">신용카드 등 소득공제 신청서 서식<\/a><\/p><\/div>\n<h3>신용카드 소득공제 계산에서 자주 나오는 질문<\/h3>\n<p><strong>체크카드만 쓰면 무조건 유리한가요?<\/strong> 문턱 아래 구간에서는 공제가 없고, 문턱 계산은 신용카드로 채운 것으로 보니 결과가 같아요. 차이는 문턱을 넘은 뒤 사용분에서 생깁니다.<\/p>\n<p><strong>미리보기 금액이 실제 환급액인가요?<\/strong> 아니에요. 국세청은 예상세액이 확정 금액이 아니며 실제 소득과 지출에 따라 달라진다고 안내합니다.<\/p>\n<h3>이 글의 숫자 출처<\/h3>\n<ul><li><a href=\"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1033186513\" style=\"color:#174ea6;\">국가법령정보센터, 조세특례제한법 제126조의2 제10항(2025. 12. 23. 개정)<\/a><\/li><li><a href=\"https://www.law.go.kr/LSW/flDownload.do?flSeq=168825161\" style=\"color:#174ea6;\">국가법령정보센터, 별지 제74호의6서식 신용카드 등 소득공제 신청서(2026. 3. 20. 개정)<\/a><\/li><li><a href=\"https://i.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2209&nttSn=1355698\" style=\"color:#174ea6;\">국세청 뉴스레터 제1184호, 연말정산 미리보기 서비스(2026. 10. 26.)<\/a><\/li><li><a href=\"https://www.hometax.go.kr\" style=\"color:#174ea6;\">국세청 홈택스<\/a><\/li><\/ul>"}};
const TABS = ["b3"];
for (const id of TABS) {
  const p = POSTS[id];
  if (p) document.getElementById('ed-' + id).innerHTML = p.html;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }
document.querySelectorAll('button.copyt, button.copyd').forEach(btn => btn.addEventListener('click', async () => {
  const isDesc = btn.classList.contains('copyd');
  const text = document.getElementById((isDesc ? 'desc-' : 'title-') + btn.dataset.tab).value;
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast(isDesc ? '검색 설명 복사됨 ✓' : '제목 복사됨 ✓'); else alert('자동 복사가 안 됩니다. 칸을 길게 눌러 복사하세요.');
}));
function show(id) {
  if (!TABS.includes(id)) id = TABS[0];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + id));
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
</html>
