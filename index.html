<script>
const POSTS = {"b3": {"title": "확정일자 온라인 신청 방법: 인터넷등기소 500원 절차와 최우선변제 금액 계산", "html": "<h1>확정일자 온라인 신청 방법: 인터넷등기소 500원 절차와 최우선변제 금액 계산<\/h1>\n<p>전월세 계약서에 도장을 찍었다면 확정일자는 이사 당일까지 받아 두는 편이 안전합니다. 주민센터에 가면 600원, <a href=\"https://www.iros.go.kr/\" style=\"color:#174ea6;\">대법원 인터넷등기소<\/a>에서 온라인으로 신청하면 500원이고, 온라인은 밤이나 주말에도 접수됩니다. 다만 평일 18시 이후나 휴일에 낸 신청은 다음 근무일 날짜로 찍힌다는 점을 알고 시간을 정해야 해요.<\/p>\n<p>이 글은 인터넷등기소에서 확정일자를 받는 순서를 화면 흐름대로 따라가고, 확정일자와 전입신고가 합쳐졌을 때 경매에서 보증금을 얼마까지 먼저 돌려받는지 지역별 숫자로 계산해 봅니다. 금액 기준은 <a href=\"https://www.law.go.kr/LSW/lsInfoP.do?lsId=004950\" style=\"color:#174ea6;\">주택임대차보호법 시행령<\/a> 제10조·제11조(2026년 10월 현행)이고, 절차는 법제처 생활법령정보와 구청 안내문을 대조했습니다.<\/p>\n<h2>신청 전에 준비할 것: 인증서와 계약서 스캔본<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig1.png\" alt=\"확정일자 온라인 신청 준비물 요약 카드\"><\/p>\n<p>온라인 확정일자는 인터넷등기소 회원으로 로그인해야 신청할 수 있습니다. 본인 확인에는 실명을 확인할 수 있는 전자서명 인증서가 필요해요. 공동인증서나 등기소가 지정한 금융인증서 등이 여기에 해당하고, 아이디·비밀번호만으로는 신청 단계에 들어가지 못합니다.<\/p>\n<p>두 번째 준비물은 계약서 스캔 파일입니다. 사본이 아니라 <strong>원본을 스캔<\/strong>해야 하고, 임대인·임차인 인적사항, 주택 소재지, 임대 목적물, 임대 기간, 보증금과 차임이 모두 읽혀야 합니다. 이 중 하나라도 흐릿하면 반려 사유가 되고, 반려되면 접수 자체가 없던 일로 처리되어 확정일자 날짜도 생기지 않아요.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">항목<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">인터넷등기소<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">주민센터·등기소 방문<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">수수료<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">건당 500원<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">건당 600원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">신청 가능 시간<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">24시간 365일 접수<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">평일 업무시간<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">필요한 것<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">인증서, 계약서 원본 스캔 파일<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">계약서 원본, 신분증<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">신청할 수 있는 사람<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">임대인·임차인, 작성한 개업공인중개사, 변호사·법무사<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">계약서를 가진 사람<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">대상 계약<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">주택임대차계약서만(상가·일반 문서 불가)<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">주택·상가 등<\/td><\/tr><\/tbody><\/table><\/div>\n<p>온라인은 주택임대차계약서만 받습니다. 상가 임대차 계약서는 관할 세무서나 방문 창구로 가야 해요. 계약을 중개한 공인중개사도 대신 신청할 수 있어서, 계약하는 날 중개사무소에서 바로 처리해 달라고 요청하는 방법도 있습니다. 이 경우 계약서 발급은 1회만 가능하므로 당사자 본인 계정으로 다시 받아 두는 편이 편합니다.<\/p>\n<h2>인터넷등기소에서 확정일자 받는 순서<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig2.png\" alt=\"인터넷등기소 전자확정일자 신청 단계 요약 카드\"><\/p>\n<p>인터넷등기소 첫 화면 상단의 확정일자 메뉴에서 시작합니다. 전체 흐름은 인증서로 로그인, 신청서 작성, 계약서 파일 첨부, 수수료 결제, 제출, 확정일자 부여 확인 순서이고, 신청서는 기본정보, 계약정보, 신청인정보 세 화면으로 나뉘어 있습니다.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">전자확정일자 신청 단계(2026년 10월 화면 기준)<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">인터넷등기소 로그인 → 상단 「확정일자」 메뉴 → 「신청서 작성 및 제출」<\/li><li style=\"color:#1c2f52;\">유의사항 팝업에서 동의 체크 → 「신규」 버튼<\/li><li style=\"color:#1c2f52;\">기본정보: 주택 소재지 입력, 부동산 검색으로 등기상 소재지 확인 후 저장<\/li><li style=\"color:#1c2f52;\">계약정보: 계약일, 임대 기간, 보증금·차임을 계약서와 똑같이 입력<\/li><li style=\"color:#1c2f52;\">신청인정보 입력 → 계약서 원본 스캔 파일 첨부<\/li><li style=\"color:#1c2f52;\">수수료 500원 결제 → 제출 → 처리 상태와 부여일자 확인<\/li><li style=\"color:#1c2f52;\">부여 후 「미발급 내역보기」에서 확정일자 이미지가 찍힌 계약서를 내려받아 보관<\/li><\/ol><\/div>\n<p>입력값과 첨부한 계약서 내용이 다르면 계약서 쪽이 기준이 됩니다. 보증금을 잘못 쳤더라도 계약서가 맞으면 계약서 내용으로 확정일자부가 만들어지는 구조예요. 그래도 처리 중 확인이 늦어질 수 있으니 숫자는 계약서를 옆에 두고 그대로 옮기는 편이 좋습니다.<\/p>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag1.png\" alt=\"평일 근무시간, 평일 16시 이후, 18시 이후·휴일 신청별 확정일자 부여일을 보여 주는 그림\"><figcaption>18시 이후·휴일 신청은 다음 근무일 날짜<\/figcaption><\/figure>\n<p>부여일자 규칙은 시간을 정할 때 중요합니다. 평일 근무시간 안에 신청하면 특별한 사정이 없는 한 당일 날짜가 부여되고, 평일 16시 이후 신청은 다음 근무일로 넘어갈 수 있습니다. 평일 18시 이후, 토요일, 공휴일 접수 건은 다음 근무일 날짜예요. 잔금일과 이삿날이 금요일 저녁이라면, 낮에 미리 신청하거나 창구를 찾는 쪽이 하루 이틀을 아끼는 방법입니다.<\/p>\n<h2>주민센터 방문과 임대차 신고, 어느 쪽이 맞을까<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig3.png\" alt=\"확정일자 받는 세 가지 경로 비교 요약 카드\"><\/p>\n<p>방문 신청은 계약서 원본과 신분증만 들고 주민센터나 등기소에 가면 됩니다. 담당자가 계약서에 확정일자 도장을 바로 찍어 주므로 부여일을 그 자리에서 확인할 수 있어요. 이사 당일 전입신고를 하러 간 김에 함께 처리하면 한 번에 끝납니다.<\/p>\n<p>세 번째 경로는 주택 임대차 신고입니다. 보증금 6천만 원을 넘거나 월세 30만 원을 넘는 계약은 계약일부터 30일 안에 신고해야 하는데, 계약서를 첨부해 신고하면 확정일자가 함께 부여됩니다. 수수료도 없어요. 반대로 보증금 3천만 원에 월세 25만 원처럼 신고 대상이 아닌 계약은 이 경로를 쓸 수 없고, 인터넷등기소나 방문 창구로 가야 합니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">내 계약<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">추천 경로<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">비용<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">보증금 6천만 원 초과 또는 월세 30만 원 초과<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">임대차 신고(계약서 첨부)로 함께 처리<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">무료<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">신고 대상이 아니고 평일 낮에 시간이 없음<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">인터넷등기소 전자확정일자<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">500원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">이사 당일 전입신고하러 주민센터에 감<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">전입신고와 함께 방문 신청<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">600원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">금요일 저녁 잔금, 당일 날짜가 꼭 필요<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">당일 낮 방문 또는 낮 시간 온라인 신청<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">500~600원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>어느 경로로 받든 효력은 같습니다. 다만 받은 사실을 증명할 서류는 남겨야 해요. 방문 신청은 도장이 찍힌 계약서 원본, 온라인은 확정일자 이미지가 표시된 계약서 출력본이 그 증거입니다. 계약서를 잃어버려도 계약 당사자는 인터넷등기소에서 온라인으로 받은 계약서를 다시 발급받을 수 있습니다.<\/p>\n<h2>확정일자와 전입신고가 함께 있어야 하는 이유<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig4.png\" alt=\"대항력과 우선변제권 효력 발생 시점 요약 카드\"><\/p>\n<p>확정일자 하나만으로는 보증금이 지켜지지 않습니다. 주택임대차보호법은 집을 넘겨받아 실제로 살고(주택의 인도) 전입신고를 마친 것을 대항요건으로 보고, 이 대항요건에 확정일자까지 갖춰야 경매에서 순위에 따라 보증금을 받는 우선변제권을 줍니다. 대항력은 전입신고 다음 날 0시부터 생겨요.<\/p>\n<p>우선변제권의 순위는 대항요건과 확정일자 중 <strong>늦은 날<\/strong>을 기준으로 정해집니다. 이사 당일 전입신고와 확정일자를 함께 했다면 다음 날 0시가 기준이고, 몇 달 살다가 확정일자만 나중에 받았다면 그 확정일자 날짜가 기준입니다. 그 사이에 집주인이 대출을 받아 근저당이 먼저 설정되면 그 은행이 앞 순위가 됩니다.<\/p>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">날짜가 순위를 바꾸는 예<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">3월 2일 이사·전입신고·확정일자 → 3월 3일 0시부터 우선변제 순위 확보<\/li><li style=\"color:#1c2f52;\">같은 집에 3월 2일 오후 근저당 설정 → 근저당은 당일, 임차인은 다음 날이라 은행이 앞섬<\/li><li style=\"color:#1c2f52;\">전입신고만 하고 확정일자를 7월 10일에 받음 → 순위 기준은 7월 10일<\/li><li style=\"color:#1c2f52;\">그 사이 5월에 근저당 설정 → 경매 배당에서 은행이 먼저<\/li><\/ol><\/div>\n<p>이사 날과 잔금 날에 집주인이 대출을 일으키는 일은 드물지만, 전입신고 효력이 하루 늦게 생긴다는 점 때문에 생기는 분쟁 사례가 있습니다. 잔금 직전 등기부등본을 한 번 더 떼어 새 근저당이 없는지 보는 이유가 여기에 있어요. 등기부등본 열람도 인터넷등기소에서 할 수 있습니다.<\/p>\n<h2>지역별 최우선변제 금액 계산해 보기<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig5.png\" alt=\"지역별 소액임차인 기준과 최우선변제 금액 요약 카드\"><\/p>\n<p>보증금이 일정 금액 이하인 소액임차인은 확정일자가 늦어 순위에서 밀리더라도, 경매신청 등기 전에 전입신고와 입주를 마쳤다면 보증금 중 일부를 은행보다 먼저 받습니다. 이것이 최우선변제이고, 기준 금액은 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=5&cciNo=2&cnpClsNo=2&csmSeq=629&popMenu=ov\" style=\"color:#174ea6;\">법제처 생활법령정보<\/a>와 시행령에 지역별로 정해져 있습니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">지역<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">소액임차인 보증금 기준<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">최우선변제 최대 금액<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">서울특별시<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1억 6,500만 원 이하<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">5,500만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">과밀억제권역(서울 제외), 세종, 용인, 화성, 김포<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">1억 4,500만 원 이하<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">4,800만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">광역시(군 제외), 안산, 광주, 파주, 이천, 평택<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">8,500만 원 이하<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,800만 원<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">그 밖의 지역<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">7,500만 원 이하<\/td><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">2,500만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<div style=\"background:#f7faff;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">보증금별로 계산해 보기<\/h3><ol style=\"margin:0;padding-left:20px;line-height:1.8;color:#1c2f52;\"><li style=\"color:#1c2f52;\">서울, 보증금 1억 5,000만 원: 기준 1억 6,500만 원 이하라 소액임차인 → 최대 <strong style=\"color:#1c2f52;\">5,500만 원<\/strong> 먼저 배당<\/li><li style=\"color:#1c2f52;\">서울, 보증금 2억 원: 기준 초과 → 최우선변제 없음, 확정일자 순위로만 배당<\/li><li style=\"color:#1c2f52;\">수원(과밀억제권역), 보증금 1억 2,000만 원: 최대 <strong style=\"color:#1c2f52;\">4,800만 원<\/strong><\/li><li style=\"color:#1c2f52;\">그 밖의 지역, 보증금 6,000만 원, 집이 4,000만 원에 매각: 2,500만 원이 매각가의 절반(2,000만 원)을 넘어 <strong style=\"color:#1c2f52;\">2,000만 원<\/strong>까지<\/li><\/ol><\/div>\n<figure><img src=\"https://kmt9934.github.io/blog-review/b3/diag2.png\" alt=\"서울 5500만 원, 과밀억제권역 4800만 원, 광역시 2800만 원, 그 밖 2500만 원 최우선변제 금액 막대 그림\"><figcaption>보증금 기준 이하일 때만 적용<\/figcaption><\/figure>\n<p>마지막 예처럼 최우선변제 금액은 주택가액의 절반을 넘을 수 없습니다. 한 집에 소액임차인이 여럿이면 그 합계가 절반을 넘지 않도록 비율로 나눠요. 또 금액 기준은 2023년 2월 21일에 올랐는데, 그 전에 근저당이 설정된 집은 은행과의 관계에서 예전 기준을 적용받습니다. 근저당 설정일이 오래된 집이라면 위 표보다 적게 받을 수 있다는 뜻이에요.<\/p>\n<p>계약을 갱신하면서 보증금을 올려 기준을 넘기면 소액임차인 보호를 잃는다는 판례도 있습니다. 서울에서 1억 6,000만 원으로 살다가 1억 7,000만 원으로 올려 재계약한다면, 최우선변제 대신 확정일자 순위에 기대야 하므로 새 확정일자를 받기 전에 등기부등본의 선순위 채권 금액을 다시 따져 보는 편이 안전합니다.<\/p>\n<h2>반려·재계약·분실 때 다시 할 일<\/h2>\n<p><img src=\"https://kmt9934.github.io/blog-review/b3/fig6.png\" alt=\"확정일자 반려와 재계약 때 다시 할 일 요약 카드\"><\/p>\n<p>온라인 신청이 반려되면 등록한 휴대전화 문자나 메일로 알림이 옵니다. 반려 사유는 대부분 세 가지예요. 계약서 파일을 첨부하지 않았거나, 첨부 파일에서 인적사항·소재지·기간·금액을 읽을 수 없거나, 이미 확정일자를 받은 같은 계약서를 내용 변경 없이 다시 냈을 때입니다. 반려 건은 접수되지 않은 것으로 처리되므로 날짜를 지키려면 바로 다시 내야 합니다.<\/p>\n<div style=\"overflow-x:auto;margin:20px 0;\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.55;border:1px solid #d8e1ec;\"><thead><tr><th style=\"border:1px solid #d8e1ec;padding:10px;background:#1c2f52;color:#fff;\">상황<\/th><th style=\"border:1px solid #d8e1ec;padding:10px;background:#eaf2fb;color:#1c2f52;\">다시 할 일<\/th><\/tr><\/thead><tbody><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">스캔이 흐려 반려<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">원본을 다시 스캔해 새로 신청(반려 건은 효력 없음)<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">보증금을 올려 재계약<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">변경된 계약서로 새 확정일자 받기, 증액분은 새 날짜 순위<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">금액 변동 없이 기간만 연장<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">기존 확정일자 순위 유지, 새 계약서 보관<\/td><\/tr><tr><th style=\"border:1px solid #d8e1ec;padding:10px;text-align:left;background:#f7faff;color:#1c2f52;\">계약서 분실<\/th><td style=\"border:1px solid #d8e1ec;padding:10px;color:#1c2f52;\">온라인으로 받은 경우 인터넷등기소에서 다시 발급<\/td><\/tr><\/tbody><\/table><\/div>\n<p>재계약에서 보증금을 올렸다면 올린 금액에는 새 확정일자가 필요합니다. 처음 보증금은 처음 확정일자 순위를 그대로 갖고, 증액분만 새 날짜 순위로 따로 계산돼요. 그래서 증액 계약서에도 확정일자를 받고, 처음 계약서와 함께 보관해야 경매 때 두 순위를 모두 주장할 수 있습니다.<\/p>\n<p><a href=\"https://www.ydp.go.kr/www/selectBbsNttView.do?bbsNo=41&key=2850&nttNo=200166&pageIndex=43&pageUnit=10\" style=\"color:#174ea6;\">영등포구청의 온라인 확정일자 안내<\/a>처럼 구청 안내문도 같은 내용을 설명하고 있으니, 동네 주민센터 업무시간과 함께 확인해 두면 이삿날 동선을 짜기 쉽습니다. 확정일자 부여 현황은 계약 당사자나 이해관계인이 정보제공 요청으로 열람할 수 있고 이것도 건당 500원입니다.<\/p>\n<div style=\"background:#eef4fb;border:1px solid #cddbee;border-radius:14px;padding:16px 18px;margin:20px 0;color:#1c2f52;\"><h3 style=\"margin:0 0 8px;color:#1c2f52;\">확정일자 신청과 보호 기준 공식 페이지<\/h3><p style=\"margin:0 0 12px;line-height:1.7;color:#1c2f52;\">온라인 신청은 인증서 로그인이 필요하고, 생활법령 안내는 로그인 없이 볼 수 있습니다.<\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.iros.go.kr/\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#174ea6;color:#ffffff;font-weight:700;text-decoration:none;\">대법원 인터넷등기소에서 확정일자 신청 →<\/a><\/p><p style=\"margin:0 0 8px;color:#1c2f52;\"><a class=\"official-link-btn\" href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=5&cciNo=2&cnpClsNo=2&csmSeq=629&popMenu=ov\" style=\"display:inline-block;padding:10px 16px;border-radius:10px;background:#ffffff;border:2px solid #174ea6;color:#174ea6;font-weight:700;text-decoration:none;\">생활법령 소액보증금 우선변제 안내 →<\/a><\/p><\/div>\n<h3>참고한 법령과 기관 안내<\/h3><ul><li><a href=\"https://www.law.go.kr/LSW/lsInfoP.do?lsId=004950\">국가법령정보센터 주택임대차보호법 시행령 제10조·제11조<\/a><\/li><li><a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=5&cciNo=2&cnpClsNo=2&csmSeq=629&popMenu=ov\">법제처 찾기쉬운 생활법령정보: 소액보증금 우선변제<\/a><\/li><li><a href=\"https://www.iros.go.kr/\">대법원 인터넷등기소<\/a><\/li><li><a href=\"https://www.ydp.go.kr/www/selectBbsNttView.do?bbsNo=41&key=2850&nttNo=200166&pageIndex=43&pageUnit=10\">영등포구청 온라인 확정일자 안내<\/a><\/li><\/ul>"}};

show(location.hash.slice(1));

function legacyCopy(text) {
  let ok = false; const y = window.scrollY;
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch (e) { ok = false; }
  window.scrollTo(0, y); return !!ok;
}
document.querySelectorAll('button.copy').forEach(btn => btn.addEventListener('click', async () => {
  const id = btn.dataset.tab;
  const body = document.getElementById('ed-' + id).cloneNode(true);
  body.querySelectorAll('h1').forEach(h => h.remove());  // title goes in the blog title field (제목 복사)
  const text = body.innerHTML.replace(/^\s+/, '');
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) ok = legacyCopy(text);
  if (ok) toast('HTML 복사됨 ✓');
  else {
    const box = document.getElementById('raw-' + id); box.value = text; box.style.display = 'block';
    box.scrollIntoView({ block: 'center' }); alert('자동 복사가 안 됩니다. 아래 박스를 길게 눌러 전체 복사하세요.');
  }
}));

document.querySelectorAll('.toolbar button').forEach(btn => btn.addEventListener('click', () => {
  const cmd = btn.dataset.cmd;
  if (cmd === 'formatBlock') document.execCommand('formatBlock', false, btn.dataset.val);
  else document.execCommand(cmd, false, null);
}));
</script>
</body>
